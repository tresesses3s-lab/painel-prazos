<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E5BD8">
<meta name="description" content="Agenda de prazos, tarefas e delegação a partir do Diário de Justiça Eletrônico Nacional.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icone.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prazos">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Painel de Prazos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F6F8FC; --surface:#FFFFFF; --surf-2:#EFF3FA; --surf-3:#E3EAF6;
  --ink:#141A26; --ink-2:#3A465C; --muted:#6E7B92; --line:#DFE6F1; --line-2:#C6D2E6;
  --azul:#2E5BD8; --azul-s:#E4EBFC;
  --verde:#0E9F63; --verde-s:#DFF5EB;
  --ambar:#DE8A08; --ambar-s:#FDF0DC;
  --rosa:#DB2F4C; --rosa-s:#FCE4E8;
  --violeta:#7A45D6; --violeta-s:#EFE7FC;
  --teal:#0C9AA0; --teal-s:#DDF3F4;
  --ouro:#E0A008; --ouro-s:#FDF3D8;
  --on-cor:#FFFFFF;
  --sh-s:0 1px 2px rgba(24,40,80,.06);
  --sh-m:0 2px 5px rgba(24,40,80,.06), 0 10px 24px -14px rgba(24,40,80,.28);
  --sh-l:0 4px 8px rgba(24,40,80,.07), 0 24px 48px -22px rgba(24,40,80,.34);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1219; --surface:#171D28; --surf-2:#1F2734; --surf-3:#2A3342;
  --ink:#E9EEF7; --ink-2:#C3CDDD; --muted:#8593A9; --line:#252E3C; --line-2:#36415320;
  --azul:#6D93F5; --azul-s:#18233C;
  --verde:#3FC98C; --verde-s:#0F2A20;
  --ambar:#F0AE3F; --ambar-s:#2E2413;
  --rosa:#F4677F; --rosa-s:#2F1720;
  --violeta:#A981F0; --violeta-s:#241A38;
  --teal:#3FC3C8; --teal-s:#0D2A2C;
  --ouro:#F0C044; --ouro-s:#2E2612;
  --on-cor:#0E1219;
  --sh-s:0 1px 2px rgba(0,0,0,.5);
  --sh-m:0 2px 5px rgba(0,0,0,.45), 0 10px 24px -14px rgba(0,0,0,.8);
  --sh-l:0 4px 8px rgba(0,0,0,.5), 0 24px 48px -22px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --ground:#0E1219; --surface:#171D28; --surf-2:#1F2734; --surf-3:#2A3342;
  --ink:#E9EEF7; --ink-2:#C3CDDD; --muted:#8593A9; --line:#252E3C; --line-2:#364153;
  --azul:#6D93F5; --azul-s:#18233C;
  --verde:#3FC98C; --verde-s:#0F2A20;
  --ambar:#F0AE3F; --ambar-s:#2E2413;
  --rosa:#F4677F; --rosa-s:#2F1720;
  --violeta:#A981F0; --violeta-s:#241A38;
  --teal:#3FC3C8; --teal-s:#0D2A2C;
  --ouro:#F0C044; --ouro-s:#2E2612;
  --on-cor:#0E1219;
  --sh-s:0 1px 2px rgba(0,0,0,.5);
  --sh-m:0 2px 5px rgba(0,0,0,.45), 0 10px 24px -14px rgba(0,0,0,.8);
  --sh-l:0 4px 8px rgba(0,0,0,.5), 0 24px 48px -22px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink); font:400 16px/1.6 "Source Sans 3",-apple-system,Segoe UI,sans-serif; -webkit-font-smoothing:antialiased}
.wrap{max-width:1200px; margin:0 auto; padding:0 24px 110px}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque","Source Sans 3",sans-serif}
button{font-family:inherit}
#confete{position:fixed; inset:0; pointer-events:none; z-index:200; display:none}

/* ---------- barra de topo ---------- */
.topo{background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:50}
.topo-in{max-width:1200px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.marca{display:flex; align-items:center; gap:11px; margin-right:auto}
.logo{width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--azul),var(--violeta)); display:grid; place-items:center; flex:none}
.logo svg{width:19px; height:19px; stroke:var(--on-cor); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.marca b{font:700 18px/1 "Bricolage Grotesque",sans-serif; letter-spacing:-.02em}
.marca span{display:block; font:500 11px/1.4 "IBM Plex Mono",monospace; color:var(--muted); margin-top:3px}
.abas{display:flex; gap:4px; background:var(--surf-2); padding:4px; border-radius:12px; flex-wrap:wrap}
.aba{border:0; background:transparent; color:var(--ink-2); font:600 13.5px/1 "Source Sans 3",sans-serif; padding:9px 15px; border-radius:9px; cursor:pointer; display:flex; align-items:center; gap:7px}
.aba:hover{color:var(--azul)}
.aba[aria-selected="true"]{background:var(--surface); color:var(--azul); box-shadow:var(--sh-s)}
.aba .n{font:700 10.5px/1 "IBM Plex Mono",monospace; background:var(--azul); color:var(--on-cor); padding:3px 6px; border-radius:20px; min-width:18px; text-align:center}
.aba .n.zero{background:var(--surf-3); color:var(--muted)}
.aba:focus-visible,.bt:focus-visible,.chip:focus-visible{outline:2px solid var(--azul); outline-offset:2px}

/* ---------- botões e campos ---------- */
.bt{border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2); font:600 13.5px/1 "Source Sans 3",sans-serif; padding:10px 15px; border-radius:10px; cursor:pointer; display:inline-flex; align-items:center; gap:8px}
.bt:hover{border-color:var(--azul); color:var(--azul)}
.bt svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
.bt.pri{background:var(--azul); border-color:var(--azul); color:var(--on-cor)}
.bt.pri:hover{filter:brightness(1.08); color:var(--on-cor)}
.bt.ok{background:var(--verde); border-color:var(--verde); color:var(--on-cor)}
.bt.ok:hover{color:var(--on-cor); filter:brightness(1.08)}
.bt.pq{padding:7px 11px; font-size:12.5px; border-radius:8px}
.bt[disabled]{opacity:.45; cursor:not-allowed}
input,select,textarea{font:400 15px/1.35 "Source Sans 3",sans-serif; color:var(--ink); background:var(--surface); border:1px solid var(--line-2); border-radius:10px; padding:11px 13px; width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--azul); outline-offset:1px}
label.cmp{display:block}
label.cmp>span{display:block; font:700 10.5px/1 "IBM Plex Mono",monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:7px}
.linha{display:flex; gap:11px; flex-wrap:wrap; align-items:flex-end}

/* ---------- cabeçalho de seção ---------- */
.cab{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin:34px 0 20px}
h2{font:700 27px/1.15 "Bricolage Grotesque",sans-serif; margin:0; letter-spacing:-.02em}
.cab p{margin:7px 0 0; color:var(--muted); font-size:14.5px; max-width:62ch}

/* ---------- placar ---------- */
.placar{display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:14px; margin-top:26px}
.pc{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px 22px; box-shadow:var(--sh-m); display:flex; flex-direction:column; gap:14px}
.pc.destaque{background:linear-gradient(140deg,var(--azul),var(--violeta)); border-color:transparent; color:var(--on-cor)}
.pc.destaque .pt,.pc.destaque .ps{color:var(--on-cor); opacity:.82}
.pt{font:700 10.5px/1 "IBM Plex Mono",monospace; letter-spacing:.13em; text-transform:uppercase; color:var(--muted)}
.pbig{font:700 42px/1 "IBM Plex Mono",monospace; letter-spacing:-.045em; font-variant-numeric:tabular-nums}
.ps{font-size:13.5px; color:var(--muted); line-height:1.45}
.prox{display:flex; gap:16px; align-items:center}
.proxd{flex:none; min-width:88px; text-align:center; padding:13px 10px; border-radius:14px; background:rgba(255,255,255,.17)}
.proxd b{display:block; font:700 38px/1 "IBM Plex Mono",monospace; letter-spacing:-.05em; font-variant-numeric:tabular-nums}
.proxd.txt b{font-size:23px; line-height:1.35}
.proxd span{display:block; font:600 10px/1.35 "IBM Plex Mono",monospace; text-transform:uppercase; letter-spacing:.08em; margin-top:7px; opacity:.85}
.barra{height:9px; border-radius:99px; background:var(--surf-3); overflow:hidden}
.barra i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--verde),var(--teal)); transition:width .7s cubic-bezier(.4,0,.2,1)}
.pc.destaque .barra{background:rgba(255,255,255,.22)}
.pc.destaque .barra i{background:var(--on-cor)}
.anel{position:relative; width:84px; height:84px; flex:none}
.anel svg{transform:rotate(-90deg); display:block}
.anel .tk{fill:none; stroke:var(--surf-3); stroke-width:9}
.anel .fl{fill:none; stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1)}
.anel .mid{position:absolute; inset:0; display:grid; place-content:center; text-align:center}
.anel .mid b{font:700 21px/1 "IBM Plex Mono",monospace; letter-spacing:-.04em}
.anelrow{display:flex; align-items:center; gap:16px}

/* ---------- medalhas ---------- */
.medalhas{display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:11px; margin-top:16px}
.med{display:flex; gap:12px; align-items:center; padding:13px 15px; border-radius:14px; border:1px solid var(--line); background:var(--surface); box-shadow:var(--sh-s); opacity:.55; transition:.3s}
.med.on{opacity:1; box-shadow:var(--sh-m)}
.med.on.nova{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.82)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
.med .ic{width:38px; height:38px; border-radius:12px; flex:none; display:grid; place-items:center; background:var(--surf-3)}
.med .ic svg{width:19px; height:19px; stroke:var(--muted); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.med.on .ic{background:var(--ouro-s)} .med.on .ic svg{stroke:var(--ouro)}
.med b{display:block; font:600 14px/1.25 "Source Sans 3",sans-serif}
.med span{display:block; font:500 11.5px/1.35 "IBM Plex Mono",monospace; color:var(--muted); margin-top:3px}

/* ---------- filtros ---------- */
.chips{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 22px}
.chip{border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2); font:600 13px/1 "Source Sans 3",sans-serif; padding:9px 14px; border-radius:99px; cursor:pointer; display:flex; align-items:center; gap:8px}
.chip:hover{border-color:var(--azul)}
.chip b{font:700 11px/1 "IBM Plex Mono",monospace; opacity:.65}
.chip[aria-pressed="true"]{background:var(--azul); border-color:var(--azul); color:var(--on-cor)}
.chip.perigo[aria-pressed="true"]{background:var(--rosa); border-color:var(--rosa)}
.chip.ok[aria-pressed="true"]{background:var(--verde); border-color:var(--verde)}

/* ---------- quinzena ---------- */
.qz{display:grid; grid-template-columns:184px 1fr; gap:24px; align-items:start}
.qzr{position:sticky; top:88px; padding:14px 0 26px}
.qzr .a{font:700 10.5px/1 "IBM Plex Mono",monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--azul)}
.qzr .b{font:700 19px/1.2 "Bricolage Grotesque",sans-serif; margin-top:7px; letter-spacing:-.015em}
.qzr .c{font:500 12.5px/1.4 "IBM Plex Mono",monospace; color:var(--muted); margin-top:4px}
.qzr .p{font:600 11.5px/1 "IBM Plex Mono",monospace; color:var(--muted); margin:12px 0 7px}
.qzr.limpa .p{color:var(--verde)}
.qzi{display:flex; flex-direction:column; gap:10px; padding:14px 0 26px; border-bottom:1px solid var(--line)}
.qz:last-child .qzi{border-bottom:0}
.hj{display:flex; align-items:center; gap:11px}
.hj::before,.hj::after{content:""; height:2px; background:var(--rosa); flex:1; opacity:.35; border-radius:2px}
.hj span{font:700 10px/1 "IBM Plex Mono",monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--rosa)}

/* ---------- cartão ---------- */
.card{display:grid; grid-template-columns:58px 1fr; gap:16px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:15px 17px 15px 15px; box-shadow:var(--sh-s); transition:.2s}
.card:hover{box-shadow:var(--sh-m); transform:translateY(-1px)}
.card.done{opacity:.5}
.fl{border-radius:11px; overflow:hidden; text-align:center; align-self:start; border:1px solid var(--line)}
.fl .m{font:700 9.5px/1 "IBM Plex Mono",monospace; letter-spacing:.1em; text-transform:uppercase; padding:6px 0; color:var(--on-cor); background:var(--muted)}
.fl .d{font:700 23px/1 "IBM Plex Mono",monospace; padding:8px 0 9px; background:var(--surf-2); font-variant-numeric:tabular-nums}
.card.c-azul .fl .m{background:var(--azul)} .card.c-azul .fl .d{color:var(--azul)}
.card.c-ambar .fl .m{background:var(--ambar)} .card.c-ambar .fl .d{color:var(--ambar)}
.card.c-rosa .fl .m{background:var(--rosa)} .card.c-rosa .fl .d{color:var(--rosa)}
.card.c-violeta .fl .m{background:var(--violeta)} .card.c-violeta .fl .d{color:var(--violeta)}
.card.c-cinza .fl .m{background:var(--muted)} .card.c-cinza .fl .d{color:var(--muted)}
.ch{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:7px}
.tag{font:700 10px/1 "IBM Plex Mono",monospace; letter-spacing:.08em; text-transform:uppercase; padding:5px 9px; border-radius:6px; background:var(--surf-2); color:var(--muted); white-space:nowrap}
.tag.t-azul{background:var(--azul-s); color:var(--azul)}
.tag.t-ambar{background:var(--ambar-s); color:var(--ambar)}
.tag.t-rosa{background:var(--rosa-s); color:var(--rosa)}
.tag.t-violeta{background:var(--violeta-s); color:var(--violeta)}
.tag.t-verde{background:var(--verde-s); color:var(--verde)}
.tag.t-teal{background:var(--teal-s); color:var(--teal)}
.pts{font:700 11px/1 "IBM Plex Mono",monospace; color:var(--ouro); margin-left:auto}
.ct{font:600 16px/1.38 "Source Sans 3",sans-serif; margin:0 0 6px}
.cm{font:400 12.5px/1.55 "IBM Plex Mono",monospace; color:var(--muted); display:flex; flex-wrap:wrap; gap:1px 13px}
.cm .pr{color:var(--ink-2); font-weight:500}
.cw{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:12.8px; color:var(--muted); line-height:1.6}
.cw code{font:500 12px/1 "IBM Plex Mono",monospace; color:var(--ink-2); background:var(--surf-2); padding:2px 6px; border-radius:5px}
.cr{display:flex; gap:8px 14px; margin-top:11px; flex-wrap:wrap; align-items:center}
.cr a{font:600 12.5px/1 "Source Sans 3",sans-serif; color:var(--azul); text-decoration:none; border-bottom:1px solid var(--line-2); padding-bottom:2px}
.cr a:hover{border-bottom-color:var(--azul)}
.cr .dir{margin-left:auto; display:flex; gap:8px}


.card.perdeu{border-color:var(--rosa); box-shadow:0 0 0 1px var(--rosa) inset, var(--sh-m)}
.card.c-perdeu .fl .m{background:var(--rosa)} .card.c-perdeu .fl .d{color:var(--rosa)}
.tag.t-perdeu{background:var(--rosa); color:var(--on-cor); letter-spacing:.13em}
.prazos{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 8px}
.pz{display:inline-flex; align-items:baseline; gap:5px; font:500 12px/1 "IBM Plex Mono",monospace; padding:6px 10px; border-radius:7px; background:var(--surf-2); color:var(--ink-2)}
.pz b{font-weight:700; font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.pz.fatal{background:var(--azul-s); color:var(--azul)} .pz.fatal b{color:var(--azul); opacity:.7}
.pz.agora{background:var(--ambar-s); color:var(--ambar)} .pz.agora b{color:var(--ambar); opacity:.75}
.pz.ruim{background:var(--rosa-s); color:var(--rosa)} .pz.ruim b{color:var(--rosa); opacity:.75}

/* ---------- avatar / pessoas ---------- */
.av{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font:700 10.5px/1 "IBM Plex Mono",monospace; color:var(--on-cor); flex:none; letter-spacing:-.02em}
.av.g{width:40px; height:40px; font-size:14px}
.quem{display:inline-flex; align-items:center; gap:7px; font:600 12.5px/1 "Source Sans 3",sans-serif; color:var(--ink-2); background:var(--surf-2); padding:5px 11px 5px 5px; border-radius:99px}
.quem .av{width:20px; height:20px; font-size:9px}

/* ---------- lista to-do ---------- */
.tarefa{display:grid; grid-template-columns:24px 1fr auto; gap:14px; align-items:start; padding:13px 15px; border-radius:12px; border:1px solid transparent; transition:.15s}
.tarefa:hover{background:var(--surface); border-color:var(--line)}
.tarefa input[type=checkbox]{width:19px; height:19px; margin:2px 0 0; accent-color:var(--verde); cursor:pointer}
.tarefa .tt{font-size:15.5px; line-height:1.42}
.tarefa .ts{font:400 12.5px/1.5 "IBM Plex Mono",monospace; color:var(--muted); margin-top:5px; display:flex; flex-wrap:wrap; gap:2px 13px; align-items:center}
.tarefa.done .tt{text-decoration:line-through; text-decoration-color:var(--muted); color:var(--muted)}
.mesbloco{margin-bottom:28px}
.mesbloco h3{display:flex; justify-content:space-between; align-items:center; gap:14px; margin:0 0 12px; padding-bottom:10px; border-bottom:1px solid var(--line)}
.mesbloco h3 .mn{font:700 19px/1 "Bricolage Grotesque",sans-serif; letter-spacing:-.015em}
.mesbloco h3 .mp{display:flex; align-items:center; gap:10px; font:600 12px/1 "IBM Plex Mono",monospace; color:var(--muted)}
.mini{width:30px; height:30px; position:relative; flex:none}
.mini svg{transform:rotate(-90deg); display:block}
.mini .tk{fill:none; stroke:var(--surf-3); stroke-width:4}
.mini .fl2{fill:none; stroke:var(--verde); stroke-width:4; stroke-linecap:round; transition:stroke-dashoffset .6s}

/* ---------- equipe ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:13px}
.pcard{background:var(--surface); border:1px solid var(--line); border-radius:15px; padding:17px 19px; box-shadow:var(--sh-s); display:flex; flex-direction:column; gap:13px}
.pcard .top{display:flex; align-items:center; gap:12px}
.pcard .nm{font:600 16px/1.25 "Source Sans 3",sans-serif}
.pcard .pp{font:500 11.5px/1.35 "IBM Plex Mono",monospace; color:var(--muted); margin-top:2px}
.pcard .nums{display:flex; gap:18px}
.pcard .nums div b{display:block; font:700 21px/1 "IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.pcard .nums div span{font:500 10.5px/1 "IBM Plex Mono",monospace; color:var(--muted); text-transform:uppercase; letter-spacing:.08em}
.podio{display:flex; flex-direction:column; gap:9px; margin-bottom:22px}
.pod{display:grid; grid-template-columns:30px 30px 1fr auto; gap:13px; align-items:center; padding:11px 15px; background:var(--surface); border:1px solid var(--line); border-radius:12px}
.pod .pos{font:700 15px/1 "IBM Plex Mono",monospace; color:var(--muted); text-align:center}
.pod.p1 .pos{color:var(--ouro)} .pod.p2 .pos{color:var(--muted)} .pod.p3 .pos{color:var(--ambar)}
.pod .nm{font-weight:600; font-size:15px}
.pod .sc{font:700 15px/1 "IBM Plex Mono",monospace; color:var(--ouro); font-variant-numeric:tabular-nums}

/* ---------- diálogo ---------- */
.fundo{position:fixed; inset:0; background:rgba(10,16,30,.55); z-index:100; display:none; padding:24px; overflow-y:auto}
.fundo.on{display:grid; place-items:start center}
.modal{background:var(--surface); border-radius:18px; box-shadow:var(--sh-l); width:min(560px,100%); margin-top:6vh; padding:26px 28px 24px; border:1px solid var(--line)}
.modal h3{font:700 22px/1.2 "Bricolage Grotesque",sans-serif; margin:0 0 6px; letter-spacing:-.02em}
.modal .sb{color:var(--muted); font-size:14px; margin:0 0 20px; line-height:1.5}
.campos{display:flex; flex-direction:column; gap:15px}

  fogo:"M12 22c4 0 7-2.7 7-6.5 0-4.5-4-6-4-10.5 0 0-3 1.5-3 5 0 1.5-1 2-1.5 1.2C10 10 9.5 9 9.5 7.5 7 9.5 5 12 5 15.5 5 19.3 8 22 12 22z",
  lixo:"M4 7h16M9.5 7V5h5v2M6.5 7l1 13h9l1-13", lapis:"M4 20h4L20 8l-4-4L4 16v4z", baixar:"M12 3v13M7 12l5 5 5-5M4.5 21h15",

const CORES = ["#2E5BD8","#0E9F63","#DE8A08","#DB2F4C","#7A45D6","#0C9AA0","#C2410C","#5B21B6"];
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MES3 = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const br = s => s ? s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4) : "";
const isoDe = d => d.toISOString().slice(0,10);
const HOJE = isoDe(new Date());
const uid = () => "x" + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const iniciais = n => n.trim().split(/\s+/).filter(p => p.length > 2 || /^[A-ZÀ-Ú]/.test(p)).slice(0,2).map(p => p[0]).join("").toUpperCase() || "?";

/* ---- dias úteis: feriados nacionais calculados (Páscoa → Carnaval, Sexta Santa, Corpus Christi) ---- */
function pascoa(ano){
  const a=ano%19,b=Math.floor(ano/100),c=ano%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),
    g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,
    m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;
  return new Date(Date.UTC(ano,mes-1,dia));
}
const FER = new Set();
(function(){ const y = new Date().getUTCFullYear();
  for (let ano = y-1; ano <= y+2; ano++){
    const p = pascoa(ano), mv = n => isoDe(new Date(p.getTime()+n*864e5));
    [`${ano}-01-01`,mv(-48),mv(-47),mv(-2),`${ano}-04-21`,`${ano}-05-01`,mv(60),
     `${ano}-09-07`,`${ano}-10-12`,`${ano}-11-02`,`${ano}-11-15`,`${ano}-11-20`,`${ano}-12-25`].forEach(f => FER.add(f));
  }
})();
const util = d => d.getUTCDay() !== 0 && d.getUTCDay() !== 6 && !FER.has(isoDe(d));
const proxUtil = d => { const x = new Date(d); do { x.setUTCDate(x.getUTCDate()+1); } while(!util(x)); return x; };
const somaUteis = (d,n) => { let x = new Date(d); for(let i=0;i<n;i++) x = proxUtil(x); return x; };
const antUtil = d => { const x = new Date(d); do { x.setUTCDate(x.getUTCDate()-1); } while(!util(x)); return x; };
const subUteis = (d,n) => { let x = new Date(d); for(let i=0;i<n;i++) x = antUtil(x); return x; };
const internoDe = iso => iso ? isoDe(subUteis(new Date(iso+"T00:00:00Z"), Math.max(0, E.antecedencia||0))) : null;
function uteisEntre(a,b){ let n=0; const d=new Date(a+"T00:00:00Z"), f=new Date(b+"T00:00:00Z");
  while(d<f){ d.setUTCDate(d.getUTCDate()+1); if(util(d)) n++; } return n; }

/* ===================== estado ===================== */
const CHAVE = "painel-prazos-v2";
const vazio = () => ({ versao:4, oabs:[], pessoas:[], tarefas:[], djen:[], buscadoEm:null, janelaDias:60, antecedencia:3, time:null });
let E = vazio();
try { const s = localStorage.getItem(CHAVE); if (s) E = Object.assign(vazio(), JSON.parse(s)); } catch(e){}
/* Migração v3 -> v4: a lista "feitos" vira um campo em cada item, para a
   sincronização poder reconciliar item a item. */
if (Array.isArray(E.feitos)){
  const marcados = new Set(E.feitos.map(String));
  E.djen.forEach(i => { if (marcados.has("d" + i.id)) i.feita = true; });
  E.tarefas.forEach(t => { if (marcados.has("t" + t.id)) t.feita = true; });
  delete E.feitos;
}
function salvar(){ try { localStorage.setItem(CHAVE, JSON.stringify(E)); } catch(e){} }
const configurado = () => E.oabs.length || E.djen.length || E.tarefas.length || E.pessoas.length;

let aba = "painel", filtro = "tudo", busca = "", medalhasAntes = new Set(), primeira = true;
let podeBuscar = null; // null = ainda não testado

/* ===================== providências (DJEN + manuais) ===================== */
const PESO = { sessao:15, prazo:10, acao:5, manual:8 };
const pessoasVivas = () => E.pessoas.filter(p => !p.removido);
const pessoaDe = id => E.pessoas.find(p => p.id === id && !p.removido) || null;

/* Estados. O prazo FATAL é a data do ato; o prazo INTERNO é o fatal menos a
   antecedência configurada, em dias úteis. "Perdeu" quer dizer: o fatal passou
   e nada foi marcado como feito AQUI — não é afirmação sobre os autos. */
function estadoDe(p){
  if (p.feita) return "feita";
  if (!p.data) return "semdata";
  if (p.tipo === "sessao") return p.data < HOJE ? "passou" : "sessao";
  const int = internoDe(p.data);
  if (p.data < HOJE) return "perdeu";
  if (p.data === HOJE) return "fatalhoje";
  if (int < HOJE) return "atrasado";
  if (int === HOJE) return "comecarhoje";
  if (uteisEntre(HOJE, int) <= 2) return "atencao";
  return "emdia";
}
const ROTULO = {
  perdeu:      { cor:"perdeu",  tag:"t-perdeu",  txt:"PERDEU" },
  fatalhoje:   { cor:"rosa",    tag:"t-rosa",    txt:"Fatal é HOJE" },
  atrasado:    { cor:"rosa",    tag:"t-rosa",    txt:"Atrasado" },
  comecarhoje: { cor:"ambar",   tag:"t-ambar",   txt:"Começar hoje" },
  atencao:     { cor:"ambar",   tag:"t-ambar",   txt:"Preparar" },
  emdia:       { cor:"azul",    tag:"t-azul",    txt:"Em dia" },
  sessao:      { cor:"violeta", tag:"t-violeta", txt:"Sessão de julgamento" },
  passou:      { cor:"cinza",   tag:"",          txt:"Sessão realizada" },
  feita:       { cor:"cinza",   tag:"t-verde",   txt:"Concluída" },
  semdata:     { cor:"cinza",   tag:"",          txt:"Sem data" },
};

function provDjen(){
  return E.djen.filter(i => !i.removido && (i.sessao || i.fim || (i.acoes && i.acoes.length))).map(i => ({
    key:"d"+i.id, fonte:"djen", bruto:i,
    tipo: i.sessao ? "sessao" : i.fim ? "prazo" : "acao",
    data: i.fim || i.sessao || i.disp,
    titulo: i.sessao ? "Preparar memorial / sustentação oral" : (i.acoes[0] || "Cumprir o determinado"),
    quem: i.pessoaId || null,
    feita: !!i.feita, quemFez: i.feitaPor || null,
  }));
}
function provManual(){
  return E.tarefas.filter(t => !t.removido).map(t => ({
    key:"t"+t.id, fonte:"manual", bruto:t, tipo:"manual",
    data: t.prazo || null, titulo: t.titulo, quem: t.pessoaId || null, feita: !!t.feita, quemFez: t.feitaPor || null,
  }));
}
const TODAS = () => provDjen().concat(provManual());

function casa(p){
  if (!busca) return true;
  const q = busca.toLowerCase(), b = p.bruto;
  const campos = [p.titulo, b.proc, b.trib, b.orgao, b.processo, (b.partes||[]).join(" "), (b.advs||[]).join(" "),
    (pessoaDe(p.quem)||{}).nome, b.nota].filter(Boolean).join(" ").toLowerCase();
  return campos.includes(q);
}
const atrasada = p => ["atrasado","fatalhoje"].includes(estadoDe(p));
const perdida = p => estadoDe(p) === "perdeu";
function passa(p){
  if (filtro === "tudo") return true;
  if (filtro === "aberto") return !p.feita;
  if (filtro === "urgente") return !p.feita && !!p.data && p.data >= HOJE && uteisEntre(HOJE,p.data) <= 5;
  if (filtro === "perdeu") return perdida(p);
  if (filtro === "atraso") return atrasada(p);
  if (filtro === "minhas") return !p.feita && !p.quem;
  if (filtro === "delegadas") return !p.feita && !!p.quem;
  if (filtro === "feito") return p.feita;
  return true;
}
const base = () => TODAS().filter(casa);
const vis = () => base().filter(passa);

function alternar(key){
  const obj = key[0] === "d" ? E.djen.find(x => "d" + x.id === key) : E.tarefas.find(x => "t" + x.id === key);
  if (!obj) return;
  obj.feita = !obj.feita;
  obj.feitaPor = obj.feita ? (E.time ? E.time.meuNome : null) : null;
  tocou(obj); salvar(); render();
}

/* ===================== busca no DJEN ===================== */
const RX_PRAZO = /prazo\s+(?:comum\s+|sucessivo\s+|legal\s+|improrrog[áa]vel\s+)?(?:de\s+)?(\d{1,3})\s*\(?[a-zç\s]{0,12}?\)?\s*dias?/i;
const RX_SESSAO = /(?:realizar-se|realizada|julgamento do dia|do dia|sess[ãa]o)[^.]{0,90}?(\d{2}\/\d{2}\/\d{4})/i;
const ACOES = [["Manifestar-se",/manifest[ae]-?se|para manifesta/i],["Contrarrazões",/contrarraz/i],["Impugnar",/impugna[çc]/i],
  ["Embargos de declaração",/embargos de declara/i],["Custas / preparo",/\bcustas\b|preparo recursal/i],
  ["Ciência",/\bci[êe]ncia\b/i],["Cumprir determinação",/cumpra-se|dever[áa] cumprir/i]];
const limpa = s => String(s||"").replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/\s+/g," ").trim();

function converte(c, rotulo){
  const t = limpa(c.texto), mp = t.match(RX_PRAZO);
  const ms = /pauta/i.test(c.tipoComunicacao||"") ? t.match(RX_SESSAO) : null;
  const disp = new Date(c.data_disponibilizacao+"T00:00:00Z");
  const pub = proxUtil(disp), ini = proxUtil(pub);
  const dias = mp ? parseInt(mp[1],10) : null;
  const fim = dias ? somaUteis(ini, dias-1) : null;
  const partes = (c.destinatarios||[]).map(d => d.nome).filter(Boolean);
  const sig = partes.some(p => /^sigilo/i.test(p)) || !partes.length;
  return { id:c.id, hash:c.hash, proc:c.numeroprocessocommascara||c.numero_processo, trib:c.siglaTribunal,
    orgao:c.nomeOrgao, classe:c.nomeClasse||null, tipo:c.tipoComunicacao, disp:c.data_disponibilizacao,
    pub:isoDe(pub), inicio:isoDe(ini), fim:fim?isoDe(fim):null, dias,
    trecho_prazo: mp ? mp[0].replace(/\s+/g," ").trim() : null,
    sessao: ms ? ms[1].split("/").reverse().join("-") : null,
    advs:[rotulo], partes: sig?[]:partes.slice(0,4), sigiloso:sig,
    acoes: ACOES.filter(([,rx]) => rx.test(t)).map(([n]) => n), link:c.link||null,
    feita:false, pessoaId:null, atualizadoEm: new Date().toISOString() };
}

async function testarBusca(){
  if (podeBuscar !== null) return podeBuscar;
  try {
    const r = await fetch("https://comunicaapi.pje.jus.br/api/v1/comunicacao/tribunal", {cache:"no-store"});
    podeBuscar = r.ok;
  } catch(e){ podeBuscar = false; }
  return podeBuscar;
}

async function buscarOab(uf, numero, nome, aviso){
  const fim = HOJE, ini = isoDe(new Date(Date.now() - E.janelaDias*864e5));
  const rotulo = nome || ("OAB/"+uf+" "+numero);
  let pagina = 1, lidos = 0, total = null, novos = 0;
  for(;;){
    const url = "https://comunicaapi.pje.jus.br/api/v1/comunicacao?numeroOab="+encodeURIComponent(numero)
      + "&ufOab="+encodeURIComponent(uf) + "&dataDisponibilizacaoInicio="+ini + "&dataDisponibilizacaoFim="+fim
      + "&itensPorPagina=100&pagina="+pagina;
    const r = await fetch(url);
    if (r.status === 429) throw new Error("O CNJ pediu para desacelerar (429). Espere um minuto e tente de novo.");
    if (r.status === 403) throw new Error("O CNJ recusou esta rede (403). Ele bloqueia acesso vindo de datacenter — abra o arquivo numa máquina em rede residencial ou do escritório.");
    if (!r.ok) throw new Error("O CNJ respondeu HTTP " + r.status + ".");
    const d = await r.json();
    if (total === null) total = d.count;
    const itens = d.items || [];
    itens.forEach(c => {
      const ja = E.djen.find(x => x.id === c.id);
      if (ja){ if (!ja.advs.includes(rotulo)) ja.advs.push(rotulo); }
      else { E.djen.push(converte(c, rotulo)); novos++; }
    });
    lidos += itens.length;
    if (aviso) aviso(`Lendo… ${lidos} de ${total}`);
    if (itens.length < 100 || lidos >= total) break;
    pagina++;
    await new Promise(r => setTimeout(r, 1200));
  }
  return { lidos, novos, total };
}


/* ===================== calendário (.ics e Google) ===================== */
const icsEsc = t => String(t||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
const bytes = t => new TextEncoder().encode(t).length;
function dobra(linha){
  const out = []; let cur = linha;
  while (bytes(cur) > 73){
    let k = 73;
    while (bytes(cur.slice(0,k)) > 73) k--;
    out.push(cur.slice(0,k)); cur = " " + cur.slice(k);
  }
  out.push(cur); return out.join("\r\n");
}
const compacta = iso => iso.replace(/-/g,"");
const maisUmDia = iso => compacta(isoDe(new Date(new Date(iso+"T00:00:00Z").getTime()+864e5)));
const carimbo = () => new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");

/* ===================== time compartilhado (Firestore REST) =====================
   Sem SDK e sem script externo: só fetch, igual ao que o painel já faz com o DJEN.
   Modelo local-first — tudo continua funcionando offline no localStorage, e a
   sincronização reconcilia por documento, com "quem escreveu por último vence"
   comparando o campo atualizadoEm. */

const FS = "https://firestore.googleapis.com/v1";
const COLECOES = ["pessoas", "tarefas", "djen"];
let sincronizando = false, ultimoErroSync = null, timerSync = null;

const agoraISO = () => new Date().toISOString();
function b64url(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function deB64url(s){
  const t = s.replace(/-/g,"+").replace(/_/g,"/");
  return decodeURIComponent(escape(atob(t + "===".slice((t.length + 3) % 4))));
}
function codificaCodigo(c){ return b64url(JSON.stringify([c.projectId, c.apiKey, c.timeId, c.nome || ""])); }
function decodificaCodigo(txt){
  try {
    const a = JSON.parse(deB64url(String(txt).trim()));
    if (!Array.isArray(a) || a.length < 3 || !a[0] || !a[1] || !a[2]) return null;
    return { projectId:a[0], apiKey:a[1], timeId:a[2], nome:a[3] || "Time" };
  } catch(e){ return null; }
}

/* ---- conversão de valores para o formato do Firestore ---- */
function paraFs(v){
  if (v === null || v === undefined) return { nullValue: null };
  if (typeof v === "boolean") return { booleanValue: v };
  if (typeof v === "number") return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(paraFs) } };
  if (typeof v === "object"){ const f = {}; for (const k in v) f[k] = paraFs(v[k]); return { mapValue: { fields: f } }; }
  return { stringValue: String(v) };
}
function deFs(v){
  if (!v || typeof v !== "object") return null;
  if ("nullValue" in v) return null;
  if ("booleanValue" in v) return v.booleanValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return v.doubleValue;
  if ("stringValue" in v) return v.stringValue;
  if ("timestampValue" in v) return v.timestampValue;
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(deFs);
  if ("mapValue" in v){ const o = {}, f = v.mapValue.fields || {}; for (const k in f) o[k] = deFs(f[k]); return o; }
  return null;
}
const paraDoc = o => { const f = {}; for (const k in o) f[k] = paraFs(o[k]); return { fields: f }; };
const deDoc = d => { const o = {}, f = (d && d.fields) || {}; for (const k in f) o[k] = deFs(f[k]); return o; };

/* ---- identidade (login anônimo do Firebase) ---- */
async function tokenValido(){
  const t = E.time;
  if (!t) throw new Error("Sem time configurado.");
  if (t.idToken && t.expira && Date.now() < t.expira - 60000) return t.idToken;
  if (t.refreshToken){
    const r = await fetch("https://securetoken.googleapis.com/v1/token?key=" + encodeURIComponent(t.apiKey), {
      method:"POST", headers:{ "Content-Type":"application/x-www-form-urlencoded" },
      body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(t.refreshToken),
    });
    if (r.ok){
      const d = await r.json();
      t.idToken = d.id_token; t.refreshToken = d.refresh_token;
      t.expira = Date.now() + (Number(d.expires_in || 3600) * 1000);
      t.uid = d.user_id || t.uid; salvar();
      return t.idToken;
    }
  }
  return await autenticar();
}
async function autenticar(){
  const t = E.time;
  const r = await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + encodeURIComponent(t.apiKey), {
    method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ returnSecureToken:true }),
  });
  const d = await r.json();
  if (!r.ok){
    const m = (d.error && d.error.message) || "";
    if (/API key not valid/i.test(m)) throw new Error("A chave da API não é válida. Confira o campo apiKey no código do time.");
    if (/ADMIN_ONLY_OPERATION|OPERATION_NOT_ALLOWED/i.test(m)) throw new Error("O login anônimo está desligado no projeto. No console do Firebase: Authentication > Sign-in method > Anônimo > Ativar.");
    throw new Error("Não consegui autenticar: " + m);
  }
  t.idToken = d.idToken; t.refreshToken = d.refreshToken;
  t.expira = Date.now() + (Number(d.expiresIn || 3600) * 1000);
  t.uid = d.localId; salvar();
  return t.idToken;
}

/* ---- chamadas ao Firestore ---- */
function raiz(){ return FS + "/projects/" + E.time.projectId + "/databases/(default)/documents"; }
function caminho(col, id){ return raiz() + "/times/" + E.time.timeId + "/" + col + (id ? "/" + encodeURIComponent(id) : ""); }

async function fsChama(url, opcoes){
  const tk = await tokenValido();
  const r = await fetch(url, Object.assign({}, opcoes, {
    headers: Object.assign({ "Authorization": "Bearer " + tk, "Content-Type": "application/json" }, (opcoes||{}).headers),
  }));
  if (r.status === 404) return null;
  if (!r.ok){
    let m = "HTTP " + r.status;
    try { const e = await r.json(); m = (e.error && e.error.message) || m; } catch(x){}
    if (r.status === 403 && /has not been used|disabled/i.test(m))
      throw new Error("O Firestore ainda não foi criado nesse projeto. No console do Firebase: Firestore Database > Criar banco de dados.");
    if (r.status === 403 || r.status === 401)
      throw new Error("O Firestore recusou o acesso. Confira se as regras de segurança foram publicadas. (" + m + ")");
    throw new Error(m);
  }
  return r.status === 204 ? {} : r.json();
}
async function fsLista(col){
  const saida = []; let pagina = null;
  for(;;){
    const u = caminho(col) + "?pageSize=300" + (pagina ? "&pageToken=" + encodeURIComponent(pagina) : "");
    const d = await fsChama(u, { method:"GET" });
    if (!d) break;
    (d.documents || []).forEach(doc => {
      const o = deDoc(doc);
      o.id = doc.name.split("/").pop();
      saida.push(o);
    });
    if (!d.nextPageToken) break;
    pagina = d.nextPageToken;
  }
  return saida;
}
const fsGrava = (col, id, obj) => fsChama(caminho(col, id), { method:"PATCH", body: JSON.stringify(paraDoc(obj)) });

/* ---- entrar / sair ---- */
async function entrarNoTime(codigo, meuNome){
  const c = decodificaCodigo(codigo);
  if (!c) throw new Error("Esse código não é válido. Peça de novo a quem criou o time.");
  E.time = { projectId:c.projectId, apiKey:c.apiKey, timeId:c.timeId, nome:c.nome,
    meuNome: meuNome || "Sem nome", uid:null, idToken:null, refreshToken:null, expira:0, sincronizadoEm:null };
  salvar();
  await tokenValido();
  await fsGrava("membros", E.time.uid, { nome: E.time.meuNome, entrouEm: agoraISO() });
  await sincronizarTime();
}
function sairDoTime(){ E.time = null; salvar(); render(); }

/* ---- reconciliação ---- */
function localDe(col){
  if (col === "pessoas") return E.pessoas;
  if (col === "tarefas") return E.tarefas;
  return E.djen.map(i => Object.assign({}, i, { id: String(i.id) }));
}
function aplicaLocal(col, lista){
  if (col === "pessoas") E.pessoas = lista;
  else if (col === "tarefas") E.tarefas = lista;
  else E.djen = lista.map(i => Object.assign({}, i, { id: isNaN(+i.id) ? i.id : +i.id }));
}
const chaveDe = o => String(o.id);
const quando = o => o.atualizadoEm || "1970-01-01T00:00:00.000Z";

async function sincronizarTime(silencioso){
  if (!E.time || sincronizando) return;
  sincronizando = true; ultimoErroSync = null;
  if (!silencioso) pintaSync();
  try {
    for (const col of COLECOES){
      const remotos = await fsLista(col);
      const mapaR = new Map(remotos.map(o => [chaveDe(o), o]));
      const locais = localDe(col);
      const mapaL = new Map(locais.map(o => [chaveDe(o), o]));
      const chaves = new Set([...mapaR.keys(), ...mapaL.keys()]);
      const fundido = [], mandar = [];

      chaves.forEach(k => {
        const r = mapaR.get(k), l = mapaL.get(k);
        if (r && !l){ if (!r.removido) fundido.push(r); }
        else if (l && !r){ const c = Object.assign({}, l); if (!c.atualizadoEm) c.atualizadoEm = agoraISO(); mandar.push(c); if (!c.removido) fundido.push(c); }
        else {
          const vence = quando(l) > quando(r) ? l : r;
          if (!vence.removido) fundido.push(vence);
          if (vence === l && quando(l) !== quando(r)) mandar.push(l);
        }
      });

      aplicaLocal(col, fundido);
      for (const o of mandar){
        const corpo = Object.assign({}, o); delete corpo.id;
        await fsGrava(col, chaveDe(o), corpo);
      }
    }
    E.time.sincronizadoEm = agoraISO();
    salvar();
  } catch(e){
    ultimoErroSync = e.message || String(e);
  } finally {
    sincronizando = false;
    if (!silencioso) render(); else pintaSync();
  }
}

/* Marca a hora de alteração e agenda o envio. Chamado sempre que algo muda. */
function tocou(obj){
  if (obj) obj.atualizadoEm = agoraISO();
  if (!E.time) return;
  clearTimeout(timerSync);
  timerSync = setTimeout(() => sincronizarTime(true), 2500);
}

function pintaSync(){
  const n = document.getElementById("sublinha");
  if (!n || !E.time) return;
  if (sincronizando){ n.textContent = "Time " + E.time.nome + " · sincronizando…"; return; }
  if (ultimoErroSync){ n.textContent = "Time " + E.time.nome + " · falhou ao sincronizar"; return; }
  const q = E.time.sincronizadoEm;
  n.textContent = "Time " + E.time.nome + (q ? " · sincronizado " + q.slice(11,16) : "");
}

function placar(){
  const b = base(), f = b.filter(p => p.feita);
  const pontos = f.reduce((s,p) => s + PESO[p.tipo], 0);
  return { total:b.length, feitas:f.length, pontos, pct: b.length ? f.length/b.length : 0, abertas:b.length - f.length,
    atrasadas: b.filter(atrasada).length, perdidas: b.filter(perdida).length };
}
const NIVEIS = [[0,"Aquecendo"],[50,"No ritmo"],[130,"Em dia"],[250,"Adiantado"],[400,"Impecável"],[600,"Lendário"]];
function nivelDe(p){ let k=0; NIVEIS.forEach((n,i) => { if (p >= n[0]) k = i; });
  return { i:k, nome:NIVEIS[k][1], prox:NIVEIS[k+1]||null, base:NIVEIS[k][0] }; }

function medalhas(){
  const b = base(), s = b.filter(p => p.tipo === "sessao"), del = b.filter(p => p.quem);
  const qz = new Map(); b.filter(p => p.data).forEach(p => { const k = qzDe(p.data); (qz.get(k) || qz.set(k,[]).get(k)).push(p); });
  const qzLimpas = [...qz.values()].filter(l => l.every(p => p.feita)).length;
  const ms = new Map(); b.filter(p => p.data).forEach(p => { const k = p.data.slice(0,7); (ms.get(k) || ms.set(k,[]).get(k)).push(p); });
  const msZerados = [...ms.values()].filter(l => l.every(p => p.feita)).length;
  const pl = placar();
  return [
    { on: b.length > 0 && pl.perdidas === 0, t:"Nada perdido", s: pl.perdidas ? pl.perdidas+" com fatal vencido" : "nenhum fatal vencido", ic:"escudo" },
    { on: b.length > 0 && pl.atrasadas === 0, t:"Nada atrasado", s: pl.atrasadas ? pl.atrasadas+" fora do prazo interno" : "tudo dentro do interno", ic:"alvo" },
    { on: s.length > 0 && s.every(p => p.feita), t:"Pautas preparadas", s: s.filter(p=>p.feita).length+" de "+s.length, ic:"martelo" },
    { on: qzLimpas > 0, t:"Quinzena limpa", s: qzLimpas+" de "+qz.size, ic:"bandeira" },
    { on: msZerados > 0, t:"Mês zerado", s: msZerados+" de "+ms.size, ic:"calend" },
    { on: del.length >= 3, t:"Time em campo", s: del.length+" tarefas delegadas", ic:"pessoa" },
    { on: pl.pontos >= 250, t:"Maratonista", s: pl.pontos+" pontos", ic:"raio" },
    { on: b.length > 0 && pl.feitas === b.length, t:"Tudo em dia", s: pl.feitas+" de "+b.length, ic:"estrela" },
  ];
}

const cv = $("confete");
function festa(){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let ctx = null;
  try { ctx = cv.getContext("2d"); } catch(e){}
  if (!ctx) return;
  cv.width = innerWidth; cv.height = innerHeight; cv.style.display = "block";
  const ps = Array.from({length:130}, () => ({ x:innerWidth/2+(Math.random()-.5)*360, y:innerHeight*.3,
    vx:(Math.random()-.5)*12, vy:Math.random()*-14-4, s:4+Math.random()*7, r:Math.random()*6.3,
    vr:(Math.random()-.5)*.32, c:CORES[(Math.random()*CORES.length)|0], a:1 }));
  let t = 0;
  (function passo(){
    ctx.clearRect(0,0,cv.width,cv.height); let vivos = 0;
    ps.forEach(p => { p.vy += .4; p.x += p.vx; p.y += p.vy; p.r += p.vr; if (t > 45) p.a -= .025;
      if (p.a > 0 && p.y < cv.height+40){ vivos++; ctx.save(); ctx.globalAlpha = Math.max(p.a,0);
        ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); } });
    t++; if (vivos) requestAnimationFrame(passo); else { ctx.clearRect(0,0,cv.width,cv.height); cv.style.display = "none"; }
  })();
}

function dlgPessoa(existente){
  const nome = entrada("text", existente ? existente.nome : "", "Nome completo");
  const email = entrada("email", existente ? (existente.email || "") : "", "nome@escritorio.com.br (opcional)");
  const papel = el("select");
  ["Advogado","Advogada","Estagiário","Estagiária","Secretaria","Financeiro","Cliente","Outro"].forEach(p => papel.appendChild(new Option(p,p)));
  if (existente) papel.value = existente.papel;
  let cor = existente ? existente.cor : CORES[pessoasVivas().length % CORES.length];
  const cores = el("div","cores");
  CORES.forEach(c => { const b = el("button"); b.type = "button"; b.style.background = c;
    b.setAttribute("aria-pressed", String(c === cor)); b.setAttribute("aria-label","Cor "+c);
    b.addEventListener("click", () => { cor = c; [...cores.children].forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
    cores.appendChild(b); });
  const st = el("p","sb",""); st.style.margin = "0"; st.style.color = "var(--rosa)";
  modal(existente ? "Editar pessoa" : "Cadastrar pessoa",
    "Quem pode receber tarefas. Não precisa ser advogado. Com e-mail preenchido, a pessoa entra como convidada nos eventos de calendário que você gerar.",
    [campo("Nome", nome), campo("E-mail", email), campo("Papel", papel), campo("Cor", cores), st],
    () => {
      const n = nome.value.trim();
      if (!n){ st.textContent = "Informe o nome."; return false; }
      const em = email.value.trim();
      if (em && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ st.textContent = "Esse e-mail não parece válido."; return false; }
      if (existente){ existente.nome = n; existente.papel = papel.value; existente.cor = cor; existente.email = em || null; tocou(existente); }
      else { const nova = { id:uid(), nome:n, papel:papel.value, cor, email:em || null }; tocou(nova); E.pessoas.push(nova); }
      salvar(); render(); return true;
    });
}

function selPessoa(valor){
  const s = el("select");
  s.appendChild(new Option("— ninguém (fica comigo) —",""));
  pessoasVivas().forEach(p => s.appendChild(new Option(p.nome + " · " + p.papel, p.id)));
  if (valor) s.value = valor;
  return s;
}

function dlgTarefa(existente){
  const tit = entrada("text", existente ? existente.titulo : "", "Ex.: protocolar contrarrazões");
  const prazo = entrada("date", existente ? (existente.prazo || "") : "");
  const proc = entrada("text", existente ? (existente.processo || "") : "", "Número do processo (opcional)");
  const quem = selPessoa(existente ? existente.pessoaId : "");
  const nota = el("textarea"); nota.rows = 2; nota.placeholder = "Observação (opcional)";
  if (existente && existente.nota) nota.value = existente.nota;
  const st = el("p","sb",""); st.style.margin = "0"; st.style.color = "var(--rosa)";
  const cps = [campo("O que precisa ser feito", tit),
    (() => { const d = el("div","dupla"); d.appendChild(campo("Prazo", prazo)); d.appendChild(campo("Processo", proc)); return d; })(),
    campo("Delegar para", quem), campo("Observação", nota), st];
  if (!pessoasVivas().length){
    const a = el("div","aviso az");
    a.appendChild(el("span","k","Dica"));
    a.appendChild(el("div",null,"Nenhuma pessoa cadastrada ainda. Cadastre a equipe na aba Equipe para poder delegar."));
    cps.splice(2,0,a);
  }
  modal(existente ? "Editar tarefa" : "Nova tarefa", "Tarefas criadas por você entram na agenda e no placar junto com o que vem do DJEN.",
    cps,
    () => {
      const t = tit.value.trim();
      if (!t){ st.textContent = "Escreva o que precisa ser feito."; return false; }
      if (existente){ Object.assign(existente, { titulo:t, prazo:prazo.value||null, processo:proc.value.trim()||null, pessoaId:quem.value||null, nota:nota.value.trim()||null }); tocou(existente); }
      else { const nova = { id:uid(), titulo:t, prazo:prazo.value||null, processo:proc.value.trim()||null,
        pessoaId:quem.value||null, nota:nota.value.trim()||null, feita:false, criada:HOJE }; tocou(nova); E.tarefas.push(nova); }
      salvar(); render(); return true;
    });
}

function dlgDelegar(p){
  const quem = selPessoa(p.quem || "");
  modal("Delegar", "Quem fica responsável por: " + p.titulo, [campo("Responsável", quem)],
    () => {
      const alvo = p.fonte === "manual" ? p.bruto : E.djen.find(x => x.id === p.bruto.id);
      if (alvo){ alvo.pessoaId = quem.value || null; tocou(alvo); }
      salvar(); render(); return true;
    }, "Delegar");
}

/* ===================== sincronizar ===================== */
async function sincronizar(quais){
  const alvos = quais || E.oabs;
  if (!alvos.length){ render(); return; }
  const m = $("modal"); m.innerHTML = "";
  m.appendChild(el("h3",null,"Consultando o DJEN"));
  const st = el("p","sb","Conectando…");
  m.appendChild(st);
  const ba = el("div","barra"); const bi = el("i"); bi.style.width = "4%"; ba.appendChild(bi); m.appendChild(ba);
  $("fundo").classList.add("on");

  let feitos = 0, erro = null;
  for (const o of alvos){
    st.textContent = `${o.nome} — OAB/${o.uf} ${o.numero}`;
    try { await buscarOab(o.uf, o.numero, o.nome, msg => { st.textContent = `${o.nome} — ${msg}`; }); }
    catch(e){ erro = e.message; break; }
    feitos++;
    bi.style.width = Math.round((feitos/alvos.length)*100) + "%";
    if (feitos < alvos.length) await new Promise(r => setTimeout(r, 1500));
  }
  E.buscadoEm = HOJE; salvar();

  if (erro){
    m.innerHTML = "";
    m.appendChild(el("h3",null,"Não deu para buscar"));
    m.appendChild(el("p","sb",erro));
    const ac = el("div","acoes"); ac.appendChild(botao("Entendi","check","pri",() => { fechar(); render(); })); m.appendChild(ac);
  } else { fechar(); render(); if (E.djen.length) festa(); }
}

/* ===================== render ===================== */
function render(){
  renderAbas();
  const app = $("app"); app.innerHTML = "";
  if (!configurado()){ app.appendChild(boasVindas()); primeira = false; return; }
  if (aba === "painel")  app.appendChild(telaPainel());
  if (aba === "agenda")  app.appendChild(telaAgenda());
  if (aba === "todo")    app.appendChild(telaTodo());
  if (aba === "equipe")  app.appendChild(telaEquipe());
  if (aba === "config")  app.appendChild(telaConfig());
  app.appendChild(rodape());
  primeira = false;
}

function renderAbas(){
  const box = $("abas"); box.innerHTML = "";
  if (!configurado()) return;
  const pl = placar();
  const defs = [["painel","Painel","alvo",null],["agenda","Agenda","calend",null],
    ["todo","Tarefas","lista",pl.abertas],["equipe","Equipe","pessoa",pessoasVivas().length],["config","Ajustes","engr",null]];
  defs.forEach(([k,rot,ic,n]) => {
    const b = el("button","aba"); b.type = "button"; b.setAttribute("role","tab");
    b.setAttribute("aria-selected", String(aba === k));
    b.appendChild(ico(I[ic])); b.appendChild(el("span",null,rot));
    if (n !== null && n !== undefined) b.appendChild(el("span","n"+(n?"":" zero"),String(n)));
    b.addEventListener("click", () => { aba = k; render();
      try { scrollTo({top:0,behavior:"smooth"}); } catch(e){} });
    box.appendChild(b);
  });
}

function podio(){
  const box = el("div","podio");
  const linhas = pessoasVivas().map(p => {
    const suas = base().filter(x => x.quem === p.id);
    return { p, tot:suas.length, ok:suas.filter(x => x.feita).length,
      pts:suas.filter(x => x.feita).reduce((s,x) => s+PESO[x.tipo],0) };
  }).sort((a,b) => b.pts - a.pts || b.ok - a.ok);
  if (!linhas.length) return box;
  linhas.forEach((l,i) => {
    const r = el("div","pod" + (i < 3 ? " p"+(i+1) : ""));
    r.appendChild(el("div","pos", String(i+1)));
    r.appendChild(avatar(l.p));
    const n = el("div");
    n.appendChild(el("div","nm",l.p.nome));
    n.appendChild(el("div","ps", l.ok + " de " + l.tot + " concluídas · " + l.p.papel));
    r.appendChild(n);
    r.appendChild(el("div","sc", l.pts + " pts"));
    box.appendChild(r);
  });
  return box;
}

  return f;
}

/* ---------- agenda ---------- */
const qzDe = iso => iso.slice(0,7) + (+iso.slice(8,10) <= 15 ? "-Q1" : "-Q2");
function rotuloQz(k){
  const ano = k.slice(0,4), mes = +k.slice(5,7), q = k.slice(8);
  const ult = new Date(Date.UTC(+ano,mes,0)).getUTCDate(), mm = String(mes).padStart(2,"0");
  return { a: q === "Q1" ? "1ª quinzena" : "2ª quinzena", b: MESES[mes-1] + " de " + ano,
    c: q === "Q1" ? "01–15/"+mm : "16–"+ult+"/"+mm };
}
function telaAgenda(){
  const f = document.createDocumentFragment();
  const cab = el("div","cab");
  const d = el("div"); d.appendChild(el("h2",null,"Agenda quinzenal"));
  d.appendChild(el("p",null,"Prazos, sessões e tarefas com data, agrupados por quinzena do calendário."));
  cab.appendChild(d);
  cab.appendChild(botao("Nova tarefa","mais","pri", () => dlgTarefa()));
  f.appendChild(cab);
  f.appendChild(barraFiltros());

  const itens = vis().filter(p => p.data).sort((a,b) => a.data.localeCompare(b.data));
  if (!itens.length){ f.appendChild(vazioBox("calend","Nada nesta seleção","Sem prazo, sessão ou tarefa com data para este filtro.", "Nova tarefa", () => dlgTarefa())); return f; }

  const gr = new Map();
  itens.forEach(p => { const k = qzDe(p.data); if(!gr.has(k)) gr.set(k,[]); gr.get(k).push(p); });
  [...gr.keys()].sort().forEach(k => {
    const lista = gr.get(k), r = rotuloQz(k);
    const nf = lista.filter(p => p.feita).length, limpa = nf === lista.length;
    const bl = el("div","qz");
    const rail = el("div","qzr" + (limpa ? " limpa" : ""));
    rail.appendChild(el("div","a",r.a)); rail.appendChild(el("div","b",r.b)); rail.appendChild(el("div","c",r.c));
    rail.appendChild(el("div","p", limpa ? "quinzena limpa" : nf + " de " + lista.length));
    const ba = el("div","barra"); const bi = el("i"); bi.style.width = (nf/lista.length*100)+"%"; ba.appendChild(bi);
    rail.appendChild(ba);
    bl.appendChild(rail);
    const box = el("div","qzi");
    let marcou = false;
    lista.forEach(p => {
      if (!marcou && p.data >= HOJE && k === qzDe(HOJE)){ const h = el("div","hj"); h.appendChild(el("span",null,"hoje · "+br(HOJE))); box.appendChild(h); marcou = true; }
      box.appendChild(cartao(p));
    });
    bl.appendChild(box);
    f.appendChild(bl);
  });
  return f;
}

function cartao(p){
  const b = p.bruto, ehSessao = p.tipo === "sessao";
  const est = estadoDe(p), R = ROTULO[est];
  const faltam = (!p.data || p.data < HOJE) ? null : uteisEntre(HOJE, p.data);
  const c = el("div","card c-"+R.cor+(p.feita?" done":"")+(est==="perdeu"?" perdeu":""));

  const fl = el("div","fl");
  if (p.data){ fl.appendChild(el("div","m", MES3[+p.data.slice(5,7)-1])); fl.appendChild(el("div","d", p.data.slice(8,10))); }
  else { fl.appendChild(el("div","m","sem")); fl.appendChild(el("div","d","·")); }
  c.appendChild(fl);

  const corpo = el("div");
  const ch = el("div","ch");
  let txt = R.txt;
  if (est === "perdeu") txt = "PERDEU · fatal era " + br(p.data);
  else if (est === "emdia" || est === "atencao") txt = "Faltam " + faltam + (faltam === 1 ? " dia útil" : " dias úteis");
  else if (est === "atrasado") txt = "Atrasado · fatal em " + faltam + (faltam === 1 ? " dia útil" : " dias úteis");
  ch.appendChild(el("span","tag "+R.tag, txt));
  if (p.fonte === "manual") ch.appendChild(el("span","tag t-teal","Tarefa sua"));
  if (b.classe) ch.appendChild(el("span","tag", b.classe.length > 30 ? b.classe.slice(0,28)+"…" : b.classe));
  ch.appendChild(el("span","pts","+"+PESO[p.tipo]));
  corpo.appendChild(ch);

  corpo.appendChild(el("div","ct", p.titulo));
  if (p.data && !ehSessao && !p.feita){
    const int = internoDe(p.data);
    const li = el("div","prazos");
    const a = el("span","pz" + (int < HOJE ? " ruim" : int === HOJE ? " agora" : ""));
    a.appendChild(el("b",null,"preparar até "));
    a.appendChild(el("span",null,br(int)));
    li.appendChild(a);
    const bfat = el("span","pz fatal" + (est === "perdeu" ? " ruim" : ""));
    bfat.appendChild(el("b",null,"fatal "));
    bfat.appendChild(el("span",null,br(p.data)));
    li.appendChild(bfat);
    corpo.appendChild(li);
  }

  const cm = el("div","cm");
  if (p.fonte === "djen"){
    cm.appendChild(el("span","pr", b.proc));
    cm.appendChild(el("span",null, b.trib + (b.orgao ? " · " + b.orgao : "")));
    const quemP = b.sigiloso ? "Processo em segredo de justiça" : (b.partes.length ? b.partes.slice(0,2).join(" × ") : "Partes não informadas");
    cm.appendChild(el("span",null, quemP));
  } else {
    if (b.processo) cm.appendChild(el("span","pr", b.processo));

function mandarEmail(pessoa, lista){
  const abertas = lista.filter(x => !x.feita);
  const NL = String.fromCharCode(10);
  const linhas = abertas.slice().sort((a,b) => (a.data||"9").localeCompare(b.data||"9")).map(x => {
    const est = estadoDe(x);
    const marca = est === "perdeu" ? "[PERDEU] " : est === "atrasado" ? "[ATRASADO] " : "";
    const dt = x.data ? "  fatal " + br(x.data) + " - preparar ate " + br(internoDe(x.data)) : "  sem data definida";
    const proc = x.bruto.proc || x.bruto.processo;
    return ["- " + marca + x.titulo, dt].concat(proc ? ["  processo " + proc] : []).join(NL);
  }).join(NL + NL);
  const corpo = [
    "Oi, " + pessoa.nome.split(" ")[0] + "!",
    "",
    "Seguem as tarefas sob sua responsabilidade:",
    "",
    linhas || "(nada em aberto)",
    "",
    "---",
    "Datas sugeridas a partir do Diario de Justica Eletronico Nacional.",
    "Confira nos autos antes de considerar prazo.",
    "Para colocar na agenda, peca o arquivo .ics (botao Calendario dela, no painel).",
  ].join(NL);
  const url = "mailto:" + encodeURIComponent(pessoa.email)
    + "?subject=" + encodeURIComponent("Suas tarefas - " + abertas.length + " em aberto")
    + "&body=" + encodeURIComponent(corpo);
  try { window.open(url, "_blank"); } catch(e){ location.href = url; }
}

  "    }",
  "    match /times/{timeId}/{colecao}/{doc} {",
  "      allow read, write: if request.auth != null",

  const cabCal = el("div","cab"); const dcal = el("div");
  dcal.appendChild(el("h2",null,"Calendário"));
  dcal.appendChild(el("p",null,"Gere um arquivo .ics com todos os prazos em aberto e importe no Google Agenda, Outlook ou Apple. Cada evento leva dois alertas: um na antecedência escolhida e outro na véspera do fatal."));
  cabCal.appendChild(dcal); f.appendChild(cabCal);
  const acCal = el("div"); acCal.style.cssText = "display:flex;gap:10px;flex-wrap:wrap";
  acCal.appendChild(botao("Baixar .ics de tudo em aberto","calend","pri", () => baixarIcs(base().filter(x => !x.feita), "tudo")));
  acCal.appendChild(botao("Só os meus (sem responsável)","calend","", () => baixarIcs(base().filter(x => !x.feita && !x.quem), "meus")));
  f.appendChild(acCal);
  const comoCal = el("p","ps","No Google Agenda: engrenagem → Importar e exportar → Importar → escolha o arquivo. Importar de novo depois atualiza os mesmos eventos, porque cada um tem identificador fixo.");
  comoCal.style.marginTop = "12px"; f.appendChild(comoCal);

  const ac = el("div"); ac.style.cssText = "display:flex;gap:10px;flex-wrap:wrap;margin-top:18px";
  ac.appendChild(botao("Atualizar publicações","troca","pri", () => sincronizar()));
  ac.appendChild(botao("Exportar dados","baixar","", exportar));
  ac.appendChild(botao("Importar dados","seta","", importar));
  if (promptInstalar){
    ac.appendChild(botao("Instalar como aplicativo","baixar","pri", async () => {
      promptInstalar.prompt(); await promptInstalar.userChoice; promptInstalar = null; render();
    }));
  }
  ac.appendChild(botao("Apagar tudo","lixo","", () => {
    if (confirm("Apagar OABs, equipe, tarefas e marcações deste navegador? Não dá para desfazer.")){
      E = vazio(); salvar(); aba = "painel"; render();
    }
  }));
  f.appendChild(ac);
  if (E.buscadoEm){ const s = el("p","ps","Última busca no DJEN: " + br(E.buscadoEm)); s.style.marginTop = "14px"; f.appendChild(s); }
  return f;
}

async function exportar(){
  await salvarArquivo("painel-prazos-" + HOJE + ".json", JSON.stringify(E, null, 2), "application/json");
}
function importar(){
  const i = el("input"); i.type = "file"; i.accept = "application/json";
  i.addEventListener("change", () => {
    const f = i.files && i.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || typeof d !== "object" || !("versao" in d)) throw new Error();
        E = Object.assign(vazio(), d); salvar(); render(); festa();
      } catch(e){ alert("Esse arquivo não é um backup do painel."); }
    };
    r.readAsText(f);
  });
  i.click();
}
