/* ===================== busca no DJEN ===================== */
const RX_PRAZO = /prazo\s+(?:comum\s+|sucessivo\s+|legal\s+|improrrog[áa]vel\s+)?(?:de\s+)?(\d{1,3})\s*\(?[a-zç\s]{0,12}?\)?\s*dias?/i;
const RX_SESSAO = /(?:realizar-se|realizada|julgamento do dia|do dia|sess[ãa]o)[^.]{0,90}?(\d{2}\/\d{2}\/\d{4})/i;
/* Decisões que valem histórico. A ordem importa: acórdão antes de sentença,
   porque um acórdão frequentemente cita a sentença que reformou. */
const TIPOS_DECISAO = [
  { id:"acordao",  rot:"Acórdão",              rx:/\bac[óo]rd[ãa]o\b|ac[óo]rd[ãa]o\s+(?:da|do)|EMENTA\s*:/i },
  { id:"sentenca", rot:"Sentença",             rx:/\bsenten[çc]a\b|julgo\s+(?:procedente|improcedente|extinto)|dispositivo\s+da\s+senten/i },
  { id:"mono",     rot:"Decisão monocrática",  rx:/decis[ãa]o\s+monocr[áa]tica|monocraticamente/i },
  { id:"liminar",  rot:"Liminar / tutela",     rx:/\bliminar\b|tutela\s+(?:de\s+urg[êe]ncia|antecipada|provis[óo]ria)/i },
];
/* Guarda o trecho em volta da palavra encontrada: é o que a pessoa lê para
   confirmar se aquilo é mesmo a decisão, sem abrir o inteiro teor. */
function achaDecisao(texto){
  for (const t of TIPOS_DECISAO){
    const m = texto.match(t.rx);
    if (m){
      const i = Math.max(0, m.index - 130);
      return { tipo: t.id, rotulo: t.rot, trecho: texto.slice(i, m.index + 320).trim() };
    }
  }
  return null;
}
const ACOES = [["Manifestar-se",/manifest[ae]-?se|para manifesta/i],["Contrarrazões",/contrarraz/i],["Impugnar",/impugna[çc]/i],
  ["Embargos de declaração",/embargos de declara/i],["Custas / preparo",/\bcustas\b|preparo recursal/i],
  ["Ciência",/\bci[êe]ncia\b/i],["Cumprir determinação",/cumpra-se|dever[áa] cumprir/i]];
const limpa = s => String(s||"").replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/\s+/g," ").trim();

function converte(c, rotulo){
  const t = limpa(c.texto), mp = t.match(RX_PRAZO);
  const ms = /pauta/i.test(c.tipoComunicacao||"") ? t.match(RX_SESSAO) : null;
  const disp = new Date(c.data_disponibilizacao+"T00:00:00Z");
  const pub = proxUtil(disp), ini = proxUtil(pub);
  const dias = mp ? parseInt(mp[1],10) : null;
  const fim = dias ? somaUteis(ini, dias-1) : null;
  const partes = (c.destinatarios||[]).map(d => d.nome).filter(Boolean);
  const sig = partes.some(p => /^sigilo/i.test(p)) || !partes.length;
  return { id:c.id, hash:c.hash, proc:c.numeroprocessocommascara||c.numero_processo, trib:c.siglaTribunal,
    orgao:c.nomeOrgao, classe:c.nomeClasse||null, tipo:c.tipoComunicacao, disp:c.data_disponibilizacao,
    pub:isoDe(pub), inicio:isoDe(ini), fim:fim?isoDe(fim):null, dias,
    trecho_prazo: mp ? mp[0].replace(/\s+/g," ").trim() : null,
    sessao: ms ? ms[1].split("/").reverse().join("-") : null,
    advs:[rotulo], partes: sig?[]:partes.slice(0,4), sigiloso:sig,
    acoes: ACOES.filter(([,rx]) => rx.test(t)).map(([n]) => n), link:c.link||null,
    decisao: achaDecisao(t),
    feita:false, pessoaId:null, atualizadoEm: new Date().toISOString() };
}

/* ---------- Acompanhamento Paralelo ----------
   Diferença essencial em relação ao radar de OAB: nesses processos o escritório
   NÃO é parte nem procurador — são casos de terceiro que a equipe acompanha.
   Logo a busca é por NÚMERO DO PROCESSO, e o que sai daqui é INFORMAÇÃO, nunca
   prazo do escritório. Por isso vive em coleção separada e não entra na agenda,
   no placar nem no alarme de PERDEU. */
const soDigitos = t => String(t || "").replace(/\D/g, "");
const mascaraCNJ = d => d.length === 20
  ? d.slice(0,7) + "-" + d.slice(7,9) + "." + d.slice(9,13) + "." + d.slice(13,14) + "." + d.slice(14,16) + "." + d.slice(16)
  : d;

function lerListaProcessos(texto){
  const achados = new Map();
  String(texto || "").split(/\r?\n/).forEach(linha => {
    const m = linha.match(/(\d{7}-?\d{2}\.?\d{4}\.?\d\.?\d{2}\.?\d{4})/);
    if (!m) return;
    const num = soDigitos(m[1]);
    if (num.length !== 20) return;
    /* rótulo = o que sobra da linha sem o número, sem vírgulas de CSV nas pontas */
    /* O rótulo é o que sobra da linha, limpo o bastante para ser lido por gente.
       O CSV do Escavador repete o número em duas colunas e emenda tribunal,
       tags e datas — corta tudo isso e fica só o "quem contra quem". */
    let rot = linha.replace(/\d{7}-?\d{2}\.?\d{4}\.?\d\.?\d{2}\.?\d{4}/g, " ");
    rot = rot.replace(/^\s*"?\d{4,}"?\s*[;,\t]/, " ");
    rot = rot.replace(/\b(PROCESSO|TERMO|ORGAO|PESSOA|NAO|SIM)\b/g, " ");
    rot = rot.split(/\d{4}-\d{2}-\d{2}/)[0];
    rot = rot.replace(/[;,\t]+/g, " ").replace(/\s+/g, " ").trim();
    rot = rot.replace(/\s+(TJ|TRF|TRT|TRE|STJ|STF|STM|TST)[A-Z0-9-]*\s*$/i, "");
    rot = rot.replace(/^["'\-\s]+|["'\-\s|]+$/g, "").slice(0, 90);
    if (!achados.has(num)) achados.set(num, { id: num, numero: num, rotulo: rot || null });
  });
  return [...achados.values()];
}

async function varrerParalelo(aviso){
  const lista = E.processos.filter(p => !p.removido);
  if (!lista.length) throw new Error("Nenhum processo na lista. Importe a lista do Acompanhamento Paralelo primeiro.");
  const fim = HOJE, ini = dataLocal(new Date(Date.now() - (E.paraleloDias || 30) * 864e5));
  let novos = 0, comMovimento = 0, lidos = 0;
  for (const p of lista){
    lidos++;
    if (aviso) aviso(lidos, lista.length, p.rotulo || mascaraCNJ(p.numero));
    const url = "https://comunicaapi.pje.jus.br/api/v1/comunicacao?numeroProcesso=" + p.numero
      + "&dataDisponibilizacaoInicio=" + ini + "&dataDisponibilizacaoFim=" + fim + "&itensPorPagina=100";
    let d;
    try {
      const r = await fetch(url);
      if (r.status === 429){ await new Promise(x => setTimeout(x, 9000)); continue; }
      if (!r.ok) continue;
      d = await r.json();
    } catch(e){ continue; }
    const itens = d.items || [];
    if (itens.length) comMovimento++;
    itens.forEach(c => {
      if (E.paralelo.some(x => String(x.id) === String(c.id))) return;
      const t = limpa(c.texto);
      const partes = (c.destinatarios || []).map(x => x.nome).filter(Boolean);
      const sig = partes.some(x => /^sigilo/i.test(x)) || !partes.length;
      E.paralelo.push({
        id: c.id, hash: c.hash, numero: p.numero, rotulo: p.rotulo || null,
        proc: c.numeroprocessocommascara || c.numero_processo, trib: c.siglaTribunal,
        orgao: c.nomeOrgao, classe: c.nomeClasse || null, tipo: c.tipoComunicacao,
        disp: c.data_disponibilizacao, link: c.link || null,
        partes: sig ? [] : partes.slice(0,4), sigiloso: sig,
        resumo: t.slice(0, 400), tamanho: t.length,
        atualizadoEm: new Date().toISOString(),
      });
      novos++;
    });
    await new Promise(x => setTimeout(x, 3500));
  }
  E.paraleloEm = new Date().toISOString();
  salvar();
  return { lidos, comMovimento, novos };
}

/* Busca incremental: pega só o que entrou desde a última vez, com 3 dias de
   folga para o caso de o tribunal publicar com atraso. Roda sozinha uma vez
   por dia; o botão continua existindo para quem quiser agora. */
const HORAS_ENTRE_BUSCAS = 12;
function precisaBuscar(){
  if (!E.oabs.length) return false;
  if (!E.buscadoEm) return true;
  const ultimo = new Date(E.buscadoEm + (E.buscadoEm.length === 10 ? "T00:00:00" : ""));
  return (Date.now() - ultimo.getTime()) > HORAS_ENTRE_BUSCAS * 3600e3;
}
async function buscarNovas(aviso){
  if (!E.oabs.length) throw new Error("Nenhuma OAB cadastrada.");
  const antes = E.djen.length;
  let dias = E.janelaDias;
  if (E.buscadoEm){
    const passou = Math.ceil((Date.now() - new Date(E.buscadoEm + (E.buscadoEm.length === 10 ? "T00:00:00" : "")).getTime()) / 864e5);
    dias = Math.min(E.janelaDias, Math.max(3, passou + 3));
  }
  const guardado = E.janelaDias;
  E.janelaDias = dias;
  try {
    for (let i = 0; i < E.oabs.length; i++){
      const o = E.oabs[i];
      if (aviso) aviso(i + 1, E.oabs.length, o.nome);
      await buscarOab(o.uf, o.numero, o.nome, null);
      if (i < E.oabs.length - 1) await new Promise(r => setTimeout(r, 1500));
    }
  } finally { E.janelaDias = guardado; }
  E.buscadoEm = agoraISO();
  salvar();
  anotaBusca();
  return { novas: E.djen.length - antes, janela: dias };
}
async function marcadorBusca(){
  if (!E.time) return null;
  try {
    const d = await fsChama(caminho("meta", "busca"), { method: "GET" });
    return d ? deDoc(d) : { em: null };
  } catch(e){ return null; }
}
async function anotaBusca(){
  if (!E.time) return;
  try { await fsGrava("meta", "busca", { em: agoraISO(), por: (E.time && E.time.meuNome) || "" }); } catch(e){}
}
async function alguemBuscouAgora(){
  const m = await marcadorBusca();
  if (!m || !m.em) return false;
  return (Date.now() - new Date(m.em).getTime()) < HORAS_ENTRE_BUSCAS * 3600e3;
}

async function buscaAutomatica(){
  if (!precisaBuscar() || !podeBuscar) return;
  /* alguém do time já buscou nas últimas 12h? então não repete a chamada */
  if (await alguemBuscouAgora()){ E.buscadoEm = agoraISO(); salvar(); return; }
  try {
    const r = await buscarNovas(null);
    if (r.novas){ await sincronizarTime(true); render(); }
    else salvar();
  } catch(e){ /* silenciosa: o botão manual mostra o erro de verdade */ }
}

async function testarBusca(){
  if (podeBuscar !== null) return podeBuscar;
  try {
    const r = await fetch("https://comunicaapi.pje.jus.br/api/v1/comunicacao/tribunal", {cache:"no-store"});
    podeBuscar = r.ok;
  } catch(e){ podeBuscar = false; }
  return podeBuscar;
}

async function buscarOab(uf, numero, nome, aviso){
  const fim = HOJE, ini = isoDe(new Date(Date.now() - E.janelaDias*864e5));
  const rotulo = nome || ("OAB/"+uf+" "+numero);
  let pagina = 1, lidos = 0, total = null, novos = 0;
  for(;;){
    const url = "https://comunicaapi.pje.jus.br/api/v1/comunicacao?numeroOab="+encodeURIComponent(numero)
      + "&ufOab="+encodeURIComponent(uf) + "&dataDisponibilizacaoInicio="+ini + "&dataDisponibilizacaoFim="+fim
      + "&itensPorPagina=100&pagina="+pagina;
    const r = await fetch(url);
    if (r.status === 429) throw new Error("O CNJ pediu para desacelerar (429). Espere um minuto e tente de novo.");
    if (r.status === 403) throw new Error("O CNJ recusou esta rede (403). Ele bloqueia acesso vindo de datacenter — abra o arquivo numa máquina em rede residencial ou do escritório.");
    if (!r.ok) throw new Error("O CNJ respondeu HTTP " + r.status + ".");
    const d = await r.json();
    if (total === null) total = d.count;
    const itens = d.items || [];
    itens.forEach(c => {
      const ja = E.djen.find(x => x.id === c.id);
      if (ja){ if (!ja.advs.includes(rotulo)) ja.advs.push(rotulo); }
      else { E.djen.push(converte(c, rotulo)); novos++; }
    });
    lidos += itens.length;
    if (aviso) aviso(`Lendo… ${lidos} de ${total}`);
    if (itens.length < 100 || lidos >= total) break;
    pagina++;
    await new Promise(r => setTimeout(r, 1200));
  }
  return { lidos, novos, total };
}


/* ===================== calendário (.ics e Google) ===================== */
const icsEsc = t => String(t||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
const bytes = t => new TextEncoder().encode(t).length;
function dobra(linha){
  const out = []; let cur = linha;
  while (bytes(cur) > 73){
    let k = 73;
    while (bytes(cur.slice(0,k)) > 73) k--;
    out.push(cur.slice(0,k)); cur = " " + cur.slice(k);
  }
  out.push(cur); return out.join("\r\n");
}
const compacta = iso => iso.replace(/-/g,"");
const maisUmDia = iso => compacta(isoDe(new Date(new Date(iso+"T00:00:00Z").getTime()+864e5)));
const carimbo = () => new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");

function descreve(p){
  const b = p.bruto, L = [];
  if (p.data && p.tipo !== "sessao") L.push("Preparar até " + br(internoDe(p.data)) + " · prazo fatal " + br(p.data));
  if (b.proc || b.processo) L.push("Processo: " + (b.proc || b.processo));
  if (b.trib) L.push("Tribunal: " + b.trib + (b.orgao ? " — " + b.orgao : ""));
  if (b.partes && b.partes.length) L.push("Partes: " + b.partes.slice(0,2).join(" x "));
  if (b.sigiloso) L.push("Processo em segredo de justiça");
  if (p.quem) L.push("Responsável: " + (pessoaDe(p.quem)||{}).nome);
  if (b.nota) L.push(b.nota);
  if (b.trecho_prazo) L.push("No texto da publicação: " + b.trecho_prazo);
  if (b.hash) L.push("Certidão: https://comunicaapi.pje.jus.br/api/v1/comunicacao/" + b.hash + "/certidao");
  L.push("");
  L.push("Data sugerida pelo Painel de Prazos a partir do DJEN. Confira nos autos.");
  return L.join("\n");
}
function evento(p){
  const b = p.bruto, resp = pessoaDe(p.quem);
  const tit = tituloEvento(p);
  const L = ["BEGIN:VEVENT",
    "UID:" + p.key + "-" + (b.id || b.criada || "x") + "@painel-prazos",
    "DTSTAMP:" + carimbo(),
    "DTSTART;VALUE=DATE:" + compacta(p.data),
    "DTEND;VALUE=DATE:" + maisUmDia(p.data),
    "SUMMARY:" + icsEsc(tit),
    "DESCRIPTION:" + icsEsc(descreve(p)),
    "STATUS:CONFIRMED",
    "TRANSP:TRANSPARENT"];
  if (resp && resp.email) L.push("ATTENDEE;CN=" + icsEsc(resp.nome) + ";ROLE=REQ-PARTICIPANT:mailto:" + resp.email);
  const eu = euSou();
  if (eu && eu.email && (!resp || resp.email !== eu.email)) L.push("ORGANIZER;CN=" + icsEsc(eu.nome) + ":mailto:" + eu.email);
  const ant = Math.max(1, E.antecedencia || 3);
  if (p.tipo !== "sessao"){
    L.push("BEGIN:VALARM","TRIGGER:-P" + ant + "D","ACTION:DISPLAY",
      "DESCRIPTION:" + icsEsc("Começar agora: " + p.titulo + " (fatal " + br(p.data) + ")"),"END:VALARM");
  }
  L.push("BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY",
    "DESCRIPTION:" + icsEsc((p.tipo === "sessao" ? "Sessão amanhã: " : "PRAZO FATAL amanhã: ") + p.titulo),"END:VALARM");
  L.push("END:VEVENT");
  return L;
}
/* Além do evento do prazo fatal, um evento no dia de COMEÇAR. Ver os dois no
   calendário é o que torna a antecedência visível de verdade. */
function eventoPreparo(p){
  const b = p.bruto, int = internoDe(p.data);
  if (!int || int >= p.data) return [];
  return ["BEGIN:VEVENT",
    "UID:prep-" + p.key + "-" + (b.id || b.criada || "x") + "@painel-prazos",
    "DTSTAMP:" + carimbo(),
    "DTSTART;VALUE=DATE:" + compacta(int),
    "DTEND;VALUE=DATE:" + maisUmDia(int),
    "SUMMARY:" + icsEsc("COMEÇAR: " + p.titulo + " (fatal " + br(p.data) + ")"),
    "DESCRIPTION:" + icsEsc(descreve(p)),
    "STATUS:CONFIRMED","TRANSP:TRANSPARENT",
    "BEGIN:VALARM","TRIGGER:-PT1H","ACTION:DISPLAY",
    "DESCRIPTION:" + icsEsc("Hoje é o dia de começar: " + p.titulo),"END:VALARM",
    "END:VEVENT"];
}
function montaIcs(lista){
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Painel de Prazos//DJEN//PT-BR",
    "CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Prazos (DJEN)"];
  lista.filter(p => p.data).forEach(p => {
    if (p.tipo !== "sessao") eventoPreparo(p).forEach(l => L.push(l));
    evento(p).forEach(l => L.push(l));
  });
  L.push("END:VCALENDAR");
  return L.map(dobra).join("\r\n") + "\r\n";
}
async function baixarIcs(lista, sufixo){
  const comData = lista.filter(p => p.data);
  if (!comData.length){ alert("Nenhum item com data para mandar ao calendário."); return; }
  await salvarArquivo("prazos-" + (sufixo || "painel") + "-" + HOJE + ".ics", montaIcs(comData), "text/calendar");
}
/* Convidados: o Google Agenda aceita "add" com e-mails separados por vírgula.
   Ao salvar o evento, ELE dispara os convites — coisa que importar .ics não faz. */
function convidados(p, todos){
  const emails = [];
  const resp = pessoaDe(p.quem);
  if (resp && resp.email) emails.push(resp.email);
  if (todos) pessoasVivas().forEach(x => { if (x.email && !emails.includes(x.email)) emails.push(x.email); });
  return emails;
}
function tituloEvento(p){
  const proc = p.bruto.proc || p.bruto.processo || "";
  const parte = (p.bruto.partes || [])[0];
  const alvo = parte || proc || "";
  if (p.tipo === "sessao") return "SESSÃO DE JULGAMENTO — " + p.titulo + (alvo ? " · " + alvo : "");
  return "PRAZO FATAL: " + p.titulo + (alvo ? " · " + alvo : "");
}
function linkGoogle(p, todos){
  const campos = { action:"TEMPLATE",
    text: tituloEvento(p),
    dates: compacta(p.data) + "/" + maisUmDia(p.data),
    details: descreve(p) };
  const gente = convidados(p, todos);
  if (gente.length) campos.add = gente.join(",");
  return "https://calendar.google.com/calendar/render?" + new URLSearchParams(campos).toString();
}
async function salvarArquivo(nome, texto, mime){
  try {
    const dl = window.claude && await window.claude.use("downloads");
    if (dl){ await dl.save({ filename:nome, data:texto }); return true; }
  } catch(e){}
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([texto], {type:mime||"application/json"}));
    a.download = nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return true;
  } catch(e){ alert("Não consegui salvar o arquivo aqui."); return false; }
}

/* ===================== time compartilhado (Firestore REST) =====================
   Sem SDK e sem script externo: só fetch, igual ao que o painel já faz com o DJEN.
   Modelo local-first — tudo continua funcionando offline no localStorage, e a
   sincronização reconcilia por documento, com "quem escreveu por último vence"
   comparando o campo atualizadoEm. */

const FS = "https://firestore.googleapis.com/v1";
const COLECOES = ["pessoas", "tarefas", "djen", "processos", "paralelo", "recados", "oabs"];
/* Ritmo adaptativo: rápido enquanto há gente mexendo, lento quando está parado,
   e PARADO quando a aba está escondida. Isso é o que deixa a conversa entre duas
   pessoas parecer imediata sem estourar a cota gratuita — uma aba escondida não
   gasta leitura nenhuma, e ao voltar ela sincroniza na hora. */
const SINAL_RAPIDO = 7000, SINAL_LENTO = 30000, JANELA_ATIVA = 120000;
let sincronizando = false, ultimoErroSync = null, timerSync = null;
let timerSinal = null, sinalVisto = null, aoVivo = false, ultimaAtividade = 0, ritmoAtual = 0;

const agoraISO = () => new Date().toISOString();
function b64url(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function deB64url(s){
  const t = s.replace(/-/g,"+").replace(/_/g,"/");
  return decodeURIComponent(escape(atob(t + "===".slice((t.length + 3) % 4))));
}
function codificaCodigo(c){ return b64url(JSON.stringify([c.projectId, c.apiKey, c.timeId, c.nome || ""])); }
function decodificaCodigo(txt){
  try {
    const a = JSON.parse(deB64url(String(txt).trim()));
    if (!Array.isArray(a) || a.length < 3 || !a[0] || !a[1] || !a[2]) return null;
    return { projectId:a[0], apiKey:a[1], timeId:a[2], nome:a[3] || "Time" };
  } catch(e){ return null; }
}

/* ---- conversão de valores para o formato do Firestore ---- */
function paraFs(v){
  if (v === null || v === undefined) return { nullValue: null };
  if (typeof v === "boolean") return { booleanValue: v };
  if (typeof v === "number") return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(paraFs) } };
  if (typeof v === "object"){ const f = {}; for (const k in v) f[k] = paraFs(v[k]); return { mapValue: { fields: f } }; }
  return { stringValue: String(v) };
}
function deFs(v){
  if (!v || typeof v !== "object") return null;
  if ("nullValue" in v) return null;
  if ("booleanValue" in v) return v.booleanValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return v.doubleValue;
  if ("stringValue" in v) return v.stringValue;
  if ("timestampValue" in v) return v.timestampValue;
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(deFs);
  if ("mapValue" in v){ const o = {}, f = v.mapValue.fields || {}; for (const k in f) o[k] = deFs(f[k]); return o; }
  return null;
}
const paraDoc = o => { const f = {}; for (const k in o) f[k] = paraFs(o[k]); return { fields: f }; };
const deDoc = d => { const o = {}, f = (d && d.fields) || {}; for (const k in f) o[k] = deFs(f[k]); return o; };

/* ---- identidade (login anônimo do Firebase) ---- */
async function tokenValido(){
  const t = E.time;
  if (!t) throw new Error("Sem time configurado.");
  if (t.idToken && t.expira && Date.now() < t.expira - 60000) return t.idToken;
  if (t.refreshToken){
    const r = await fetch("https://securetoken.googleapis.com/v1/token?key=" + encodeURIComponent(t.apiKey), {
      method:"POST", headers:{ "Content-Type":"application/x-www-form-urlencoded" },
      body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(t.refreshToken),
    });
    if (r.ok){
      const d = await r.json();
      t.idToken = d.id_token; t.refreshToken = d.refresh_token;
      t.expira = Date.now() + (Number(d.expires_in || 3600) * 1000);
      t.uid = d.user_id || t.uid; salvar();
      return t.idToken;
    }
  }
  return await autenticar();
}
async function autenticar(){
  const t = E.time;
  const r = await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + encodeURIComponent(t.apiKey), {
    method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ returnSecureToken:true }),
  });
  const d = await r.json();
  if (!r.ok){
    const m = (d.error && d.error.message) || "";
    if (/API key not valid/i.test(m)) throw new Error("A chave da API não é válida. Confira o campo apiKey no código do time.");
    if (/ADMIN_ONLY_OPERATION|OPERATION_NOT_ALLOWED/i.test(m)) throw new Error("O login anônimo está desligado no projeto. No console do Firebase: Authentication > Sign-in method > Anônimo > Ativar.");
    throw new Error("Não consegui autenticar: " + m);
  }
  t.idToken = d.idToken; t.refreshToken = d.refreshToken;
  t.expira = Date.now() + (Number(d.expiresIn || 3600) * 1000);
  t.uid = d.localId; salvar();
  return t.idToken;
}

/* ---- chamadas ao Firestore ---- */
function raiz(){ return FS + "/projects/" + E.time.projectId + "/databases/(default)/documents"; }
function caminho(col, id){ return raiz() + "/times/" + E.time.timeId + "/" + col + (id ? "/" + encodeURIComponent(id) : ""); }

async function fsChama(url, opcoes){
  const tk = await tokenValido();
  const r = await fetch(url, Object.assign({}, opcoes, {
    headers: Object.assign({ "Authorization": "Bearer " + tk, "Content-Type": "application/json" }, (opcoes||{}).headers),
  }));
  if (r.status === 404) return null;
  if (!r.ok){
    let m = "HTTP " + r.status;
    try { const e = await r.json(); m = (e.error && e.error.message) || m; } catch(x){}
    if (r.status === 403 && /has not been used|disabled/i.test(m))
      throw new Error("O Firestore ainda não foi criado nesse projeto. No console do Firebase: Firestore Database > Criar banco de dados.");
    if (r.status === 403 || r.status === 401)
      throw new Error("O Firestore recusou o acesso. Confira se as regras de segurança foram publicadas. (" + m + ")");
    throw new Error(m);
  }
  return r.status === 204 ? {} : r.json();
}
async function fsLista(col){
  const saida = []; let pagina = null;
  for(;;){
    const u = caminho(col) + "?pageSize=300" + (pagina ? "&pageToken=" + encodeURIComponent(pagina) : "");
    const d = await fsChama(u, { method:"GET" });
    if (!d) break;
    (d.documents || []).forEach(doc => {
      const o = deDoc(doc);
      o.id = doc.name.split("/").pop();
      saida.push(o);
    });
    if (!d.nextPageToken) break;
    pagina = d.nextPageToken;
  }
  return saida;
}
const fsGrava = (col, id, obj) => fsChama(caminho(col, id), { method:"PATCH", body: JSON.stringify(paraDoc(obj)) });

/* ---- sinal: o contador que avisa que alguém mexeu ---- */
async function lerSinal(){
  const d = await fsChama(caminho("meta", "sinal"), { method: "GET" });
  return d ? (deDoc(d).versao || 0) : 0;
}
async function baterSinal(){
  try {
    const atual = await lerSinal();
    await fsGrava("meta", "sinal", { versao: atual + 1, em: agoraISO(), por: (E.time && E.time.meuNome) || "" });
    sinalVisto = atual + 1;
  } catch(e) { /* o sinal é um acelerador, não pode derrubar a gravação */ }
}
async function espiarSinal(){
  if (!E.time || sincronizando) return;
  try {
    const v = await lerSinal();
    if (sinalVisto === null) { sinalVisto = v; return; }
    if (v !== sinalVisto) { sinalVisto = v; houveAtividade(); await sincronizarTime(true); }
    else reagendaSinal();
  } catch(e) { /* silencioso: erro real aparece na sincronização */ }
}
function ritmo(){
  return (Date.now() - ultimaAtividade < JANELA_ATIVA) ? SINAL_RAPIDO : SINAL_LENTO;
}
function reagendaSinal(){
  const alvo = ritmo();
  if (alvo === ritmoAtual && timerSinal) return;
  ritmoAtual = alvo;
  clearInterval(timerSinal);
  timerSinal = setInterval(() => {
    if (typeof document !== "undefined" && document.hidden) return;  // aba escondida não gasta cota
    espiarSinal();
  }, alvo);
}
function houveAtividade(){ ultimaAtividade = Date.now(); reagendaSinal(); }
function ligarAoVivo(){
  if (aoVivo) return;
  aoVivo = true;
  houveAtividade();
  addEventListener("focus", () => { if (E.time && !sincronizando) sincronizarTime(true); });
  addEventListener("visibilitychange", () => { if (!document.hidden && E.time && !sincronizando) sincronizarTime(true); });
}

/* ---- entrar / sair ---- */
async function entrarNoTime(codigo, meuNome){
  const c = decodificaCodigo(codigo);
  if (!c) throw new Error("Esse código não é válido. Peça de novo a quem criou o time.");
  E.time = { projectId:c.projectId, apiKey:c.apiKey, timeId:c.timeId, nome:c.nome,
    meuNome: meuNome || "Sem nome", uid:null, idToken:null, refreshToken:null, expira:0, sincronizadoEm:null };
  salvar();
  await tokenValido();
  await fsGrava("membros", E.time.uid, { nome: E.time.meuNome, entrouEm: agoraISO() });
  await sincronizarTime();
  ligarAoVivo();
}
function sairDoTime(){ E.time = null; sinalVisto = null; clearInterval(timerSinal); aoVivo = false; salvar(); render(); }

/* ---- reconciliação ---- */
function localDe(col){
  if (col === "pessoas") return E.pessoas;
  if (col === "tarefas") return E.tarefas;
  if (col === "processos") return E.processos;
  if (col === "recados") return E.recados;
  if (col === "oabs") return E.oabs.map(o => Object.assign({}, o, { id: o.id || (o.uf + o.numero) }));
  if (col === "paralelo") return E.paralelo.map(i => Object.assign({}, i, { id: String(i.id) }));
  return E.djen.map(i => Object.assign({}, i, { id: String(i.id) }));
}
function aplicaLocal(col, lista){
  if (col === "pessoas") E.pessoas = lista;
  else if (col === "tarefas") E.tarefas = lista;
  else if (col === "processos") E.processos = lista;
  else if (col === "recados") E.recados = lista;
  else if (col === "oabs") E.oabs = lista;
  else if (col === "paralelo") E.paralelo = lista.map(i => Object.assign({}, i, { id: isNaN(+i.id) ? i.id : +i.id }));
  else E.djen = lista.map(i => Object.assign({}, i, { id: isNaN(+i.id) ? i.id : +i.id }));
}
const chaveDe = o => String(o.id);
const quando = o => o.atualizadoEm || "1970-01-01T00:00:00.000Z";

async function sincronizarTime(silencioso){
  if (!E.time || sincronizando) return;
  sincronizando = true; ultimoErroSync = null;
  let enviou = false;
  if (!silencioso) pintaSync();
  try {
    for (const col of COLECOES){
      const remotos = await fsLista(col);
      const mapaR = new Map(remotos.map(o => [chaveDe(o), o]));
      const locais = localDe(col);
      const mapaL = new Map(locais.map(o => [chaveDe(o), o]));
      const chaves = new Set([...mapaR.keys(), ...mapaL.keys()]);
      const fundido = [], mandar = [];

      chaves.forEach(k => {
        const r = mapaR.get(k), l = mapaL.get(k);
        if (r && !l){ if (!r.removido) fundido.push(r); }
        else if (l && !r){ const c = Object.assign({}, l); if (!c.atualizadoEm) c.atualizadoEm = agoraISO(); mandar.push(c); if (!c.removido) fundido.push(c); }
        else {
          const vence = quando(l) > quando(r) ? l : r;
          if (!vence.removido) fundido.push(vence);
          if (vence === l && quando(l) !== quando(r)) mandar.push(l);
        }
      });

      aplicaLocal(col, fundido);
      for (const o of mandar){
        const corpo = Object.assign({}, o); delete corpo.id;
        await fsGrava(col, chaveDe(o), corpo);
        enviou = true;
      }
    }
    E.time.sincronizadoEm = agoraISO();
    salvar();
    if (enviou) await baterSinal(); else { try { sinalVisto = await lerSinal(); } catch(x){} }
    ligarAoVivo();
  } catch(e){
    ultimoErroSync = e.message || String(e);
  } finally {
    sincronizando = false;
    if (!silencioso) render(); else pintaSync();
  }
}

/* Marca a hora de alteração e agenda o envio. Chamado sempre que algo muda. */
function tocou(obj){
  if (obj) obj.atualizadoEm = agoraISO();
  if (!E.time) return;
  houveAtividade();
  clearTimeout(timerSync);
  timerSync = setTimeout(() => sincronizarTime(true), 2500);
}

function pintaSync(){
  const n = document.getElementById("sublinha");
  if (!n || !E.time) return;
  if (sincronizando){ n.textContent = "Time " + E.time.nome + " · sincronizando…"; return; }
  if (ultimoErroSync){ n.textContent = "Time " + E.time.nome + " · falhou ao sincronizar"; return; }
  const q = E.time.sincronizadoEm;
  n.textContent = "Time " + E.time.nome + (q ? " · sincronizado " + horaLocal(q) : "");
}

/* ===================== gamificação ===================== */
function placar(){
  /* Dispensada nao conta em lugar nenhum: nem como pendencia, nem no
     denominador do progresso, nem como atraso. So os pontos ja ganhos ficam. */
  const todas = base();
  const b = todas.filter(p => !p.dispensada);
  const f = b.filter(p => p.feita);
  const pontos = todas.filter(p => p.feita).reduce((s,p) => s + PESO[p.tipo], 0);
  return { total:b.length, feitas:f.length, pontos, pct: b.length ? f.length/b.length : 0, abertas:b.length - f.length,
    atrasadas: b.filter(atrasada).length, perdidas: b.filter(perdida).length,
    dispensadas: todas.length - b.length };
}
const NIVEIS = [[0,"Aquecendo"],[50,"No ritmo"],[130,"Em dia"],[250,"Adiantado"],[400,"Impecável"],[600,"Lendário"]];
function nivelDe(p){ let k=0; NIVEIS.forEach((n,i) => { if (p >= n[0]) k = i; });
  return { i:k, nome:NIVEIS[k][1], prox:NIVEIS[k+1]||null, base:NIVEIS[k][0] }; }

function medalhas(){
  const b = base(), s = b.filter(p => p.tipo === "sessao"), del = b.filter(p => p.quem);
  const qz = new Map(); b.filter(p => p.data).forEach(p => { const k = qzDe(p.data); (qz.get(k) || qz.set(k,[]).get(k)).push(p); });
  const qzLimpas = [...qz.values()].filter(l => l.every(p => p.feita)).length;
  const ms = new Map(); b.filter(p => p.data).forEach(p => { const k = p.data.slice(0,7); (ms.get(k) || ms.set(k,[]).get(k)).push(p); });
  const msZerados = [...ms.values()].filter(l => l.every(p => p.feita)).length;
  const pl = placar();
  return [
    { on: b.length > 0 && pl.perdidas === 0, t:"Nada perdido", s: pl.perdidas ? pl.perdidas+" com fatal vencido" : "nenhum fatal vencido", ic:"escudo" },
    { on: b.length > 0 && pl.atrasadas === 0, t:"Nada atrasado", s: pl.atrasadas ? pl.atrasadas+" fora do prazo interno" : "tudo dentro do interno", ic:"alvo" },
    { on: s.length > 0 && s.every(p => p.feita), t:"Pautas preparadas", s: s.filter(p=>p.feita).length+" de "+s.length, ic:"martelo" },
    { on: qzLimpas > 0, t:"Quinzena limpa", s: qzLimpas+" de "+qz.size, ic:"bandeira" },
    { on: msZerados > 0, t:"Mês zerado", s: msZerados+" de "+ms.size, ic:"calend" },
    { on: del.length >= 3, t:"Time em campo", s: del.length+" tarefas delegadas", ic:"pessoa" },
    { on: pl.pontos >= 250, t:"Maratonista", s: pl.pontos+" pontos", ic:"raio" },
    { on: E.recados.filter(r => !r.removido).length >= 5, t:"Time que conversa", s: E.recados.filter(r => !r.removido).length + " recados", ic:"pessoa" },
    { on: decisoes().length >= 3, t:"Histórico em pé", s: decisoes().length + " decisões registradas", ic:"martelo" },
    { on: b.length > 0 && pl.feitas === b.length, t:"Tudo em dia", s: pl.feitas+" de "+b.length, ic:"estrela" },
  ];
}

const cv = $("confete");
function festa(){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let ctx = null;
  try { ctx = cv.getContext("2d"); } catch(e){}
  if (!ctx) return;
  cv.width = innerWidth; cv.height = innerHeight; cv.style.display = "block";
  const ps = Array.from({length:130}, () => ({ x:innerWidth/2+(Math.random()-.5)*360, y:innerHeight*.3,
    vx:(Math.random()-.5)*12, vy:Math.random()*-14-4, s:4+Math.random()*7, r:Math.random()*6.3,
    vr:(Math.random()-.5)*.32, c:CORES[(Math.random()*CORES.length)|0], a:1 }));
  let t = 0;
  (function passo(){
    ctx.clearRect(0,0,cv.width,cv.height); let vivos = 0;
    ps.forEach(p => { p.vy += .4; p.x += p.vx; p.y += p.vy; p.r += p.vr; if (t > 45) p.a -= .025;
      if (p.a > 0 && p.y < cv.height+40){ vivos++; ctx.save(); ctx.globalAlpha = Math.max(p.a,0);
        ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); } });
    t++; if (vivos) requestAnimationFrame(passo); else { ctx.clearRect(0,0,cv.width,cv.height); cv.style.display = "none"; }
  })();
}

  const box = el("div", dentro ? "anel" : "mini");

  const s = sv("svg",{width:size,height:size,viewBox:`0 0 ${size} ${size}`});

  s.appendChild(sv("circle",{class:dentro?"fl":"fl2",cx:size/2,cy:size/2,r,stroke:cor,

}

  const m = $("modal"); m.innerHTML = "";

  const nota = el("textarea"); nota.rows = 2; nota.placeholder = "Observação (opcional)";
  if (existente && existente.nota) nota.value = existente.nota;
  const st = el("p","sb",""); st.style.margin = "0"; st.style.color = "var(--rosa)";
  const cps = [campo("O que precisa ser feito", tit),
    (() => { const d = el("div","dupla"); d.appendChild(campo("Prazo", prazo)); d.appendChild(campo("Processo", proc)); return d; })(),

  if (!pessoasVivas().length){
    const a = el("div","aviso az");
    a.appendChild(el("span","k","Dica"));
    a.appendChild(el("div",null,"Nenhuma pessoa cadastrada ainda. Cadastre a equipe na aba Equipe para poder delegar."));
    cps.splice(2,0,a);
  }
  modal(existente ? "Editar tarefa" : "Nova tarefa", "Tarefas criadas por você entram na agenda e no placar junto com o que vem do DJEN.",
    cps,
    () => {
      const t = tit.value.trim();
      if (!t){ st.textContent = "Escreva o que precisa ser feito."; return false; }
      if (existente){
        const mudouDono = existente.pessoaId !== (quem.value || null);
        Object.assign(existente, { titulo:t, prazo:prazo.value||null, processo:proc.value.trim()||null, pessoaId:quem.value||null, nota:nota.value.trim()||null });
        if (mudouDono && existente.pessoaId && !souEu(existente.pessoaId)){
          existente.delegadaPor = (E.time && E.time.pessoaId) || null;
          existente.delegadaPorNome = (euSou() || {}).nome || (E.time && E.time.meuNome) || null;
          existente.delegadaEm = agoraISO(); existente.vistaPor = [];
        }
        tocou(existente);
      }
      else {
        const nova = { id:uid(), titulo:t, prazo:prazo.value||null, processo:proc.value.trim()||null,
          pessoaId:quem.value||null, nota:nota.value.trim()||null, feita:false, criada:HOJE };
        /* Atribuir na criacao conta como delegar: sem isso a pessoa nunca recebe
           o aviso "passaram uma tarefa para voce", que e o caminho mais usado. */
        if (nova.pessoaId && !souEu(nova.pessoaId)){
          nova.delegadaPor = (E.time && E.time.pessoaId) || null;

          nova.delegadaEm = agoraISO(); nova.vistaPor = [];
        }
        tocou(nova); E.tarefas.push(nova);
      }
      salvar(); render(); return true;
    });

/* ===================== sincronizar ===================== */
async function sincronizar(quais){
  const alvos = quais || E.oabs;
  if (!alvos.length){ render(); return; }
  const m = $("modal"); m.innerHTML = "";
  m.appendChild(el("h3",null,"Consultando o DJEN"));
  const st = el("p","sb","Conectando…");
  m.appendChild(st);
  const ba = el("div","barra"); const bi = el("i"); bi.style.width = "4%"; ba.appendChild(bi); m.appendChild(ba);
  $("fundo").classList.add("on");

  let feitos = 0, erro = null;
  for (const o of alvos){
    st.textContent = `${o.nome} — OAB/${o.uf} ${o.numero}`;
    try { await buscarOab(o.uf, o.numero, o.nome, msg => { st.textContent = `${o.nome} — ${msg}`; }); }
    catch(e){ erro = e.message; break; }
    feitos++;
    bi.style.width = Math.round((feitos/alvos.length)*100) + "%";
    if (feitos < alvos.length) await new Promise(r => setTimeout(r, 1500));
  }
  E.buscadoEm = HOJE; salvar();

  if (erro){
    m.innerHTML = "";
    m.appendChild(el("h3",null,"Não deu para buscar"));
    m.appendChild(el("p","sb",erro));
    const ac = el("div","acoes"); ac.appendChild(botao("Entendi","check","pri",() => { fechar(); render(); })); m.appendChild(ac);
  } else { fechar(); render(); if (E.djen.length) festa(); }
}

/* ---------- desafio do dia ----------
   O desafio nasce do estado real: se há vencido, o desafio é zerar o vencido.
   Nunca inventa meta artificial nem premia por marcar coisa que não fez —
   num painel de prazo, jogo que estimula marcar por marcar é perigoso. */
function desafioDeHoje(){
  const b = base();
  const perdidas = b.filter(perdida);
  const semProv = provDjen().filter(p => !p.feita && !p.dispensada && !desdobramentos(p.bruto.id).length);
  const urgentes = b.filter(p => !p.feita && !p.dispensada && p.data && p.data >= HOJE && uteisEntre(HOJE, p.data) <= 5);
  const semDono = b.filter(p => !p.feita && !p.dispensada && !p.quem);
  const semData = b.filter(p => !p.feita && !p.dispensada && !p.data);

  if (perdidas.length) return {
    ico:"escudo", tit:"Resolver o que já venceu",
    txt: perdidas.length === 1 ? "Uma providência com prazo fatal vencido esperando decisão sua." : perdidas.length + " providências com prazo fatal vencido.",
    feito: 0, meta: perdidas.length, premio:"+" + (perdidas.length * 10) + " pts",
    acao:["Ver as vencidas", () => { aba = "todo"; filtro = "perdeu"; render(); }],
  };
  if (semProv.length) return {
    ico:"lista", tit:"Triar as notificações",
    txt: semProv.length + (semProv.length === 1 ? " intimação sem providência definida." : " intimações sem providência definida.") + " Dá para resolver em fila.",
    feito: provDjen().length - semProv.length, meta: provDjen().length, premio:"+" + (semProv.length * 5) + " pts",
    acao:["Abrir a fila", () => { aba = "notif"; filtroNotif = "pend"; notifSel = null; render(); }],
  };
  if (urgentes.length) return {
    ico:"raio", tit:"Adiantar o que vence esta semana",
    txt: urgentes.length + (urgentes.length === 1 ? " providência vence" : " providências vencem") + " em 5 dias úteis ou menos.",
    feito: 0, meta: urgentes.length, premio:"+" + (urgentes.length * 10) + " pts",
    acao:["Ver as urgentes", () => { aba = "todo"; filtro = "urgente"; render(); }],
  };
  if (semDono.length >= 3 && pessoasVivas().length) return {
    ico:"pessoa", tit:"Dar dono ao que está solto",
    txt: semDono.length + " providências sem responsável. Delegar é o que faz o time trabalhar junto.",
    feito: base().filter(p => p.quem).length, meta: base().length, premio:"medalha Time em campo",
    acao:["Ver as sem dono", () => { aba = "todo"; filtro = "minhas"; render(); }],
  };
  if (semData.length) return {
    ico:"calend", tit:"Definir as datas que faltam",
    txt: semData.length + (semData.length === 1 ? " providência sem prazo definido." : " providências sem prazo definido."),
    feito: base().filter(p => p.data).length, meta: base().length, premio:"+" + (semData.length * 5) + " pts",
    acao:["Ver sem data", () => { aba = "todo"; filtro = "aberto"; render(); }],
  };
  const pl = placar();
  if (pl.total && pl.feitas === pl.total) return {
    ico:"estrela", tit:"Mesa limpa",
    txt:"Nenhuma pendência conhecida. Aproveite — e quando a próxima publicação chegar, o painel avisa.",
    feito: pl.total, meta: pl.total, premio:"tudo em dia",
    acao:null,
  };
  return {
    ico:"alvo", tit:"Seguir em frente",
    txt: pl.abertas + (pl.abertas === 1 ? " providência em aberto, nenhuma urgente." : " providências em aberto, nenhuma urgente."),
    feito: pl.feitas, meta: pl.total || 1, premio:"+" + (pl.abertas * 5) + " pts",
    acao:["Ver a lista", () => { aba = "todo"; filtro = "aberto"; render(); }],
  };
}

const DIAS3 = ["dom","seg","ter","qua","qui","sex","sáb"];
let semanaOffset = 0;

function classeDe(p){
  const e = estadoDe(p);
  if (p.feita) return "ok";
  if (p.tipo === "sessao") return "s";
  if (e === "perdeu" || e === "fatalhoje" || e === "atrasado") return "x";
  if (e === "atencao" || e === "comecarhoje") return "u";
  return "";
}

function telaSemana(){
  const f = document.createDocumentFragment();
  const hoje = new Date(HOJE + "T00:00:00Z");
  const seg = new Date(hoje); seg.setUTCDate(seg.getUTCDate() - ((seg.getUTCDay() + 6) % 7) + semanaOffset * 7);
  const dias = Array.from({length:7}, (_,k) => { const d = new Date(seg); d.setUTCDate(d.getUTCDate() + k); return isoDe(d); });

  const nav = el("div","semnav");

  const itens = base().filter(p => p.data && !p.dispensada);

const qzDe = iso => iso.slice(0,7) + (+iso.slice(8,10) <= 15 ? "-Q1" : "-Q2");
function rotuloQz(k){
  const ano = k.slice(0,4), mes = +k.slice(5,7), q = k.slice(8);
  const ult = new Date(Date.UTC(+ano,mes,0)).getUTCDate(), mm = String(mes).padStart(2,"0");
  return { a: q === "Q1" ? "1ª quinzena" : "2ª quinzena", b: MESES[mes-1] + " de " + ano,
    c: q === "Q1" ? "01–15/"+mm : "16–"+ult+"/"+mm };
}

    : filtroAgenda === "eu" ? souEu(p.quem)
    : p.quem === filtroAgenda;
  const itens = vis().filter(p => p.data && dePessoa(p)).sort((a,b) => a.data.localeCompare(b.data));
  if (!itens.length){ f.appendChild(vazioBox("calend","Nada nesta seleção","Sem prazo, sessão ou tarefa com data para este filtro.", "Nova tarefa", () => dlgTarefa())); return f; }

  const gr = new Map();
  itens.forEach(p => { const k = qzDe(p.data); if(!gr.has(k)) gr.set(k,[]); gr.get(k).push(p); });
  [...gr.keys()].sort().forEach(k => {
    const lista = gr.get(k), r = rotuloQz(k);
    const nf = lista.filter(p => p.feita).length, limpa = nf === lista.length;
    const bl = el("div","qz");

    rail.appendChild(el("div","p", limpa ? "quinzena limpa" : nf + " de " + lista.length));
    const ba = el("div","barra"); const bi = el("i"); bi.style.width = (nf/lista.length*100)+"%"; ba.appendChild(bi);
    rail.appendChild(ba);
    bl.appendChild(rail);
    const box = el("div","qzi");
    let marcou = false;
    lista.forEach(p => {
      if (!marcou && p.data >= HOJE && k === qzDe(HOJE)){ const h = el("div","hj"); h.appendChild(el("span",null,"hoje · "+br(HOJE))); box.appendChild(h); marcou = true; }
      box.appendChild(cartao(p));
    });
    bl.appendChild(box);
    f.appendChild(bl);
  });
  return f;
}

function cartao(p){
  const b = p.bruto, ehSessao = p.tipo === "sessao";

  const faltam = (!p.data || p.data < HOJE) ? null : uteisEntre(HOJE, p.data);
  const c = el("div","card c-"+R.cor+(p.feita?" done":"")+(est==="perdeu"?" perdeu":"")+(p.dispensada?" dispensada":""));

  const fl = el("div","fl");

  else { fl.appendChild(el("div","m","sem")); fl.appendChild(el("div","d","·")); }

  const corpo = el("div");
  const ch = el("div","ch");

  else if (est === "atrasado") txt = "Atrasado · fatal em " + faltam + (faltam === 1 ? " dia útil" : " dias úteis");

/* ---------- aba Notificações: a intimação de um lado, o que fazer do outro ----------
   Só entram publicações das OABs cadastradas — é o radar do próprio escritório.
   O Acompanhamento Paralelo tem aba própria porque ali o escritório não é parte. */
/* ---------- aba Meus processos ----------
   Vira a chave: em vez de olhar publicação por publicação, olha PROCESSO por
   processo — juntando o que saiu no diário, as providências que nasceram dele
   e quem está com cada uma. É a visão que serve para responder "e o caso X,
   a quantas anda?" sem abrir cinco telas. */
/* Alguns tribunais preenchem o campo de parte com rótulo do próprio sistema.
   Isso não é nome de ninguém e polui a síntese que a pessoa vai compartilhar. */
const RX_LIXO = /^(usu[áa]rio do sistema|sistema|autor n[ãa]o informado|parte n[ãa]o informada|n[ãa]o informad|desconhecid|a apurar|em branco)/i;
const parteBoa = p => p && p.trim().length > 2 && !RX_LIXO.test(p.trim());

function agrupaProcessos(){
  const m = new Map();
  const põe = (num, f) => {
    if (!num) return;
    if (!m.has(num)) m.set(num, { proc:num, pubs:[], tarefas:[], partes:[], trib:null, classe:null, orgao:null, sigiloso:false });
    f(m.get(num));
  };
  E.djen.filter(i => !i.removido).forEach(i => põe(i.proc, g => {
    g.pubs.push(i);
    if (!g.trib) g.trib = i.trib;
    if (!g.classe) g.classe = i.classe;
    if (!g.orgao) g.orgao = i.orgao;
    if (i.sigiloso) g.sigiloso = true;
    (i.partes || []).filter(parteBoa).forEach(p => { if (!g.partes.includes(p)) g.partes.push(p); });
  }));
  E.tarefas.filter(t => !t.removido && t.processo).forEach(t => põe(t.processo, g => g.tarefas.push(t)));
  return [...m.values()].map(g => {
    const abertas = g.tarefas.filter(t => !t.feita && !t.dispensada);
    const comData = abertas.filter(t => t.prazo).sort((a,b) => a.prazo.localeCompare(b.prazo));
    const ultima = g.pubs.map(p => p.disp).sort().pop() || null;
    const donos = [...new Set(abertas.map(t => t.pessoaId).filter(Boolean))];
    const vencidas = abertas.filter(t => t.prazo && t.prazo < HOJE).length;
    return Object.assign(g, {
      abertas, proximo: comData[0] || null, ultima, donos, vencidas,
      feitas: g.tarefas.filter(t => t.feita).length,
      semProvidencia: g.pubs.filter(p => !desdobramentos(p.id).length && !p.dispensada && !p.feita).length,
    });
  }).sort((a,b) => {
    if (a.vencidas !== b.vencidas) return b.vencidas - a.vencidas;
    const pa = a.proximo ? a.proximo.prazo : "9", pb = b.proximo ? b.proximo.prazo : "9";
    if (pa !== pb) return pa.localeCompare(pb);
    return (b.ultima || "").localeCompare(a.ultima || "");
  });
}

function comoAnda(g){
  if (g.vencidas) return { txt: g.vencidas + (g.vencidas === 1 ? " providência vencida" : " providências vencidas"), cor: "x" };
  if (g.proximo){
    const f = uteisEntre(HOJE, g.proximo.prazo);
    if (g.proximo.prazo < HOJE) return { txt: "prazo vencido", cor: "x" };
    if (f === 0) return { txt: "vence hoje", cor: "x" };
    if (f <= 5) return { txt: "vence em " + f + (f === 1 ? " dia útil" : " dias úteis"), cor: "u" };
    return { txt: "próximo prazo em " + f + " dias úteis", cor: "" };
  }
  if (g.semProvidencia) return { txt: g.semProvidencia + (g.semProvidencia === 1 ? " publicação sem providência" : " publicações sem providência"), cor: "u" };
  if (g.abertas.length) return { txt: g.abertas.length + " em aberto, sem data", cor: "" };
  if (g.tarefas.length) return { txt: "tudo tratado", cor: "ok" };
  return { txt: "só acompanhamento", cor: "" };
}

/* Síntese em texto puro: serve para colar no WhatsApp, no e-mail ou no relatório. */
function sinteseTexto(g){
  const NL = String.fromCharCode(10);
  const L = [];
  L.push(g.sigiloso ? "PROCESSO EM SEGREDO DE JUSTIÇA" : (g.partes.slice(0,2).join(" x ") || "Partes não informadas"));
  L.push("Processo " + g.proc + (g.trib ? "  ·  " + g.trib : ""));
  if (g.orgao) L.push(g.orgao);
  if (g.classe) L.push("Classe: " + g.classe);
  L.push("");
  L.push("SITUACAO: " + comoAnda(g).txt);
  if (g.ultima) L.push("Ultima publicacao: " + br(g.ultima));
  L.push("Publicacoes no periodo: " + g.pubs.length);
  if (g.abertas.length){
    L.push("");
    L.push("EM ABERTO:");
    g.abertas.slice().sort((a,b) => (a.prazo || "9").localeCompare(b.prazo || "9")).forEach(t => {
      const q = t.pessoaId ? (pessoaDe(t.pessoaId) || {}).nome : null;
      L.push("  - " + t.titulo
        + (t.prazo ? "  (ate " + br(t.prazo) + (t.prazo < HOJE ? " - VENCIDO" : "") + ")" : "  (sem data)")
        + (q ? "  [" + q + "]" : ""));
    });
  }
  if (g.feitas) L.push(NL + "Ja concluidas: " + g.feitas);
  L.push("");
  L.push("---");
  L.push("Gerado pelo Painel de Prazos a partir do DJEN em " + br(HOJE) + ".");
  L.push("Datas sugeridas, sujeitas a conferencia nos autos.");
  return L.join(NL);
}

async function compartilhar(g){
  const txt = sinteseTexto(g);
  const titulo = (g.partes[0] || g.proc);
  try {
    if (navigator.share){ await navigator.share({ title: "Situação — " + titulo, text: txt }); return; }
  } catch(e){ if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(txt); avisar("Síntese copiada — cole onde quiser"); return; } catch(e){}
  const m = $("modal"); m.innerHTML = "";
  m.appendChild(el("h3", null, "Síntese do processo"));
  m.appendChild(el("p","sb","Selecione e copie."));
  const ta = el("textarea"); ta.rows = 16; ta.value = txt;
  ta.style.cssText = "font:400 12.5px/1.5 'IBM Plex Mono',monospace";
  m.appendChild(campo("Texto", ta));
  const ac = el("div","acoes"); ac.appendChild(botao("Fechar","check","pri", fechar)); m.appendChild(ac);
  $("fundo").classList.add("on");
  ta.select();
}

function dlgFinanceiro(g, dec){
  const dest = entrada("email", E.emailFinanceiro || "", "financeiro@escritorio.com.br");

/* ---------- Decisões ----------
   Histórico do que foi DECIDIDO, separado por tipo. Não é prazo nem tarefa:
   é memória do caso. O botão do financeiro sai daqui porque é na decisão que
   nasce o honorário — mas nenhum valor fica guardado no painel. */
function decisoes(){
  const das = E.djen.filter(i => !i.removido && (i.decisao || i.decisaoManual)).map(i => ({
    id: String(i.id), fonte: "djen", proc: i.proc, trib: i.trib, orgao: i.orgao,
    partes: i.partes || [], sigiloso: i.sigiloso, disp: i.disp, hash: i.hash, link: i.link,
    tipo: (i.decisaoManual || (i.decisao && i.decisao.tipo)),
    rotulo: i.decisaoManual ? (TIPOS_DECISAO.find(t => t.id === i.decisaoManual) || {}).rot : (i.decisao && i.decisao.rotulo),
    trecho: (i.decisao && i.decisao.trecho) || null,
    manual: !!i.decisaoManual,
  }));
  const doPar = E.paralelo.filter(i => !i.removido && achaDecisao(i.resumo || "")).map(i => {
    const dd = achaDecisao(i.resumo || "");
    return { id: "p" + i.id, fonte: "paralelo", proc: i.proc, trib: i.trib, orgao: i.orgao,
      partes: i.partes || [], sigiloso: i.sigiloso, disp: i.disp, hash: i.hash, link: i.link,
      tipo: dd.tipo, rotulo: dd.rotulo, trecho: dd.trecho, manual: false };
  });
  return das.concat(doPar).sort((a, b) => (b.disp || "").localeCompare(a.disp || ""));
}

function grupoDoProcesso(proc){
  return agrupaProcessos().find(g => g.proc === proc)
    || { proc, partes: [], trib: null, orgao: null, classe: null, sigiloso: false, ultima: null, abertas: [], feitas: 0, donos: [], pubs: [] };
}

/* ---------- recados dentro da tarefa ----------
   Coleção própria, um documento por mensagem. Não é array dentro da tarefa de
   propósito: com "último a escrever vence" por documento, duas pessoas
   respondendo ao mesmo tempo perderiam uma das mensagens. */
function recadosDe(tarefaId){
  return E.recados.filter(r => !r.removido && r.tarefaId === String(tarefaId))
    .sort((a, b) => (a.em || "").localeCompare(b.em || ""));
}
function naoLidos(tarefaId){
  const eu = E.time && E.time.pessoaId;
  if (!eu) return 0;
  return recadosDe(tarefaId).filter(r => r.autorId !== eu && !(r.lidoPor || []).includes(eu)).length;
}
function marcarRecadosLidos(tarefaId){
  const eu = E.time && E.time.pessoaId;
  if (!eu) return;
  let mexeu = false;
  recadosDe(tarefaId).forEach(r => {
    if (r.autorId !== eu && !(r.lidoPor || []).includes(eu)){
      r.lidoPor = [...new Set([...(r.lidoPor || []), eu])]; tocou(r); mexeu = true;
    }
  });
  if (mexeu) salvar();
}
function dlgRecados(p){
  const tid = String(p.bruto.id);
  marcarRecadosLidos(tid);
  const m = $("modal"); m.innerHTML = "";
  m.appendChild(el("h3", null, "Conversa sobre a tarefa"));
  m.appendChild(el("p","sb", p.titulo + (p.data ? " · até " + br(p.data) : "")));

  const fio = el("div","fio");
  const rec = recadosDe(tid);
  if (!rec.length) fio.appendChild(el("p","ps","Nenhum recado ainda. Escreva o primeiro."));
  rec.forEach(r => {
    const eu = souEu(r.autorId);
    const l = el("div","rec" + (eu ? " meu" : ""));
    const cab2 = el("div","rcab");
    const pe = pessoaDe(r.autorId);
    if (pe) cab2.appendChild(avatar(pe));
    cab2.appendChild(el("span","rq", r.autor || "alguém"));
    cab2.appendChild(el("span","rh", br(dataLocal(new Date(r.em))) + " " + horaLocal(r.em)));
    l.appendChild(cab2);
    l.appendChild(el("div","rtx", r.texto));
    fio.appendChild(l);
  });
  m.appendChild(fio);

  const ta = el("textarea"); ta.rows = 3; ta.placeholder = "Escrever um recado…";
  m.appendChild(campo("Novo recado", ta));
  const ac = el("div","acoes");
  ac.appendChild(botao("Fechar", null, "", () => { fechar(); render(); }));
  ac.appendChild(botao("Enviar","seta","pri", () => {
    const t = ta.value.trim();
    if (!t) return;
    const r = { id: uid(), tarefaId: tid, texto: t,
      autorId: (E.time && E.time.pessoaId) || null,
      autor: (euSou() || {}).nome || (E.time && E.time.meuNome) || "eu",
      em: agoraISO(), lidoPor: [] };
    tocou(r); E.recados.push(r); salvar();
    avisar("Recado enviado");
    dlgRecados(p);
  }));
  m.appendChild(ac);
  $("fundo").classList.add("on");
  ta.focus();
}

/* ---------- telas-widget ----------
   O iOS não deixa app web publicar widget de tela inicial — isso é WidgetKit,
   app nativo. O que dá para fazer, e é o mais próximo: três endereços que abrem
   direto numa tela única, de letra grande, sem abas. Cada um vira um ícone

};

}

/* ---- widget 1: calendário grande ---- */
function widgetAgenda(){
  const f = document.createDocumentFragment();
  const hoje = new Date(HOJE + "T00:00:00Z");
  const prim = new Date(Date.UTC(hoje.getUTCFullYear(), hoje.getUTCMonth() + widgetMes, 1));
  const ult = new Date(Date.UTC(prim.getUTCFullYear(), prim.getUTCMonth() + 1, 0));
  const itens = base().filter(p => p.data && !p.dispensada);

  const nav = el("div","wnav");
  nav.appendChild(botao("‹", null, "pq", () => { widgetMes--; render(); }));
  nav.appendChild(el("div","wmes", MESES[prim.getUTCMonth()] + " " + prim.getUTCFullYear()));
  nav.appendChild(botao("›", null, "pq", () => { widgetMes++; render(); }));
  if (widgetMes !== 0) nav.appendChild(botao("hoje", null, "pq", () => { widgetMes = 0; render(); }));
  f.appendChild(nav);

  const grade = el("div","wgrade");
  ["dom","seg","ter","qua","qui","sex","sáb"].forEach(d => grade.appendChild(el("div","wsem", d)));
  for (let k = 0; k < prim.getUTCDay(); k++) grade.appendChild(el("div","wvazio"));
  for (let dia = 1; dia <= ult.getUTCDate(); dia++){
    const iso = isoDe(new Date(Date.UTC(prim.getUTCFullYear(), prim.getUTCMonth(), dia)));
    const doDia = itens.filter(p => p.data === iso);
    const abertos = doDia.filter(p => !p.feita);
    const critico = abertos.some(p => ["perdeu","fatalhoje","atrasado"].includes(estadoDe(p)));
    const c = el("button","wdia" + (iso === HOJE ? " hoje" : "")
      + (abertos.length ? (critico ? " crit" : " tem") : "")
      + (doDia.length && !abertos.length ? " pronto" : ""));
    c.type = "button";
    c.appendChild(el("span","wn", String(dia)));
    if (doDia.length) c.appendChild(el("span","wq", String(doDia.length)));
    if (doDia.length) c.addEventListener("click", () => { widgetDia = widgetDia === iso ? null : iso; render(); });
    if (iso === widgetDia) c.classList.add("aberto");
    grade.appendChild(c);
  }
  f.appendChild(grade);

  const doDia = widgetDia ? itens.filter(p => p.data === widgetDia) : itens
    .filter(p => !p.feita && p.data >= HOJE).sort((a,b) => a.data.localeCompare(b.data)).slice(0, 6);
  const cx = el("div","wlista");
  cx.appendChild(el("div","wrot", widgetDia ? br(widgetDia) : "Próximos"));
  if (!doDia.length) cx.appendChild(el("p","ps", widgetDia ? "Nada neste dia." : "Nada com data pela frente."));
  doDia.forEach(p => {
    const l = el("div","witem" + (p.feita ? " feito" : ""));
    const cb = el("input"); cb.type = "checkbox"; cb.checked = !!p.feita;
    cb.addEventListener("change", () => alternar(p.key));
    l.appendChild(cb);
    const m = el("div");
    m.appendChild(el("div","wt", p.titulo));
    const sub = [br(p.data)];
    if (p.bruto.proc || p.bruto.processo) sub.push(p.bruto.proc || p.bruto.processo);
    if (p.quem) sub.push((pessoaDe(p.quem) || {}).nome);
    m.appendChild(el("div","ws", sub.join(" · ")));
    l.appendChild(m);
    cx.appendChild(l);
  });
  f.appendChild(cx);
  return f;
}

    l.appendChild(m);
    return l;
  });
  return f;

function telaProcessos(){

  d.appendChild(el("p", null, "Cada processo com o que saiu no diário, o que falta fazer e a quantas anda. A síntese sai pronta para colar."));

      "Assim que o painel buscar publicações nas OABs cadastradas, os processos aparecem aqui agrupados.",
      E.oabs.length ? null : "Cadastrar OAB", () => dlgOab()));
    return f;
  }

  const bu = entrada("search", buscaProc, "Buscar processo, parte, tribunal…");
  bu.style.cssText = "max-width:420px;margin-bottom:14px";
  bu.addEventListener("input", e => { buscaProc = e.target.value.trim(); render();
    const nn = document.querySelector("input[type=search]"); if (nn){ nn.focus(); nn.setSelectionRange(nn.value.length, nn.value.length); } });

  /* filtro por pessoa do time — "por nome", como você pediu */

    const cs = el("div","chips");
    const mk = (k, rot, q) => {
      const c = el("button","chip"); c.type = "button";
      c.setAttribute("aria-pressed", String(filtroProc === k));
      c.appendChild(el("span", null, rot)); c.appendChild(el("b", null, String(q)));
      c.addEventListener("click", () => { filtroProc = k; render(); });
      cs.appendChild(c);
    };
    const doDono = (g, id) => g.donos.includes(id);
    mk("todos", "Todo o time", todos.length);
    mk("sem", "Sem responsável", todos.filter(g => g.abertas.length && !g.donos.length).length);
    pessoasVivas().forEach(p => mk(p.id, p.nome.split(" ")[0], todos.filter(g => doDono(g, p.id)).length));
    f.appendChild(cs);
  }

  const filtra = g => {
    if (!combina(buscaProc, g.proc, g.trib, g.orgao, g.classe, g.partes.join(" "))) return false;
    if (filtroProc === "todos") return true;
    if (filtroProc === "sem") return g.abertas.length && !g.donos.length;

  };

  if (!lista.length){
    f.appendChild(vazioBox("lista","Nada nesta seleção","Nenhum processo bate com o filtro.", null));
    return f;
  }

  const box = el("div","procs");
  lista.slice(0, 80).forEach(g => {
    const st = comoAnda(g);
    const c = el("div","proc " + st.cor);

/* Painel da direita: o inteiro teor resumido e os botões de ação. */
/* Guarda quem vem depois na fila, para o painel não pular para o começo quando
   o item tratado sai do filtro "sem providência". */
function proximaNotificacao(idAtual){
  const fila = provDjen().filter(casa)
    .filter(x => !x.feita && !x.dispensada && !desdobramentos(x.bruto.id).length)
    .sort((a,b) => (b.bruto.disp || "").localeCompare(a.bruto.disp || ""));
  const i = fila.findIndex(x => String(x.bruto.id) === String(idAtual));
  const prox = i >= 0 ? (fila[i + 1] || fila[i - 1]) : fila[0];
  notifSel = prox ? String(prox.bruto.id) : null;
}

        feita: false, criada: HOJE, daIntimacao: String(b.id) };
      if (quem.value){

  }));
  ac.appendChild(botao("Dar baixa sem fazer nada","lixo","", () => dlgDispensar(p)));
  acao.appendChild(ac);
  lado.appendChild(acao);
  return lado;
}

  ta.style.cssText = "font:400 13px/1.5 'IBM Plex Mono',monospace";
  const st = el("p","sb",""); st.style.cssText = "margin:0;color:var(--azul);font-weight:600";

    const achou = lerListaProcessos(ta.value).length;
    st.textContent = achou ? achou + " processo(s) reconhecido(s)" : "";
  });
  modal("Importar a lista do Paralelo",
    "São os processos de terceiro que a equipe acompanha. O painel vai perguntar ao DJEN o que saiu em cada um — por número, porque nesses casos o escritório não é parte.",
    [campo("Lista", ta), st],
    () => {
      const novos = lerListaProcessos(ta.value);
      if (!novos.length){ st.style.color = "var(--rosa)"; st.textContent = "Não encontrei nenhum número de processo válido."; return false; }
      novos.forEach(p => {
        const ja = E.processos.find(x => x.numero === p.numero);
        if (ja){ if (p.rotulo && !ja.rotulo){ ja.rotulo = p.rotulo; tocou(ja); } }
        else { tocou(p); E.processos.push(p); }
      });
      salvar(); sincronizarTime(true); render(); return true;
    }, "Importar");
}

  const listaProc = E.processos.filter(p => !p.removido);

    f.appendChild(vazioBox("busca","Nenhum processo na lista",
      "Cole a lista dos processos acompanhados — pode ser o CSV do Escavador inteiro. O painel acha os números sozinho.",
      "Importar lista", () => dlgImportarProcessos()));
    return f;
  }

  const itens = E.paralelo.filter(i => !i.removido && casaParalelo(i));
  const resumo = el("div","aviso az");
  resumo.appendChild(el("span","k","Situação"));
  resumo.appendChild(el("div", null, listaProc.length + " processos acompanhados · " + itens.length + " publicações encontradas"
    + (E.paraleloEm ? " · última varredura em " + br(dataLocal(new Date(E.paraleloEm))) + " às " + horaLocal(E.paraleloEm) : " · nunca varrido")));
  f.appendChild(resumo);

  const bu = entrada("search", buscaPar, "Buscar por parte, processo, tribunal ou rótulo…");
  bu.style.cssText = "max-width:430px;margin-bottom:16px";
  bu.addEventListener("input", e => { buscaPar = e.target.value.trim(); render();
    const nn = document.querySelector("input[type=search]"); if (nn){ nn.focus(); nn.setSelectionRange(nn.value.length, nn.value.length); } });

  if (!itens.length){
    f.appendChild(vazioBox("busca", E.paraleloEm ? "Nada nesta busca" : "Ainda não varrido",

  const porProc = new Map();

function mandarEmail(pessoa, lista){
  const abertas = lista.filter(x => !x.feita && !x.dispensada);
  const NL = String.fromCharCode(10);
  const reg = "=".repeat(52);
  const ordem = { perdeu:0, fatalhoje:1, atrasado:2, comecarhoje:3, atencao:4, emdia:5, sessao:6, semdata:7 };
  const ord = abertas.slice().sort((a,b) => {
    const da = ordem[estadoDe(a)] ?? 9, db = ordem[estadoDe(b)] ?? 9;
    return da !== db ? da - db : (a.data || "9").localeCompare(b.data || "9");
  });
  const bloco = (rot, filtro) => {
    const its = ord.filter(filtro);
    if (!its.length) return [];
    const L = ["", rot, "-".repeat(rot.length)];
    its.forEach(x => {
      const proc = x.bruto.proc || x.bruto.processo;
      L.push("");
      L.push("  " + x.titulo);
      if (x.data){
        const f = x.data >= HOJE ? uteisEntre(HOJE, x.data) : null;
        L.push("    PRAZO FATAL: " + br(x.data)
          + (f === null ? "  (JA VENCEU)" : f === 0 ? "  (E HOJE)" : "  (faltam " + f + " dias uteis)"));
        if (x.tipo !== "sessao") L.push("    comecar ate: " + br(internoDe(x.data)));
      } else L.push("    sem data definida - precisa definir");
      if (proc) L.push("    processo " + proc + (x.bruto.trib ? "  " + x.bruto.trib : ""));
      if (x.bruto.nota) L.push("    " + x.bruto.nota);
    });
    return L;
  };
  const perdidas = ord.filter(x => estadoDe(x) === "perdeu").length;
  const urgentes = ord.filter(x => ["fatalhoje","atrasado","comecarhoje"].includes(estadoDe(x))).length;
  const corpo = [
    reg,
    "  SUAS TAREFAS - " + abertas.length + " em aberto",
    reg,
    "",
    "Oi, " + pessoa.nome.split(" ")[0] + "!",
  ]
  .concat(perdidas ? ["", ">>> ATENCAO: " + perdidas + " com prazo fatal JA VENCIDO <<<"] : [])
  .concat(urgentes ? ["", ">>> " + urgentes + " precisam de acao HOJE ou ja estao atrasadas <<<"] : [])
  .concat(bloco("VENCIDAS - conferir nos autos com urgencia", x => estadoDe(x) === "perdeu"))
  .concat(bloco("PARA HOJE / ATRASADAS", x => ["fatalhoje","atrasado","comecarhoje"].includes(estadoDe(x))))
  .concat(bloco("PROXIMAS", x => ["atencao","emdia"].includes(estadoDe(x))))
  .concat(bloco("SESSOES DE JULGAMENTO", x => x.tipo === "sessao"))
  .concat(bloco("SEM DATA - precisa definir", x => !x.data))
  .concat([
    "", reg,
    "Datas sugeridas a partir do Diario de Justica Eletronico Nacional,",
    "contadas em dias uteis com feriados nacionais apenas.",
    "NAO substitui o controle de prazos do escritorio - confira nos autos.",
    "",
    "Para por na agenda, peca o arquivo .ics (botao Calendario dela, no painel).",
    reg,
  ]).join(NL);
  const assunto = (perdidas ? "[VENCIDO] " : urgentes ? "[URGENTE] " : "")
    + "Suas tarefas - " + abertas.length + " em aberto"
    + (perdidas ? ", " + perdidas + " vencida(s)" : "");
  const url = "mailto:" + encodeURIComponent(pessoa.email)
    + "?subject=" + encodeURIComponent(assunto)
    + "&body=" + encodeURIComponent(corpo);
  try { window.open(url, "_blank"); } catch(e){ location.href = url; }
}

/* ---------- ajustes ---------- */
/* No iOS, "Adicionar à Tela de Início" só existe no Safari de verdade — dentro
   do navegador embutido do WhatsApp, Teams ou Gmail a opção simplesmente não
   aparece, e é o motivo mais comum de "não consigo instalar". */
function ehIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}
function ehSafariDeVerdade(){
  const ua = navigator.userAgent;
  return /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|FBAN|FBAV|Instagram|Line|Twitter/.test(ua);
}
function jaInstalado(){
  return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
}
function ajudaIPhone(){
  if (!ehIOS() || jaInstalado()) return null;
  const c = el("div","aviso az");
  c.appendChild(el("span","k","iPhone"));

    d.appendChild(el("b", null, "Você não está no Safari."));
    d.appendChild(el("div", null, "A opção “Adicionar à Tela de Início” só existe no Safari. Dentro do navegador embutido do WhatsApp, Teams ou Gmail ela nem aparece — é a causa mais comum. Toque no menu do canto e escolha “Abrir no Safari”, ou copie o endereço e cole no Safari."));
  } else {
    d.appendChild(el("b", null, "Para instalar como aplicativo:"));
    const ol = el("ol"); ol.style.cssText = "margin:8px 0 0;padding-left:20px;line-height:1.7";
    ["Toque no botão Compartilhar — o quadrado com a seta para cima, na barra de baixo.",

     "Toque em “Adicionar à Tela de Início”."].forEach(t => ol.appendChild(el("li", null, t)));

  }
  c.appendChild(d);
  return c;
}

      + HORAS_ENTRE_BUSCAS + " horas, por quem abrir o painel primeiro — os outros só recebem o resultado, sem repetir a consulta ao CNJ."));
    f.appendChild(av);
  }
  const t = el("table","tab");
  const hd = el("tr"); ["Advogado","Inscrição","Publicações",""].forEach(h => hd.appendChild(el("th",null,h)));
  t.appendChild(el("thead")).appendChild(hd);
  const tb = el("tbody");
  if (!E.oabs.filter(o => !o.removido).length){
    const tr = el("tr"); const td = el("td",null,"Nenhuma OAB cadastrada. As publicações carregadas como exemplo continuam valendo.");
    td.colSpan = 4; td.style.color = "var(--muted)"; tr.appendChild(td); tb.appendChild(tr);
  }
  E.oabs.filter(o => !o.removido).forEach(o => {
    const rot = o.nome;
    const n = E.djen.filter(x => x.advs.includes(rot)).length;
    const tr = el("tr");
    tr.appendChild(el("td",null,o.nome));
    tr.appendChild(el("td","mono","OAB/"+o.uf+" "+o.numero));
    tr.appendChild(el("td","mono",String(n)));
    const td = el("td");
    td.appendChild(botao("Remover","lixo","pq", () => {
      if (confirm("Remover OAB/"+o.uf+" "+o.numero+"? As publicações já baixadas continuam no painel.")){
        o.removido = true; tocou(o); salvar(); render();
      }
    }));
    tr.appendChild(td);
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  const wrap = el("div"); wrap.style.cssText = "background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:18px 20px;overflow-x:auto";
  wrap.appendChild(t);
  f.appendChild(wrap);

  f.appendChild(secaoWidgets());
  f.appendChild(secaoTime());

  /* janela + ações */
  const cab2 = el("div","cab"); const d2 = el("div");
  d2.appendChild(el("h2",null,"Dados"));
  d2.appendChild(el("p",null,"Tudo fica só neste navegador. Exporte para levar para outra máquina ou passar para alguém."));
  cab2.appendChild(d2); f.appendChild(cab2);

  const dupla = el("div","dupla"); dupla.style.maxWidth = "470px";
  const jan = el("select");
  [30,60,90,120].forEach(n => jan.appendChild(new Option(n + " dias", n)));
  jan.value = String(E.janelaDias);
  jan.addEventListener("change", () => { E.janelaDias = +jan.value; salvar(); });
  dupla.appendChild(campo("Janela de busca", jan));
  const ant = el("select");
  [1,2,3,5,7,10].forEach(n => ant.appendChild(new Option(n + (n === 1 ? " dia útil antes" : " dias úteis antes"), n)));
  ant.value = String(E.antecedencia);
  ant.addEventListener("change", () => { E.antecedencia = +ant.value; salvar(); render(); });
  dupla.appendChild(campo("Antecedência do prazo interno", ant));
  f.appendChild(dupla);
  const expl = el("p","ps","O prazo interno é o fatal menos essa antecedência, em dias úteis. É a data que vira alerta no calendário e o que marca a tarefa como atrasada antes de virar PERDEU.");
  expl.style.marginTop = "10px"; f.appendChild(expl);

  const cabCal = el("div","cab"); const dcal = el("div");
  dcal.appendChild(el("h2",null,"Calendário"));
  dcal.appendChild(el("p",null,"Gere um arquivo .ics com todos os prazos em aberto e importe no Google Agenda, Outlook ou Apple. Cada evento leva dois alertas: um na antecedência escolhida e outro na véspera do fatal."));
  cabCal.appendChild(dcal); f.appendChild(cabCal);
  const acCal = el("div"); acCal.style.cssText = "display:flex;gap:10px;flex-wrap:wrap";
  acCal.appendChild(botao("Baixar .ics de tudo em aberto","calend","pri", () => baixarIcs(base().filter(x => !x.feita), "tudo")));
  acCal.appendChild(botao("Só os meus (sem responsável)","calend","", () => baixarIcs(base().filter(x => !x.feita && !x.quem), "meus")));
  f.appendChild(acCal);
  const comoCal = el("p","ps","No Google Agenda: engrenagem → Importar e exportar → Importar → escolha o arquivo. Importar de novo depois atualiza os mesmos eventos, porque cada um tem identificador fixo.");
  comoCal.style.marginTop = "12px"; f.appendChild(comoCal);

  const ac = el("div"); ac.style.cssText = "display:flex;gap:10px;flex-wrap:wrap;margin-top:18px";
  ac.appendChild(botao("Atualizar publicações","troca","pri", () => sincronizar()));
  ac.appendChild(botao("Exportar dados","baixar","", exportar));
  ac.appendChild(botao("Importar dados","seta","", importar));
  if (promptInstalar){
    ac.appendChild(botao("Instalar como aplicativo","baixar","pri", async () => {
      promptInstalar.prompt(); await promptInstalar.userChoice; promptInstalar = null; render();
    }));
  }
  ac.appendChild(botao("Apagar tudo","lixo","", () => {
    if (confirm("Apagar OABs, equipe, tarefas e marcações deste navegador? Não dá para desfazer.")){
      E = vazio(); salvar(); aba = "painel"; render();
    }
  }));
  f.appendChild(ac);
  if (E.buscadoEm){ const s = el("p","ps","Última busca no DJEN: " + br(E.buscadoEm)); s.style.marginTop = "14px"; f.appendChild(s); }
  return f;
}

async function exportar(){
  await salvarArquivo("painel-prazos-" + HOJE + ".json", JSON.stringify(E, null, 2), "application/json");
}
function importar(){
  const i = el("input"); i.type = "file"; i.accept = "application/json";
  i.addEventListener("change", () => {
    const f = i.files && i.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || typeof d !== "object" || !("versao" in d)) throw new Error();
        E = Object.assign(vazio(), d); salvar(); render(); festa();
      } catch(e){ alert("Esse arquivo não é um backup do painel."); }
    };
    r.readAsText(f);
  });
  i.click();
}

addEventListener("beforeinstallprompt", e => { e.preventDefault(); promptInstalar = e; if (aba === "config") render(); });

setTimeout(() => { testarBusca().then(ok => { if (ok) buscaAutomatica(); }); }, 4000);
testarBusca().then(ok => {
