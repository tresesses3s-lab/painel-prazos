<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E5BD8">
<meta name="description" content="Agenda de prazos, tarefas e delegação a partir do Diário de Justiça Eletrônico Nacional.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icone.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prazos">
<link rel="apple-touch-icon" href="./icone.svg">
<title>Painel de Prazos</title>
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F6F8FC; --surface:#FFFFFF; --surf-2:#EFF3FA; --surf-3:#E3EAF6;
  --ink:#141A26; --ink-2:#3A465C; --muted:#6E7B92; --line:#DFE6F1; --line-2:#C6D2E6;
  --azul:#2E5BD8; --azul-s:#E4EBFC;
  --verde:#0E9F63; --verde-s:#DFF5EB;
  --ambar:#DE8A08; --ambar-s:#FDF0DC;
  --rosa:#DB2F4C; --rosa-s:#FCE4E8;
  --violeta:#7A45D6; --violeta-s:#EFE7FC;
  --teal:#0C9AA0; --teal-s:#DDF3F4;
  --ouro:#E0A008; --ouro-s:#FDF3D8;
  --on-cor:#FFFFFF;
  --sh-s:0 1px 2px rgba(24,40,80,.06);
  --sh-m:0 2px 5px rgba(24,40,80,.06), 0 10px 24px -14px rgba(24,40,80,.28);
  --sh-l:0 4px 8px rgba(24,40,80,.07), 0 24px 48px -22px rgba(24,40,80,.34);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1219; --surface:#171D28; --surf-2:#1F2734; --surf-3:#2A3342;
  --ink:#E9EEF7; --ink-2:#C3CDDD; --muted:#8593A9; --line:#252E3C; --line-2:#36415320;
  --azul:#6D93F5; --azul-s:#18233C;
  --verde:#3FC98C; --verde-s:#0F2A20;
  --ambar:#F0AE3F; --ambar-s:#2E2413;
  --rosa:#F4677F; --rosa-s:#2F1720;
  --violeta:#A981F0; --violeta-s:#241A38;
  --teal:#3FC3C8; --teal-s:#0D2A2C;
  --ouro:#F0C044; --ouro-s:#2E2612;
  --on-cor:#0E1219;
  --sh-s:0 1px 2px rgba(0,0,0,.5);
  --sh-m:0 2px 5px rgba(0,0,0,.45), 0 10px 24px -14px rgba(0,0,0,.8);
  --sh-l:0 4px 8px rgba(0,0,0,.5), 0 24px 48px -22px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --ground:#0E1219; --surface:#171D28; --surf-2:#1F2734; --surf-3:#2A3342;
  --ink:#E9EEF7; --ink-2:#C3CDDD; --muted:#8593A9; --line:#252E3C; --line-2:#364153;
  --azul:#6D93F5; --azul-s:#18233C;
  --verde:#3FC98C; --verde-s:#0F2A20;
  --ambar:#F0AE3F; --ambar-s:#2E2413;
  --rosa:#F4677F; --rosa-s:#2F1720;
  --violeta:#A981F0; --violeta-s:#241A38;
  --teal:#3FC3C8; --teal-s:#0D2A2C;
  --ouro:#F0C044; --ouro-s:#2E2612;
  --on-cor:#0E1219;
  --sh-s:0 1px 2px rgba(0,0,0,.5);
  --sh-m:0 2px 5px rgba(0,0,0,.45), 0 10px 24px -14px rgba(0,0,0,.8);
  --sh-l:0 4px 8px rgba(0,0,0,.5), 0 24px 48px -22px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink); font:400 16px/1.6 "Source Sans 3",-apple-system,Segoe UI,sans-serif; -webkit-font-smoothing:antialiased}
.wrap{max-width:1200px; margin:0 auto; padding:0 24px 110px}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque","Source Sans 3",sans-serif}
button{font-family:inherit}
#confete{position:fixed; inset:0; pointer-events:none; z-index:200; display:none}

/* ---------- barra de topo ---------- */
.topo{background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:50}
.topo-in{max-width:1200px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.marca{display:flex; align-items:center; gap:11px; margin-right:auto}
.logo{width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--azul),var(--violeta)); display:grid; place-items:center; flex:none}
.logo svg{width:19px; height:19px; stroke:var(--on-cor); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.marca b{font:700 18px/1 "Bricolage Grotesque",sans-serif; letter-spacing:-.02em}
.marca span{display:block; font:500 11px/1.4 "IBM Plex Mono",monospace; color:var(--muted); margin-top:3px}
.abas{display:flex; gap:4px; background:var(--surf-2); padding:4px; border-radius:12px; flex-wrap:wrap}
.aba{border:0; background:transparent; color:var(--ink-2); font:600 13.5px/1 "Source Sans 3",sans-serif; padding:9px 15px; border-radius:9px; cursor:pointer; display:flex; align-items:center; gap:7px}
.aba:hover{color:var(--azul)}
.aba[aria-selected="true"]{background:var(--surface); color:var(--azul); box-shadow:var(--sh-s)}
.aba .n{font:700 10.5px/1 "IBM Plex Mono",monospace; background:var(--azul); color:var(--on-cor); padding:3px 6px; border-radius:20px; min-width:18px; text-align:center}
.aba .n.zero{background:var(--surf-3); color:var(--muted)}
.aba:focus-visible,.bt:focus-visible,.chip:focus-visible{outline:2px solid var(--azul); outline-offset:2px}

/* ---------- botões e campos ---------- */
.bt{border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2); font:600 13.5px/1 "Source Sans 3",sans-serif; padding:10px 15px; border-radius:10px; cursor:pointer; display:inline-flex; align-items:center; gap:8px}
.bt:hover{border-color:var(--azul); color:var(--azul)}
.bt svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
.bt.pri{background:var(--azul); border-color:var(--azul); color:var(--on-cor)}
.bt.pri:hover{filter:brightness(1.08); color:var(--on-cor)}
.bt.ok{background:var(--verde); border-color:var(--verde); color:var(--on-cor)}
.bt.ok:hover{color:var(--on-cor); filter:brightness(1.08)}
.bt.pq{padding:7px 11px; font-size:12.5px; border-radius:8px}
.bt[disabled]{opacity:.45; cursor:not-allowed}
input,select,textarea{font:400 15px/1.35 "Source Sans 3",sans-serif; color:var(--ink); background:var(--surface); border:1px solid var(--line-2); border-radius:10px; padding:11px 13px; width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--azul); outline-offset:1px}
label.cmp{display:block}
label.cmp>span{display:block; font:700 10.5px/1 "IBM Plex Mono",monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:7px}
.linha{display:flex; gap:11px; flex-wrap:wrap; align-items:flex-end}

/* ---------- cabeçalho de seção ---------- */
.cab{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin:34px 0 20px}
h2{font:700 27px/1.15 "Bricolage Grotesque",sans-serif; margin:0; letter-spacing:-.02em}
.cab p{margin:7px 0 0; color:var(--muted); font-size:14.5px; max-width:62ch}

/* ---------- placar ---------- */
.placar{display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:14px; margin-top:26px}
.pc{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px 22px; box-shadow:var(--sh-m); display:flex; flex-direction:column; gap:14px}
.pc.destaque{background:linear-gradient(140deg,var(--azul),var(--violeta)); border-color:transparent; color:var(--on-cor)}
.pc.destaque .pt,.pc.destaque .ps{color:var(--on-cor); opacity:.82}
.pt{font:700 10.5px/1 "IBM Plex Mono",monospace; letter-spacing:.13em; text-transform:uppercase; color:var(--muted)}
.pbig{font:700 42px/1 "IBM Plex Mono",monospace; letter-spacing:-.045em; font-variant-numeric:tabular-nums}
.ps{font-size:13.5px; color:var(--muted); line-height:1.45}
.prox{display:flex; gap:16px; align-items:center}
.proxd{flex:none; min-width:88px; text-align:center; padding:13px 10px; border-radius:14px; background:rgba(255,255,255,.17)}
.proxd b{display:block; font:700 38px/1 "IBM Plex Mono",monospace; letter-spacing:-.05em; font-variant-numeric:tabular-nums}
.proxd.txt b{font-size:23px; line-height:1.35}
.proxd span{display:block; font:600 10px/1.35 "IBM Plex Mono",monospace; text-transform:uppercase; letter-spacing:.08em; margin-top:7px; opacity:.85}
.barra{height:9px; border-radius:99px; background:var(--surf-3); overflow:hidden}
.barra i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--verde),var(--teal)); transition:width .7s cubic-bezier(.4,0,.2,1)}
.pc.destaque .barra{background:rgba(255,255,255,.22)}
.pc.destaque .barra i{background:var(--on-cor)}
.anel{position:relative; width:84px; height:84px; flex:none}
.anel svg{transform:rotate(-90deg); display:block}
.anel .tk{fill:none; stroke:var(--surf-3); stroke-width:9}
.anel .fl{fill:none; stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1)}
.anel .mid{position:absolute; inset:0; display:grid; place-content:center; text-align:center}
.anel .mid b{font:700 21px/1 "IBM Plex Mono",monospace; letter-spacing:-.04em}
.anelrow{display:flex; align-items:center; gap:16px}

/* ---------- medalhas ---------- */
.medalhas{display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:11px; margin-top:16px}
.med{display:flex; gap:12px; align-items:center; padding:13px 15px; border-radius:14px; border:1px solid var(--line); background:var(--surface); box-shadow:var(--sh-s); opacity:.55; transition:.3s}
.med.on{opacity:1; box-shadow:var(--sh-m)}
.med.on.nova{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.82)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
.med .ic{width:38px; height:38px; border-radius:12px; flex:none; display:grid; place-items:center; background:var(--surf-3)}
.med .ic svg{width:19px; height:19px; stroke:var(--muted); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.med.on .ic{background:var(--ouro-s)} .med.on .ic svg{stroke:var(--ouro)}
.med b{display:block; font:600 14px/1.25 "Source Sans 3",sans-serif}
.med span{display:block; font:500 11.5px/1.35 "IBM Plex Mono",monospace; color:var(--muted); margin-top:3px}

/* ---------- filtros ---------- */
.chips{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 22px}
.chip{border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2); font:600 13px/1 "Source Sans 3",sans-serif; padding:9px 14px; border-radius:99px; cursor:pointer; display:flex; align-items:center; gap:8px}
.chip:hover{border-color:var(--azul)}
.chip b{font:700 11px/1 "IBM Plex Mono",monospace; opacity:.65}
.chip[aria-pressed="true"]{background:var(--azul); border-color:var(--azul); color:var(--on-cor)}
.chip.perigo[aria-pressed="true"]{background:var(--rosa); border-color:var(--rosa)}
.chip.ok[aria-pressed="true"]{background:var(--verde); border-color:var(--verde)}

/* ---------- quinzena ---------- */
.qz{display:grid; grid-template-columns:184px 1fr; gap:24px; align-items:start}
.qzr{position:sticky; top:88px; padding:14px 0 26px}
.qzr .a{font:700 10.5px/1 "IBM Plex Mono",monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--azul)}
.qzr .b{font:700 19px/1.2 "Bricolage Grotesque",sans-serif; margin-top:7px; letter-spacing:-.015em}
.qzr .c{font:500 12.5px/1.4 "IBM Plex Mono",monospace; color:var(--muted); margin-top:4px}
.qzr .p{font:600 11.5px/1 "IBM Plex Mono",monospace; color:var(--muted); margin:12px 0 7px}
.qzr.limpa .p{color:var(--verde)}
.qzi{display:flex; flex-direction:column; gap:10px; padding:14px 0 26px; border-bottom:1px solid var(--line)}
.qz:last-child .qzi{border-bottom:0}
.hj{display:flex; align-items:center; gap:11px}
.hj::before,.hj::after{content:""; height:2px; background:var(--rosa); flex:1; opacity:.35; border-radius:2px}
.hj span{font:700 10px/1 "IBM Plex Mono",monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--rosa)}

/* ---------- cartão ---------- */
.card{display:grid; grid-template-columns:58px 1fr; gap:16px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:15px 17px 15px 15px; box-shadow:var(--sh-s); transition:.2s}
.card:hover{box-shadow:var(--sh-m); transform:translateY(-1px)}
.card.done{opacity:.5}
.fl{border-radius:11px; overflow:hidden; text-align:center; align-self:start; border:1px solid var(--line)}
.fl .m{font:700 9.5px/1 "IBM Plex Mono",monospace; letter-spacing:.1em; text-transform:uppercase; padding:6px 0; color:var(--on-cor); background:var(--muted)}
.fl .d{font:700 23px/1 "IBM Plex Mono",monospace; padding:8px 0 9px; background:var(--surf-2); font-variant-numeric:tabular-nums}
.card.c-azul .fl .m{background:var(--azul)} .card.c-azul .fl .d{color:var(--azul)}
.card.c-ambar .fl .m{background:var(--ambar)} .card.c-ambar .fl .d{color:var(--ambar)}
.card.c-rosa .fl .m{background:var(--rosa)} .card.c-rosa .fl .d{color:var(--rosa)}
.card.c-violeta .fl .m{background:var(--violeta)} .card.c-violeta .fl .d{color:var(--violeta)}
.card.c-cinza .fl .m{background:var(--muted)} .card.c-cinza .fl .d{color:var(--muted)}
.ch{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:7px}
.tag{font:700 10px/1 "IBM Plex Mono",monospace; letter-spacing:.08em; text-transform:uppercase; padding:5px 9px; border-radius:6px; background:var(--surf-2); color:var(--muted); white-space:nowrap}
.tag.t-azul{background:var(--azul-s); color:var(--azul)}
.tag.t-ambar{background:var(--ambar-s); color:var(--ambar)}
.tag.t-rosa{background:var(--rosa-s); color:var(--rosa)}
.tag.t-violeta{background:var(--violeta-s); color:var(--violeta)}
.tag.t-verde{background:var(--verde-s); color:var(--verde)}
.tag.t-teal{background:var(--teal-s); color:var(--teal)}
.pts{font:700 11px/1 "IBM Plex Mono",monospace; color:var(--ouro); margin-left:auto}
.ct{font:600 16px/1.38 "Source Sans 3",sans-serif; margin:0 0 6px}
.cm{font:400 12.5px/1.55 "IBM Plex Mono",monospace; color:var(--muted); display:flex; flex-wrap:wrap; gap:1px 13px}
.cm .pr{color:var(--ink-2); font-weight:500}
.cw{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:12.8px; color:var(--muted); line-height:1.6}
.cw code{font:500 12px/1 "IBM Plex Mono",monospace; color:var(--ink-2); background:var(--surf-2); padding:2px 6px; border-radius:5px}
.cr{display:flex; gap:8px 14px; margin-top:11px; flex-wrap:wrap; align-items:center}
.cr a{font:600 12.5px/1 "Source Sans 3",sans-serif; color:var(--azul); text-decoration:none; border-bottom:1px solid var(--line-2); padding-bottom:2px}
.cr a:hover{border-bottom-color:var(--azul)}
.cr .dir{margin-left:auto; display:flex; gap:8px}


/* semana */
.semana{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:14px}
.dia{background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:11px 10px 12px; min-height:112px; display:flex; flex-direction:column; gap:7px; transition:.15s}
.dia.hoje{border-color:var(--azul); border-width:2px; box-shadow:0 0 0 3px var(--azul-s)}
.dia.fds{background:var(--surf-2); opacity:.72}
.dia.cheio{cursor:pointer}
.dia.cheio:hover{border-color:var(--azul); transform:translateY(-2px)}
.dia .dn{font:700 10px/1 "IBM Plex Mono",monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.dia.hoje .dn{color:var(--azul)}
.dia .dd{font:700 24px/1 "IBM Plex Mono",monospace; letter-spacing:-.04em; color:var(--ink-2)}
.dia.hoje .dd{color:var(--azul)}
.dia .pts2{display:flex; flex-wrap:wrap; gap:4px; margin-top:auto}
.pt2{width:100%; font:600 10.5px/1.3 "IBM Plex Mono",monospace; padding:4px 6px; border-radius:5px; background:var(--azul-s); color:var(--azul); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pt2.u{background:var(--ambar-s); color:var(--ambar)}
.pt2.x{background:var(--rosa-s); color:var(--rosa)}
.pt2.s{background:var(--violeta-s); color:var(--violeta)}
.pt2.ok{background:var(--verde-s); color:var(--verde); text-decoration:line-through}
.semnav{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap}
.semnav .rot{font:700 17px/1.2 "Bricolage Grotesque",sans-serif}
/* lista curta de providencias */
.curta{display:flex; flex-direction:column; gap:7px}
.lin{display:grid; grid-template-columns:auto 62px 1fr auto; gap:13px; align-items:center; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--azul); border-radius:11px; padding:11px 14px; transition:.15s}
.lin:hover{box-shadow:var(--sh-m)}
.lin.u{border-left-color:var(--ambar)} .lin.x{border-left-color:var(--rosa)} .lin.s{border-left-color:var(--violeta)}
.lin input{width:18px;height:18px;accent-color:var(--verde);cursor:pointer}
.lin .qd{font:700 12.5px/1.2 "IBM Plex Mono",monospace; text-align:center}
.lin.u .qd{color:var(--ambar)} .lin.x .qd{color:var(--rosa)} .lin.s .qd{color:var(--violeta)} .lin .qd{color:var(--azul)}
.lin .tt2{font-size:15px; font-weight:600; line-height:1.3}
.lin .sb2{font:400 12px/1.4 "IBM Plex Mono",monospace; color:var(--muted); margin-top:3px}
@media (max-width:760px){ .semana{grid-template-columns:repeat(4,1fr)} .lin{grid-template-columns:auto 1fr; gap:9px} .lin .qd{text-align:left} }
.aviso-flut{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:150; background:var(--verde); color:var(--on-cor); padding:13px 20px; border-radius:12px; box-shadow:var(--sh-l); font:600 14.5px/1.35 "Source Sans 3",sans-serif; display:flex; align-items:center; gap:11px; max-width:min(92vw,540px); animation:sobe .3s ease-out}
@keyframes sobe{from{opacity:0; transform:translate(-50%,14px)}to{opacity:1; transform:translate(-50%,0)}}
.aviso-flut svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* decisões */
/* telas-widget: letra grande, alvo de toque grande, nada de aba */
body.modo-widget .topo{display:none}
body.modo-widget .wrap{padding:0 16px 60px; max-width:640px}
.wcab{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; padding:18px 0 14px}
.wtit{display:flex; align-items:center; gap:12px}
.wico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none}
.wico svg{width:23px;height:23px;stroke:var(--on-cor);fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.wtit b{display:block;font:800 25px/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.025em}
.wtit span{display:block;font:500 12px/1.3 "IBM Plex Mono",monospace;color:var(--muted);margin-top:3px}
.wac{display:flex;gap:8px;flex-wrap:wrap}
.wnav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.wmes{font:700 19px/1 "Bricolage Grotesque",sans-serif;flex:1;text-transform:capitalize}
.wgrade{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:20px}
.wsem{font:700 10px/1 "IBM Plex Mono",monospace;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding-bottom:5px}
.wvazio{aspect-ratio:1}
.wdia{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:default;padding:0}
.wdia .wn{font:600 17px/1 "IBM Plex Mono",monospace;color:var(--ink-2);font-variant-numeric:tabular-nums}

.witem .ws{font:500 12.5px/1.4 "IBM Plex Mono",monospace;color:var(--muted);margin-top:5px}
.witem.feito .wt{text-decoration:line-through;color:var(--muted)}
.witem.crit{border-color:var(--rosa);border-left:4px solid var(--rosa)}
.witem.crit .ws{color:var(--rosa);font-weight:600}
.witem.aten{border-left:4px solid var(--ambar)}
.wnum{text-align:center;padding:14px 0 22px}
.wnum b{display:block;font:800 68px/1 "IBM Plex Mono",monospace;letter-spacing:-.05em;color:var(--azul)}
.wnum span{display:block;font:600 14px/1 "Source Sans 3",sans-serif;color:var(--muted);margin-top:8px}
.wmal{display:inline-block;margin-top:12px;background:var(--rosa-s);color:var(--rosa);font:700 12.5px/1 "IBM Plex Mono",monospace;padding:9px 14px;border-radius:9px}
.wlimpo{text-align:center;padding:46px 20px;background:var(--surface);border:1.5px dashed var(--line-2);border-radius:16px}
.wlimpo svg{width:38px;height:38px;stroke:var(--verde);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wlimpo b{display:block;font:700 21px/1.3 "Bricolage Grotesque",sans-serif;margin:12px 0 6px}
.wlimpo span{color:var(--muted);font-size:14.5px}
.wurl{font:400 11px/1.4 "IBM Plex Mono",monospace;color:var(--muted);background:var(--surf-2);padding:8px 10px;border-radius:8px;word-break:break-all}
.decs{display:flex; flex-direction:column; gap:11px}
.dec{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--azul); border-radius:14px; padding:15px 18px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--sh-s)}
.dec.d-violeta{border-left-color:var(--violeta)} .dec.d-ambar{border-left-color:var(--ambar)} .dec.d-teal{border-left-color:var(--teal)}
.dtopo{display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap}
/* botões que precisam saltar */
.bt.grita{background:var(--verde); border-color:var(--verde); color:var(--on-cor); font-weight:700; box-shadow:0 2px 0 color-mix(in srgb,var(--verde) 65%,black)}
.bt.grita:hover{color:var(--on-cor); filter:brightness(1.08)}
.bt.agenda{background:var(--azul); border-color:var(--azul); color:var(--on-cor); font-weight:700; box-shadow:0 2px 0 color-mix(in srgb,var(--azul) 65%,black)}
.bt.agenda:hover{color:var(--on-cor); filter:brightness(1.08)}
.bt.email{background:var(--violeta); border-color:var(--violeta); color:var(--on-cor); font-weight:700; box-shadow:0 2px 0 color-mix(in srgb,var(--violeta) 65%,black)}
.bt.email:hover{color:var(--on-cor); filter:brightness(1.08)}
.bt.badge{position:relative}
.bt.badge b{position:absolute; top:-7px; right:-7px; min-width:18px; height:18px; border-radius:99px; background:var(--rosa); color:var(--on-cor); font:700 10.5px/18px "IBM Plex Mono",monospace; text-align:center; padding:0 4px}
/* conversa */
.fio{display:flex; flex-direction:column; gap:9px; max-height:290px; overflow-y:auto; padding:4px 2px}
.rec{background:var(--surf-2); border-radius:12px; padding:10px 13px; max-width:88%}
.rec.meu{background:var(--azul-s); align-self:flex-end}
.rcab{display:flex; align-items:center; gap:8px; margin-bottom:5px}
.rq{font:600 12.5px/1 "Source Sans 3",sans-serif; color:var(--ink-2)}
.rh{font:400 11px/1 "IBM Plex Mono",monospace; color:var(--muted); margin-left:auto}
.rtx{font-size:14.5px; line-height:1.45; white-space:pre-wrap}
/* desafio */
.desafio{background:linear-gradient(135deg,var(--ouro),var(--ambar)); color:var(--on-cor); border-radius:16px; padding:19px 22px; margin-bottom:22px; box-shadow:var(--sh-l); display:flex; gap:18px; align-items:center; flex-wrap:wrap}
.desafio .ico2{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.desafio .ico2 svg{width:24px;height:24px;stroke:var(--on-cor);fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.desafio .tx{flex:1;min-width:230px}
.desafio .tx b{display:block;font:700 18px/1.3 "Bricolage Grotesque",sans-serif;margin-bottom:4px}
.desafio .tx span{font-size:14px;opacity:.92;line-height:1.5}
.desafio .barra{background:rgba(255,255,255,.25);margin-top:10px}
.desafio .barra i{background:var(--on-cor)}
.desafio .premio{font:700 12px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.22);padding:8px 12px;border-radius:8px;white-space:nowrap}
/* pergunta */
.pergunta{background:var(--surface);border:2px solid var(--ambar);border-radius:16px;padding:19px 22px;margin-bottom:22px;box-shadow:var(--sh-m)}
.pergunta b{display:block;font:700 19px/1.35 "Bricolage Grotesque",sans-serif;margin-bottom:7px;color:var(--ink)}
.pergunta p{color:var(--muted);font-size:14.5px;margin:0 0 14px}
.pergunta .ac2{display:flex;gap:9px;flex-wrap:wrap}
.procs{display:flex; flex-direction:column; gap:11px}
.proc{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--azul); border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--sh-s); transition:.15s}
.proc:hover{box-shadow:var(--sh-m)}
.proc.u{border-left-color:var(--ambar)} .proc.x{border-left-color:var(--rosa)} .proc.ok{border-left-color:var(--verde)}
.ptopo{display:flex; justify-content:space-between; gap:14px; align-items:flex-start; flex-wrap:wrap}
.pnome{font:700 17px/1.3 "Bricolage Grotesque",sans-serif; letter-spacing:-.015em}
.pmeta{font:400 12.5px/1.5 "IBM Plex Mono",monospace; color:var(--muted); display:flex; flex-wrap:wrap; gap:2px 13px; margin-top:4px}
.pmeta .pr{color:var(--ink-2); font-weight:500}
.psit{font:700 11px/1 "IBM Plex Mono",monospace; letter-spacing:.05em; text-transform:uppercase; padding:7px 11px; border-radius:7px; background:var(--azul-s); color:var(--azul); white-space:nowrap}
.psit.u{background:var(--ambar-s); color:var(--ambar)}
.psit.x{background:var(--rosa-s); color:var(--rosa)}
.psit.ok{background:var(--verde-s); color:var(--verde)}
.pnums{display:flex; gap:24px; flex-wrap:wrap; padding:2px 0}
.pnums b{display:block; font:700 19px/1 "IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; letter-spacing:-.03em}
.pnums span{display:block; font:500 10.5px/1 "IBM Plex Mono",monospace; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:4px}
.plista{display:flex; flex-direction:column; gap:5px; border-top:1px dashed var(--line); padding-top:11px}
.pitem{display:flex; align-items:center; gap:11px; flex-wrap:wrap}
.pitem input{width:17px;height:17px;accent-color:var(--verde);cursor:pointer;flex:none}
.pq2{font:600 12px/1 "IBM Plex Mono",monospace; color:var(--ink-2); min-width:74px}
.pt3{font-size:14.5px; flex:1; min-width:150px}
.dois{display:grid; grid-template-columns:minmax(280px,360px) 1fr; gap:16px; align-items:start}
.coluna{display:flex; flex-direction:column; gap:8px; max-height:74vh; overflow-y:auto; padding-right:4px}
.coluna.dir2{max-height:none; overflow:visible}
.notif{text-align:left; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--line-2); border-radius:11px; padding:11px 13px; cursor:pointer; display:flex; flex-direction:column; gap:5px; transition:.13s}
.notif:hover{border-color:var(--azul)}
.notif.sel{border-color:var(--azul); border-left-color:var(--azul); background:var(--azul-s); box-shadow:var(--sh-s)}
.notif:focus-visible{outline:2px solid var(--azul); outline-offset:2px}
.n1{display:flex; gap:7px; align-items:center; flex-wrap:wrap}
.nd{font:700 12px/1 "IBM Plex Mono",monospace; color:var(--ink-2)}
.n2{font:600 14.5px/1.3 "Source Sans 3",sans-serif; color:var(--ink)}
.n3{font:400 11.5px/1.4 "IBM Plex Mono",monospace; color:var(--muted)}
.bloco{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:17px 19px; display:flex; flex-direction:column; gap:11px}
.bt2{font:700 10.5px/1 "IBM Plex Mono",monospace; letter-spacing:.13em; text-transform:uppercase; color:var(--muted)}
.tripla{display:grid; grid-template-columns:2fr 1fr 1.6fr; gap:11px}
@media (max-width:900px){ .dois{grid-template-columns:1fr} .coluna{max-height:340px} .tripla{grid-template-columns:1fr} }
.atos{display:grid; grid-template-columns:repeat(auto-fill,minmax(178px,1fr)); gap:8px}
.ato{text-align:left; border:1.5px solid var(--line-2); background:var(--surface); border-radius:11px; padding:11px 13px; cursor:pointer; display:flex; flex-direction:column; gap:3px; transition:.15s}
.ato:hover{border-color:var(--azul)}
.ato b{font:600 14px/1.25 "Source Sans 3",sans-serif; color:var(--ink)}
.ato span{font:400 11px/1.35 "IBM Plex Mono",monospace; color:var(--muted)}
.ato i{font:600 11.5px/1 "IBM Plex Mono",monospace; font-style:normal; color:var(--azul); margin-top:2px}
.ato.on{border-color:var(--azul); background:var(--azul-s)}
.ato.on b{color:var(--azul)}
.ato:focus-visible{outline:2px solid var(--azul); outline-offset:2px}
.card.dispensada{opacity:.6}
.card.dispensada .ct{text-decoration:line-through; text-decoration-color:var(--muted)}
.caixa{background:linear-gradient(135deg,var(--violeta),var(--azul)); color:var(--on-cor); border-radius:16px; padding:20px 22px; margin-bottom:22px; box-shadow:var(--sh-l); display:flex; gap:18px; align-items:center; flex-wrap:wrap}
.caixa .qt{font:700 40px/1 "IBM Plex Mono",monospace; letter-spacing:-.04em}
.caixa .tx{flex:1; min-width:220px}
.caixa .tx b{display:block; font:700 18px/1.3 "Bricolage Grotesque",sans-serif; margin-bottom:4px}
.caixa .tx span{font-size:14px; opacity:.88; line-height:1.5}
.caixa .bt{background:rgba(255,255,255,.18); border-color:transparent; color:var(--on-cor)}
.caixa .bt:hover{background:rgba(255,255,255,.3); color:var(--on-cor)}
.novo-pill{background:var(--violeta); color:var(--on-cor); animation:pisca 1.6s ease-in-out 3}
@keyframes pisca{0%,100%{opacity:1}50%{opacity:.45}}
.card.perdeu{border-color:var(--rosa); box-shadow:0 0 0 1px var(--rosa) inset, var(--sh-m)}
.card.c-perdeu .fl .m{background:var(--rosa)} .card.c-perdeu .fl .d{color:var(--rosa)}
.tag.t-perdeu{background:var(--rosa); color:var(--on-cor); letter-spacing:.13em}
.prazos{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 8px}
.pz{display:inline-flex; align-items:baseline; gap:5px; font:500 12px/1 "IBM Plex Mono",monospace; padding:6px 10px; border-radius:7px; background:var(--surf-2); color:var(--ink-2)}
.pz b{font-weight:700; font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.pz.fatal{background:var(--azul-s); color:var(--azul)} .pz.fatal b{color:var(--azul); opacity:.7}
.pz.agora{background:var(--ambar-s); color:var(--ambar)} .pz.agora b{color:var(--ambar); opacity:.75}
.pz.ruim{background:var(--rosa-s); color:var(--rosa)} .pz.ruim b{color:var(--rosa); opacity:.75}

/* ---------- avatar / pessoas ---------- */
.av{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font:700 10.5px/1 "IBM Plex Mono",monospace; color:var(--on-cor); flex:none; letter-spacing:-.02em}
.av.g{width:40px; height:40px; font-size:14px}
.quem{display:inline-flex; align-items:center; gap:7px; font:600 12.5px/1 "Source Sans 3",sans-serif; color:var(--ink-2); background:var(--surf-2); padding:5px 11px 5px 5px; border-radius:99px}
.quem .av{width:20px; height:20px; font-size:9px}

/* ---------- lista to-do ---------- */
.tarefa{display:grid; grid-template-columns:24px 1fr auto; gap:14px; align-items:start; padding:13px 15px; border-radius:12px; border:1px solid transparent; transition:.15s}
.tarefa:hover{background:var(--surface); border-color:var(--line)}
.tarefa input[type=checkbox]{width:19px; height:19px; margin:2px 0 0; accent-color:var(--verde); cursor:pointer}
.tarefa .tt{font-size:15.5px; line-height:1.42}
.tarefa .ts{font:400 12.5px/1.5 "IBM Plex Mono",monospace; color:var(--muted); margin-top:5px; display:flex; flex-wrap:wrap; gap:2px 13px; align-items:center}
.tarefa.done .tt{text-decoration:line-through; text-decoration-color:var(--muted); color:var(--muted)}
.mesbloco{margin-bottom:28px}
.mesbloco h3{display:flex; justify-content:space-between; align-items:center; gap:14px; margin:0 0 12px; padding-bottom:10px; border-bottom:1px solid var(--line)}
.mesbloco h3 .mn{font:700 19px/1 "Bricolage Grotesque",sans-serif; letter-spacing:-.015em}
.mesbloco h3 .mp{display:flex; align-items:center; gap:10px; font:600 12px/1 "IBM Plex Mono",monospace; color:var(--muted)}
.mini{width:30px; height:30px; position:relative; flex:none}
.mini svg{transform:rotate(-90deg); display:block}
.mini .tk{fill:none; stroke:var(--surf-3); stroke-width:4}
.mini .fl2{fill:none; stroke:var(--verde); stroke-width:4; stroke-linecap:round; transition:stroke-dashoffset .6s}

/* ---------- equipe ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:13px}
.pcard{background:var(--surface); border:1px solid var(--line); border-radius:15px; padding:17px 19px; box-shadow:var(--sh-s); display:flex; flex-direction:column; gap:13px}
.pcard .top{display:flex; align-items:center; gap:12px}
.pcard .nm{font:600 16px/1.25 "Source Sans 3",sans-serif}
.pcard .pp{font:500 11.5px/1.35 "IBM Plex Mono",monospace; color:var(--muted); margin-top:2px}
.pcard .nums{display:flex; gap:18px}
.pcard .nums div b{display:block; font:700 21px/1 "IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.pcard .nums div span{font:500 10.5px/1 "IBM Plex Mono",monospace; color:var(--muted); text-transform:uppercase; letter-spacing:.08em}
.podio{display:flex; flex-direction:column; gap:9px; margin-bottom:22px}
.pod{display:grid; grid-template-columns:30px 30px 1fr auto; gap:13px; align-items:center; padding:11px 15px; background:var(--surface); border:1px solid var(--line); border-radius:12px}
.pod .pos{font:700 15px/1 "IBM Plex Mono",monospace; color:var(--muted); text-align:center}
.pod.p1 .pos{color:var(--ouro)} .pod.p2 .pos{color:var(--muted)} .pod.p3 .pos{color:var(--ambar)}
.pod .nm{font-weight:600; font-size:15px}
.pod .sc{font:700 15px/1 "IBM Plex Mono",monospace; color:var(--ouro); font-variant-numeric:tabular-nums}

/* ---------- diálogo ---------- */
.fundo{position:fixed; inset:0; background:rgba(10,16,30,.55); z-index:100; display:none; padding:24px; overflow-y:auto}
.fundo.on{display:grid; place-items:start center}
.modal{background:var(--surface); border-radius:18px; box-shadow:var(--sh-l); width:min(560px,100%); margin-top:6vh; padding:26px 28px 24px; border:1px solid var(--line)}
.modal h3{font:700 22px/1.2 "Bricolage Grotesque",sans-serif; margin:0 0 6px; letter-spacing:-.02em}
.modal .sb{color:var(--muted); font-size:14px; margin:0 0 20px; line-height:1.5}
.campos{display:flex; flex-direction:column; gap:15px}
.dupla{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.acoes{display:flex; gap:10px; justify-content:flex-end; margin-top:22px; flex-wrap:wrap}
.cores{display:flex; gap:8px; flex-wrap:wrap}
.cores button{width:32px; height:32px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0}
.cores button[aria-pressed="true"]{border-color:var(--ink); transform:scale(1.12)}

/* ---------- avisos e vazios ---------- */
.aviso{display:flex; gap:13px; align-items:flex-start; border-radius:13px; padding:15px 18px; font-size:14.5px; line-height:1.55; margin-bottom:24px}
.aviso.amb{background:var(--ambar-s); color:var(--ink-2)}
.aviso.az{background:var(--azul-s); color:var(--ink-2)}
.aviso .k{font:700 10.5px/1.6 "IBM Plex Mono",monospace; letter-spacing:.11em; text-transform:uppercase; flex:none}
.aviso.amb .k{color:var(--ambar)} .aviso.az .k{color:var(--azul)}
.aviso strong{color:var(--ink)}
.vazio{padding:52px 26px; text-align:center; background:var(--surface); border:1.5px dashed var(--line-2); border-radius:16px}
.vazio .ic{width:52px; height:52px; margin:0 auto 15px; border-radius:16px; background:var(--azul-s); display:grid; place-items:center}
.vazio .ic svg{width:25px; height:25px; stroke:var(--azul); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.vazio b{display:block; font:700 20px/1.3 "Bricolage Grotesque",sans-serif; margin-bottom:8px; letter-spacing:-.015em}
.vazio p{color:var(--muted); margin:0 auto 18px; max-width:46ch; font-size:14.5px}

/* ---------- boas-vindas ---------- */
.hero{text-align:center; padding:52px 24px 42px}
.hero .logo{width:60px; height:60px; border-radius:19px; margin:0 auto 20px}
.hero .logo svg{width:31px; height:31px}
.hero h1{font:800 42px/1.08 "Bricolage Grotesque",sans-serif; margin:0 0 13px; letter-spacing:-.03em}
.hero p{color:var(--muted); max-width:52ch; margin:0 auto; font-size:16.5px; line-height:1.6}
.passos{display:grid; grid-template-columns:repeat(auto-fit,minmax(258px,1fr)); gap:14px; margin:34px 0 0}
.passo{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:22px; text-align:left; box-shadow:var(--sh-s); display:flex; flex-direction:column; gap:11px}
.passo .num{width:29px; height:29px; border-radius:9px; display:grid; place-items:center; font:700 13px/1 "IBM Plex Mono",monospace; color:var(--on-cor)}
.passo b{font:700 17px/1.25 "Bricolage Grotesque",sans-serif; letter-spacing:-.015em}
.passo p{color:var(--muted); font-size:14px; line-height:1.55; margin:0; flex:1}

/* ---------- tabela config ---------- */
.tab{width:100%; border-collapse:collapse; font-size:14.5px}
.tab th{text-align:left; font:700 10.5px/1 "IBM Plex Mono",monospace; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); padding:0 12px 11px; border-bottom:1px solid var(--line)}
.tab td{padding:13px 12px; border-bottom:1px solid var(--line)}
.tab tr:last-child td{border-bottom:0}
.mono{font:500 13px/1.5 "IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}

.rodape{border-top:1px solid var(--line); margin-top:56px; padding-top:28px; color:var(--muted); font-size:13.5px; line-height:1.65}
.rodape .cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:32px}
.rodape h4{font:700 10.5px/1 "IBM Plex Mono",monospace; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-2); margin:0 0 11px}
.rodape p{margin:0 0 11px; max-width:70ch}
.rodape code{font:500 12.5px/1 "IBM Plex Mono",monospace; color:var(--ink-2)}
.esconde{display:none !important}

@media (max-width:980px){ .placar{grid-template-columns:1fr} }
@media (max-width:760px){

<script>
"use strict";
const SEMENTE = null;

/* ===================== utilidades ===================== */
const $ = id => document.getElementById(id);
const el = (t,c,x) => { const n = document.createElement(t); if(c) n.className = c; if(x != null) n.textContent = x; return n; };
const NS = "http://www.w3.org/2000/svg";
const sv = (t,a) => { const n = document.createElementNS(NS,t); for(const k in a) n.setAttribute(k,a[k]); return n; };
const ico = d => { const s = sv("svg",{viewBox:"0 0 24 24"}); s.appendChild(sv("path",{d})); return s; };
const I = {
  check:"M4 12.5l5 5L20 6.5", mais:"M12 5v14M5 12h14", pessoa:"M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 3.6-6 8-6s8 2 8 6",
  calend:"M7 3v3M17 3v3M3.5 9h17M5 5h14a1.5 1.5 0 0 1 1.5 1.5v13A1.5 1.5 0 0 1 19 21H5a1.5 1.5 0 0 1-1.5-1.5v-13A1.5 1.5 0 0 1 5 5z",

  estrela:"M12 3l2.8 6 6.2.8-4.5 4.4 1.1 6.3L12 17.6 6.4 20.5l1.1-6.3L3 9.8 9.2 9 12 3z", raio:"M13 2L4.5 13.5H11l-1 8.5L19.5 10H13l0-8z",
  fogo:"M12 22c4 0 7-2.7 7-6.5 0-4.5-4-6-4-10.5 0 0-3 1.5-3 5 0 1.5-1 2-1.5 1.2C10 10 9.5 9 9.5 7.5 7 9.5 5 12 5 15.5 5 19.3 8 22 12 22z",
  lixo:"M4 7h16M9.5 7V5h5v2M6.5 7l1 13h9l1-13", lapis:"M4 20h4L20 8l-4-4L4 16v4z", baixar:"M12 3v13M7 12l5 5 5-5M4.5 21h15",
  alvo:"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2z",
  seta:"M5 12h14M13 6l6 6-6 6", troca:"M4 8h13l-3-3M20 16H7l3 3",
};
const CORES = ["#2E5BD8","#0E9F63","#DE8A08","#DB2F4C","#7A45D6","#0C9AA0","#C2410C","#5B21B6"];
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MES3 = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const br = s => s ? s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4) : "";
const isoDe = d => d.toISOString().slice(0,10);
/* isoDe serve para as contas de dias úteis, que são feitas em datas UTC puras
   (new Date(iso+"T00:00:00Z")) e por isso estão certas. Mas o dia de HOJE tem
   que sair do relógio LOCAL: no Brasil (UTC-3), depois das 21h o toISOString()
   já aponta para amanhã, e o painel marcaria os prazos de hoje como perdidos. */
const dataLocal = (d = new Date()) =>
  d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const horaLocal = iso => { const d = new Date(iso); return isNaN(d) ? "" : String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); };
const HOJE = dataLocal();
const uid = () => "x" + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
/* Busca tolerante. Medido no acervo real: 19% dos nomes de parte têm acento,
   que ninguém digita, e a ordem trocada não achava nada (buscar o sobrenome
   antes do nome dava zero; na ordem certa, quatro). A correção é normalizar
   os dois lados e exigir que TODAS as palavras apareçam, em qualquer ordem. */
const normaliza = t => String(t || "")
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")   // tira acento e cedilha
  .toLowerCase()
  .replace(/[.,;:/()\[\]{}'"\-]+/g, " ")             // pontuação vira espaço
  .replace(/\s+/g, " ").trim();
function combina(consulta, ...campos){
  const q = normaliza(consulta);
  if (!q) return true;
  const alvo = normaliza(campos.filter(Boolean).join(" "));
  /* número de processo: compara só os dígitos, para achar com ou sem máscara */
  const digQ = String(consulta).replace(/\D/g, "");
  if (digQ.length >= 6){
    const digA = campos.filter(Boolean).join(" ").replace(/\D/g, "");
    if (digA.includes(digQ)) return true;
  }
  return q.split(" ").every(p => alvo.includes(p));
}

const iniciais = n => n.trim().split(/\s+/).filter(p => p.length > 2 || /^[A-ZÀ-Ú]/.test(p)).slice(0,2).map(p => p[0]).join("").toUpperCase() || "?";

/* ---- dias úteis: feriados nacionais calculados (Páscoa → Carnaval, Sexta Santa, Corpus Christi) ---- */
function pascoa(ano){
  const a=ano%19,b=Math.floor(ano/100),c=ano%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),
    g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,
    m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;
  return new Date(Date.UTC(ano,mes-1,dia));
}
const FER = new Set();
(function(){ const y = new Date().getUTCFullYear();
  for (let ano = y-1; ano <= y+2; ano++){
    const p = pascoa(ano), mv = n => isoDe(new Date(p.getTime()+n*864e5));
    [`${ano}-01-01`,mv(-48),mv(-47),mv(-2),`${ano}-04-21`,`${ano}-05-01`,mv(60),
     `${ano}-09-07`,`${ano}-10-12`,`${ano}-11-02`,`${ano}-11-15`,`${ano}-11-20`,`${ano}-12-25`].forEach(f => FER.add(f));
  }
})();
const util = d => d.getUTCDay() !== 0 && d.getUTCDay() !== 6 && !FER.has(isoDe(d));
const proxUtil = d => { const x = new Date(d); do { x.setUTCDate(x.getUTCDate()+1); } while(!util(x)); return x; };
const somaUteis = (d,n) => { let x = new Date(d); for(let i=0;i<n;i++) x = proxUtil(x); return x; };
const antUtil = d => { const x = new Date(d); do { x.setUTCDate(x.getUTCDate()-1); } while(!util(x)); return x; };
const subUteis = (d,n) => { let x = new Date(d); for(let i=0;i<n;i++) x = antUtil(x); return x; };
const internoDe = iso => iso ? isoDe(subUteis(new Date(iso+"T00:00:00Z"), Math.max(0, E.antecedencia||0))) : null;
function uteisEntre(a,b){ let n=0; const d=new Date(a+"T00:00:00Z"), f=new Date(b+"T00:00:00Z");
  while(d<f){ d.setUTCDate(d.getUTCDate()+1); if(util(d)) n++; } return n; }

/* ===================== estado ===================== */
const CHAVE = "painel-prazos-v2";
const vazio = () => ({ versao:6, oabs:[], pessoas:[], tarefas:[], djen:[], buscadoEm:null, janelaDias:60, antecedencia:3, time:null,
  processos:[], paralelo:[], paraleloEm:null, paraleloDias:30, recados:[], emailFinanceiro:null, desafioEm:null });
let E = vazio();
try { const s = localStorage.getItem(CHAVE); if (s) E = Object.assign(vazio(), JSON.parse(s)); } catch(e){}
/* Migração v3 -> v4: a lista "feitos" vira um campo em cada item, para a
   sincronização poder reconciliar item a item. */
if (Array.isArray(E.feitos)){
  const marcados = new Set(E.feitos.map(String));
  E.djen.forEach(i => { if (marcados.has("d" + i.id)) i.feita = true; });
  E.tarefas.forEach(t => { if (marcados.has("t" + t.id)) t.feita = true; });
  delete E.feitos;
}
function salvar(){ try { localStorage.setItem(CHAVE, JSON.stringify(E)); } catch(e){} }
const configurado = () => E.oabs.length || E.djen.length || E.tarefas.length || E.pessoas.length || !!E.time || E.processos.length;

let aba = "painel", filtro = "tudo", busca = "", buscaPar = "", medalhasAntes = new Set(), primeira = true;
let notifSel = null, filtroAgenda = "todos", filtroNotif = "pend", buscandoNovas = false;
let buscaProc = "", filtroProc = "todos", buscaDec = "", filtroDec = "todas";
let widgetMes = 0, widgetDia = null;
function casaParalelo(i){
  return combina(buscaPar, i.proc, i.trib, i.orgao, i.rotulo, i.classe, i.tipo,
    (i.partes || []).join(" "), i.resumo);
}
let podeBuscar = null; // null = ainda não testado

/* ===================== providências (DJEN + manuais) ===================== */
const PESO = { sessao:15, prazo:10, acao:5, manual:8 };
const pessoasVivas = () => E.pessoas.filter(p => !p.removido);
/* Sem saber QUAL pessoa da equipe eu sou, não há como dizer "passaram para você". */
const euSou = () => (E.time && E.time.pessoaId) ? pessoaDe(E.time.pessoaId) : null;
const souEu = id => !!(E.time && E.time.pessoaId && id === E.time.pessoaId);
const pessoaDe = id => E.pessoas.find(p => p.id === id && !p.removido) || null;

/* Estados. O prazo FATAL é a data do ato; o prazo INTERNO é o fatal menos a
   antecedência configurada, em dias úteis. "Perdeu" quer dizer: o fatal passou
   e nada foi marcado como feito AQUI — não é afirmação sobre os autos. */
function estadoDe(p){
  if (p.dispensada) return "dispensada";
  if (p.feita) return "feita";
  if (!p.data) return "semdata";
  if (p.tipo === "sessao") return p.data < HOJE ? "passou" : "sessao";
  const int = internoDe(p.data);
  if (p.data < HOJE) return "perdeu";
  if (p.data === HOJE) return "fatalhoje";
  if (int < HOJE) return "atrasado";
  if (int === HOJE) return "comecarhoje";
  if (uteisEntre(HOJE, int) <= 2) return "atencao";
  return "emdia";
}
const ROTULO = {
  perdeu:      { cor:"perdeu",  tag:"t-perdeu",  txt:"PERDEU" },
  fatalhoje:   { cor:"rosa",    tag:"t-rosa",    txt:"Fatal é HOJE" },
  atrasado:    { cor:"rosa",    tag:"t-rosa",    txt:"Atrasado" },
  comecarhoje: { cor:"ambar",   tag:"t-ambar",   txt:"Começar hoje" },
  atencao:     { cor:"ambar",   tag:"t-ambar",   txt:"Preparar" },
  emdia:       { cor:"azul",    tag:"t-azul",    txt:"Em dia" },
  sessao:      { cor:"violeta", tag:"t-violeta", txt:"Sessão de julgamento" },
  passou:      { cor:"cinza",   tag:"",          txt:"Sessão realizada" },
  feita:       { cor:"cinza",   tag:"t-verde",   txt:"Concluída" },
  dispensada:  { cor:"cinza",   tag:"",          txt:"Dispensada" },
  semdata:     { cor:"cinza",   tag:"",          txt:"Sem data" },
};

function provDjen(){
  return E.djen.filter(i => !i.removido && (i.sessao || i.fim || (i.acoes && i.acoes.length))).map(i => ({
    key:"d"+i.id, fonte:"djen", bruto:i,
    tipo: i.sessao ? "sessao" : i.fim ? "prazo" : "acao",
    data: i.fim || i.sessao || i.disp,
    titulo: i.sessao ? "Preparar memorial / sustentação oral" : (i.acoes[0] || "Cumprir o determinado"),
    quem: i.pessoaId || null,
    feita: !!i.feita, quemFez: i.feitaPor || null,
    dispensada: !!i.dispensada, motivo: i.motivoDispensa || null, dePor: i.delegadaPorNome || null,
  }));
}
function provManual(){
  return E.tarefas.filter(t => !t.removido).map(t => ({
    key:"t"+t.id, fonte:"manual", bruto:t, tipo:"manual",
    data: t.prazo || null, titulo: t.titulo, quem: t.pessoaId || null, feita: !!t.feita, quemFez: t.feitaPor || null,
    dispensada: !!t.dispensada, motivo: t.motivoDispensa || null, dePor: t.delegadaPorNome || null,
  }));
}
const TODAS = () => provDjen().concat(provManual());

function casa(p){
  const b = p.bruto;
  return combina(busca, p.titulo, b.proc, b.trib, b.orgao, b.processo,
    (b.partes || []).join(" "), (b.advs || []).join(" "),
    (pessoaDe(p.quem) || {}).nome, b.nota, b.classe);
}
const atrasada = p => ["atrasado","fatalhoje"].includes(estadoDe(p));
const perdida = p => estadoDe(p) === "perdeu";
const minha = p => souEu(p.quem);
const novaParaMim = p => minha(p) && !p.feita && !p.dispensada && p.bruto.delegadaPor
  && p.bruto.delegadaPor !== (E.time && E.time.pessoaId)
  && !(p.bruto.vistaPor || []).includes(E.time && E.time.pessoaId);
function marcarVista(p){
  const alvo = p.fonte === "manual" ? p.bruto : E.djen.find(x => x.id === p.bruto.id);
  if (!alvo || !E.time || !E.time.pessoaId) return;
  alvo.vistaPor = [...new Set([...(alvo.vistaPor || []), E.time.pessoaId])];
  tocou(alvo); salvar();
}
function passa(p){
  if (filtro === "tudo") return true;
  if (filtro === "aberto") return !p.feita && !p.dispensada;
  if (filtro === "urgente") return !p.feita && !!p.data && p.data >= HOJE && uteisEntre(HOJE,p.data) <= 5;
  if (filtro === "paramim") return minha(p) && !p.feita && !p.dispensada;
  if (filtro === "dispensada") return p.dispensada;
  if (filtro === "perdeu") return perdida(p);
  if (filtro === "atraso") return atrasada(p);
  if (filtro === "minhas") return !p.feita && !p.quem;
  if (filtro === "delegadas") return !p.feita && !!p.quem;
  if (filtro === "feito") return p.feita;
  return true;
}
const base = () => TODAS().filter(casa);
const vis = () => base().filter(passa);

function dlgDispensar(p){
  const motivo = entrada("text", "", "Ex.: não precisa de ED neste caso");
  modal("Dispensar sem fazer", "Use quando a providência apareceu mas não é necessária. Ela sai da contagem de pendências e para de cobrar, mas continua registrada com o motivo.",
    [campo("Por que não precisa?", motivo)],
    () => {
      const alvo = p.fonte === "manual" ? p.bruto : E.djen.find(x => x.id === p.bruto.id);
      if (alvo){
        alvo.dispensada = true;
        alvo.motivoDispensa = motivo.value.trim() || "sem motivo informado";
        alvo.dispensadaPor = (euSou() || {}).nome || (E.time && E.time.meuNome) || null;
        alvo.dispensadaEm = agoraISO();
        tocou(alvo);
      }
      if (aba === "notif") proximaNotificacao(p.bruto.id);
      salvar(); render();
      avisar("Dispensada: " + (motivo.value.trim() || "sem motivo"));
      return true;
    }, "Dispensar");
}
function reativar(p){
  const alvo = p.fonte === "manual" ? p.bruto : E.djen.find(x => x.id === p.bruto.id);
  if (alvo){ alvo.dispensada = false; alvo.motivoDispensa = null; tocou(alvo); }
  salvar(); render();
}

/* ---------- desdobrar a intimação em providências ----------
   Uma intimação não é uma tarefa: dela podem sair várias (ED e pagamento, por
   exemplo). Os prazos abaixo são o PADRÃO da lei para o ato, contados a partir
   da publicação daquela intimação. São sugestão editável — o juiz pode fixar
   outro, o tribunal pode suspender, e a conferência nos autos continua sendo
   de quem assina. */
const ATOS = [
  { id:"ed",        rot:"Embargos de declaração",   dias:5,  base:"CPC art. 1.023" },
  { id:"apelacao",  rot:"Apelação",                 dias:15, base:"CPC art. 1.003, §5º" },
  { id:"contra",    rot:"Contrarrazões",            dias:15, base:"CPC art. 1.010, §1º" },
  { id:"agravo",    rot:"Agravo de instrumento",    dias:15, base:"CPC art. 1.003, §5º" },
  { id:"ai",        rot:"Agravo interno",           dias:15, base:"CPC art. 1.021, §2º" },
  { id:"ro",        rot:"Recurso ordinário",        dias:8,  base:"CLT art. 895 c/c 775" },
  { id:"ri",        rot:"Recurso inominado",        dias:10, base:"Lei 9.099/95, art. 42" },
  { id:"resp",      rot:"REsp / RE",                dias:15, base:"CPC art. 1.003, §5º" },
  { id:"manif",     rot:"Manifestação",             dias:15, base:"CPC art. 218, §3º" },
  { id:"impug",     rot:"Impugnação",               dias:15, base:"CPC art. 525" },
  { id:"pagar",     rot:"Pagamento",                dias:15, base:"CPC art. 523" },
  { id:"custas",    rot:"Custas / preparo",         dias:5,  base:"conferir no ato" },
  { id:"provas",    rot:"Especificar provas",       dias:15, base:"CPC art. 357" },
  { id:"ciencia",   rot:"Só ciência",               dias:0,  base:"sem prazo a cumprir" },
];

/* Prazo do ato contado a partir da publicação DAQUELA intimação. */
function prazoDoAto(item, dias){
  if (!dias) return null;
  const ini = item.inicio ? new Date(item.inicio + "T00:00:00Z") : proxUtil(proxUtil(new Date(item.disp + "T00:00:00Z")));
  return isoDe(somaUteis(ini, dias - 1));
}

function dlgDesdobrar(p){
  const b = p.bruto;
  const escolhidos = new Map();
  const st = el("p","sb",""); st.style.cssText = "margin:0;font-weight:600;color:var(--azul)";

  const grade = el("div","atos");
  function pinta(){
    const total = escolhidos.size;
    st.textContent = total ? total + (total === 1 ? " providência será criada" : " providências serão criadas") : "Escolha o que essa intimação exige.";
  }
  ATOS.forEach(a => {
    const bt = el("button","ato"); bt.type = "button";
    bt.appendChild(el("b", null, a.rot));
    bt.appendChild(el("span", null, a.dias ? a.dias + " dias úteis · " + a.base : a.base));
    const venc = prazoDoAto(b, a.dias);
    if (venc) bt.appendChild(el("i", null, "vence " + br(venc)));
    bt.addEventListener("click", () => {
      if (escolhidos.has(a.id)) { escolhidos.delete(a.id); bt.classList.remove("on"); }
      else { escolhidos.set(a.id, a); bt.classList.add("on"); }
      pinta();
    });
    grade.appendChild(bt);
  });

  const outro = entrada("text", "", "Ex.: cumprir diligência, juntar procuração…");
  const outroDias = entrada("number", "", "dias úteis");
  outroDias.min = "0"; outroDias.max = "180";
  const dupla = el("div","dupla");
  dupla.appendChild(campo("Outra providência", outro));
  dupla.appendChild(campo("Prazo (dias úteis)", outroDias));

  const quem = selPessoa("");
  pinta();

  modal("O que essa intimação exige?",
    "Marque quantas quiser — uma intimação pode gerar mais de uma providência. O prazo é contado a partir da publicação desta intimação (" + br(b.pub) + ") e você pode editar depois.",
    [grade, st, dupla, campo("Delegar para (opcional)", quem)],
    () => {
      const criar = [...escolhidos.values()].map(a => ({ rot: a.rot, dias: a.dias }));
      const livre = outro.value.trim();
      if (livre) criar.push({ rot: livre, dias: parseInt(outroDias.value, 10) || 0 });

        const t = {

      });

}
